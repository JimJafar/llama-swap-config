      -ub 256
      -ctk q8_0
      -ctv q8_0
      --temp 1.0
      --top-p 0.95
      --top-k 64
      --reasoning-budget -1
      --chat-template-kwargs "{\"preserve_thinking\": true}"
      --timeout 900
      --no-context-shift
      --ctx-checkpoints 128
      --host 0.0.0.0
      --port 8080
    cmdStop: docker stop g31mtp

    # MoE + MTP (2026-06-12): ~140 -> ~184 t/s decode (+30%) — the fastest model here.
    # gemma-4-26B-A4B MoE (qat UD-Q4_K_XL) + its separate MTP draft, both from
    # unsloth/gemma-4-26B-A4B-it-qat-GGUF. ggml-org image (gemma MTP needs the newer
    # build). NO --swa-full -- gemma's iSWA would OOM with it (dual KV cache). The dense
    # gemma-4-31B-Q4-MTP above stays for higher coding quality; this is the speed pick.
    #
    # PLACEMENT (ZOTAC-only, single-GPU): pinned by UUID to the ZOTAC 5060 Ti (af5bd53f).
    # NO tensor-split / no --fit. --n-cpu-moe keeps as many MoE expert layers in the ZOTAC's
    # VRAM as fit beside the resident dictation (qwen-clean-2b, ~1.7 GB); the rest offload to
    # RAM (64 GB host, evictable). 16 = safe "max-on-GPU w/o evicting dictation" estimate --
    # lower toward 14-15 for more on GPU if stable; raise to 18-20 (or -ub 512->256) if it
    # OOMs or pushes dictation.
  gemma-4-26B-MoE-MTP:
    cmd: |
      docker run --rm --name g26moe --runtime nvidia --cap-add SYS_ADMIN --ulimit memlock=-1:-1
      -e CUDA_VISIBLE_DEVICES=GPU-57bbb375-a61a-6662-e9c8-447b948f0833
      -p ${PORT}:8080 -v /mnt/data/models:/models
      --entrypoint /app/llama-server ghcr.io/ggml-org/llama.cpp:server-cuda13
      -m /models/gemma-4/gemma-4-26B-A4B-it-qat-UD-Q4_K_XL.gguf
      -md /models/gemma-4/gemma-4-26B-A4B-it-Q8_0-MTP.gguf

      # Google's updated canonical Gemma-4 chat template (from google/gemma-4-26B-A4B-it;
      # byte-identical to the 31B one -- Google ships one shared template for gemma-4).
      # Needs --jinja for its macros.
      --jinja --chat-template-file /models/gemma-4/gemma-4-chat_template.jinja

      --spec-type draft-mtp
      --spec-draft-n-max 2
      -ngl 99
      --n-cpu-moe 16
      -ngld 99
      -c 256000
      -np 1
      -fa on
      --load-mode mlock
      -b 2048
      -ub 512
      -ctk q8_0
      -ctv q8_0
      --temp 1.0
      --top-p 0.95
      --top-k 64
      --timeout 900
      --no-context-shift
      --ctx-checkpoints 128
      --host 0.0.0.0
      --port 8080
    cmdStop: docker stop g26moe

  gemma-4-E4B-MTP:
    cmd: |
      docker run --rm --name ge4bmtp --runtime nvidia --cap-add SYS_ADMIN --ulimit memlock=-1:-1
      -e CUDA_VISIBLE_DEVICES=GPU-af5bd53f-a1ca-d807-1ae2-7f5ef261fe1a
      -p ${PORT}:8080 -v /mnt/data/models:/models
      --entrypoint /app/llama-server ghcr.io/ggml-org/llama.cpp:server-cuda13
      -m /models/gemma-4/gemma-4-E4B-it-UD-Q4_K_XL.gguf
      -md /models/gemma-4/mtp-gemma-4-E4B-it-BF16.gguf

      # Gemma-4's canonical chat template.
      --jinja --chat-template-file /models/gemma-4/gemma-4-chat_template.jinja

      --spec-type draft-mtp
      --spec-draft-n-max 2
      -ngl 99
      -ngld 99
      # 102400 (100K), not the model's native 131072: this let Gemma sit beside
      # the Tabby Qwen EXL3 split on the ZOTAC (entry deleted 2026-10-06). Gemma VRAM is linear
      # in context (3453 MiB + 0.018074*tokens, measured); 100K needs ~5304 MiB
      # of the ~5625 MiB left by Qwen. 131072 does NOT fit (-198 MiB).
      -c 102400
      -np 1
      -fa auto
      --load-mode mlock
      -b 2048
      -ub 512
      -ctk q8_0
      -ctv q8_0
      --temp 1.0
      --top-p 0.95
      --top-k 64
      --timeout 900
      --host 0.0.0.0
      --port 8080
    cmdStop: docker stop ge4bmtp

    # ################ #
    # EMBEDDING MODELS #
    # ################ #

    # bge-m3 (2026-10-10): markdown-rag's embedding model (vault + email search
    # on :8123, ~/code/markdown-rag). ZOTAC only, ~0.9 GiB, always resident
    # ("resident" group): markdown-rag embeds every query with it.
    # 8 slots x 4096 tokens: markdown-rag sends 8 parallel batches of 16
    # chunks of up to 2,000 characters; an embedding input must fit one
    # ubatch (-b/-ub).
    # The old entry spanned the 3090 + 5070 Ti + MSI with YaRN rope scaling
    # (0.75), which distorts bge-m3's vectors (it handles 8K natively). It had
    # no callers.
    # The index was embedded with exactly this GGUF and these flags: changing
    # either means re-embedding all ~41K chunks (about 10 minutes).
  bge-m3:
    unlisted: true
    cmd: |
      docker run --rm --name bge --runtime nvidia --cap-add SYS_ADMIN
      -e CUDA_VISIBLE_DEVICES=GPU-af5bd53f-a1ca-d807-1ae2-7f5ef261fe1a
      -p ${PORT}:8080 -v /mnt/data/models:/models
      --entrypoint /app/llama-server ghcr.io/ggml-org/llama.cpp:server-cuda13
      -m /models/bge-m3-FP16.gguf
      --embeddings
      -c 32768
      -b 4096
      -ub 4096
      -np 8
      -fa on
      --load-mode none
      --host 0.0.0.0
      --port 8080
    cmdStop: docker stop bge

    # Qwen3-Embedding-4B (added 2026-07-04): upgrade over bge-m3 for CODE retrieval.
    # Qwen3-Embedding is explicitly trained for code + 100 languages, tops MTEB, and is
    # vLLM-native (same ecosystem as the LLMs). 4B = quality/VRAM sweet spot on a 16GB
    # card (~8GB BF16, loads on one GPU, no TP). Use for indexing a codebase for RAG.
    # bge-m3 kept above for general multilingual dense+sparse; this one for code search.
    #
    # HARD-WON SETUP NOTES (2026-07-04):
    #  - `--runner pooling` is the embedding flag in vLLM 0.22 (the old `--task embed`
    #    is gone). It auto-configures LAST-token pooling for Qwen3-Embedding.
    #  - `--enforce-eager`: skip torch.compile/cudagraph capture. Right call for a
    #    swap-in embedder (fast start > peak throughput; a single forward pass barely
    #    benefits from cudagraphs). Without it, first start compiles for many minutes.
    #  - LOCAL PATH + HF_HUB_OFFLINE=1: point at the pre-downloaded dir, NOT the HF id.
    #    With the HF id, vLLM makes unauthenticated HF Hub calls at load that get
    #    rate-limited and HANG forever (model loads to VRAM then sits at 0% util). The
    #    model was snapshot_download'd to /mnt/data/models/Qwen3-Embedding-4B.
    #  - Pinned to one card (device 0). Embedding needs no TP; llama-swap serves one
    #    model at a time so it has the GPU to itself. Query the OpenAI /v1/embeddings
    #    endpoint with model=qwen3-embedding-4b. NB Qwen3-Embedding wants an instruction
    #    prefix on QUERIES (not documents) for best retrieval -- that's a client concern.
  qwen3-embedding-4b:
    unlisted: true
    cmd: |
      docker run --rm --name qwen3emb --runtime nvidia --ipc=host
      -e HF_HUB_OFFLINE=1 -e TRANSFORMERS_OFFLINE=1
      -e CUDA_DEVICE_ORDER=PCI_BUS_ID -e CUDA_VISIBLE_DEVICES=0
      -e VLLM_NO_USAGE_STATS=1
      -p ${PORT}:8000 -v /mnt/data/models:/models
      vllm/vllm-openai:latest
      --model /models/Qwen3-Embedding-4B
      --runner pooling
      --enforce-eager
      --served-model-name qwen3-embedding-4b
      --max-model-len 8192
      --gpu-memory-utilization 0.60
      --host 0.0.0.0
      --port 8000
    cmdStop: docker stop qwen3emb

    # ############### #
    # DICTATION       #
    # ############### #
    # Speech-to-text dictation pipeline (added 2026-07-26; ASR moved to the NPU 2026-08-04).
    # Capture (ASR on the NPU) + cleanup (LLM on the ZOTAC) kept RESIDENT TOGETHER via the
    # `dictation` group (swap:false; defined at the bottom of this file) so a capture ->
    # cleanup round trip never unloads/reloads between steps.
    #
    # ASR now runs ENTIRELY on the Core Ultra 7 265KF's NPU (13 TOPS) via OpenVINO GenAI's
    # static WhisperPipeline -- NO GPU, so the ASR leg works even while 3-GPU --fit models
    # hold GPU 0. Cleanup (qwen-clean-2b) is the only dictation member left on the ZOTAC.
    #
    # FLOW: POST /v1/audio/transcriptions (model=whisper-npu-asr) -> transcript
    #    -> POST /v1/chat/completions   (model=qwen-clean-2b) -> clean text.
    # llama-swap routes each request by its `model` field; the group keeps both loaded.
    #
    # --- ASR: distil-whisper/distil-medium.en (int8) on the Intel NPU --------------------
    # Added 2026-08-04 (replaces parakeet-asr as the primary dictation ASR). ~1.5s per clip
    # (fixed 30s-window encoder floor; still faster than real-time), WER closest to Parakeet
    # of the NPU options (~2% vs ~1.4% on LibriSpeech test-clean). Server: npu/asr_server.py
    # (FastAPI, OpenAI /v1/audio/transcriptions) over ov_genai.WhisperPipeline(device="NPU",
    # static). Export recipe + decoder patcher + full benchmark matrix: npu/README.md.
    # LD_LIBRARY_PATH is REQUIRED -- the rootless NPU Level Zero driver lives in the venv's
    # openvino/libs dir (the loader does not self-locate).
  whisper-npu-asr:
    checkEndpoint: /health
    env:
      - LD_LIBRARY_PATH=/home/jim/lab/npu-env/lib/python3.13/site-packages/openvino/libs
      # Runs on the NPU. Pinned to NO GPU so it can never claim ZOTAC VRAM.
      - CUDA_VISIBLE_DEVICES=
    cmd: |
      # SIGTERM on unload is clean (uvicorn shuts down); no cmdStop needed.
      /home/jim/lab/npu-env/bin/python /home/jim/llama-swap/npu/asr_server.py --port 5823
      --model-dir /mnt/data/models/distil-medium.en-npu
    # FIXED PORT 5823 (2026-10-13): alexa-marvin's Wyoming bridge on Colin calls
    # http://100.86.157.12:5823 directly (the server binds 0.0.0.0), so it cannot
    # take whatever port llama-swap hands out.
    proxy: http://127.0.0.1:5823

      # --- ASR FALLBACK: NVIDIA Parakeet TDT 0.6B (ONNX) via achetronic/parakeet ------------
      # Kept OUT of the dictation group since 2026-08-04: it needs the ZOTAC (GPU 0), which
      # defeats the NPU ASR's GPU-freedom. Load on demand (model=parakeet-asr) if the NPU
      # server is down or its quality gap matters. OpenAI-compatible, English, lowest WER of
      # all ASR options. The :latest-cuda image SHIPS the model built in (fp32 ~2.5 GB); pass
      # `language=en` per request. Server listens on :5092.
  parakeet-asr:
    checkEndpoint: none
    unlisted: true
    cmd: |
      docker run --rm --name parakeet --runtime nvidia
      -e CUDA_VISIBLE_DEVICES=GPU-af5bd53f-a1ca-d807-1ae2-7f5ef261fe1a
      -p ${PORT}:5092
      ghcr.io/achetronic/parakeet:latest-cuda
    cmdStop: docker stop parakeet

    # --- MOSS-Transcribe-Diarize 0.9B (PARKED 2026-10-18, revisit after the EPYC upgrade) ---
    # Candidate replacement for whisper-npu-asr (the NPU goes with the Core Ultra CPU) and a
    # meeting transcriber: one pass gives text, segment timestamps and speaker labels (S1, S2...).
    # English + Chinese only. Not streaming. Apache-2.0.
    #   Model:   /mnt/data/models/moss-transcribe-diarize/MOSS-Transcribe-Diarize-Q8_0.gguf
    #            (987 MB, SHA-256 2f9039f1..., from handy-computer/moss-transcribe-diarize-gguf;
    #            Q8_0 = 1.93% WER on LibriSpeech test-clean; Q4_K_M has tail failures, avoid)
    #   Runtime: transcribe.cpp (github.com/handy-computer/transcribe.cpp, built 2026-10-18 at
    #            9294205b in ~/lab/transcribe.cpp with -DTRANSCRIBE_CUDA=ON
    #            -DCMAKE_CUDA_ARCHITECTURES="86;120" -DTRANSCRIBE_USE_SYSTEM_BLAS=OFF; the system
    #            BLAS link fails). build/ has transcribe-cli; build-shared/ has libtranscribe.so for
    #            the Python bindings, installed in ~/lab/transcribe-env (Python 3.12).
    # Measured on the 3090 (transcribe-cli, warm):
    #   5.3 s dictation           0.14 s (37x realtime), 1.7 GB VRAM, 0.7 GB RAM; word-perfect but
    #                             starts lower-case ("make a new note...")
    #   JFK 11 s                  0.23 s (47x), word-perfect, 3 timed segments
    #   2 speakers, 14 s          0.38 s, speakers correct (incl. a resumed sentence)
    #   2 speakers en/zh, 12 s    0.27 s, speakers and languages correct
    #   5 min speech, diarize     11.1 s (28x), 2.9 GB VRAM, 0.8 GB RAM
    #   30.6 min, diarize         200 s (9x), 10.3 GB VRAM, 1.6 GB RAM
    #   CLI model load ~0.8-1.6 s per call, so dictation needs a resident server.
    # VRAM grows ~0.3 GB per minute of audio (one-pass KV) and speed drops with length: an hour
    # would need ~19 GB and ~8-10 min. For meetings, chunk into 10-15 min pieces (speaker labels
    # then restart per chunk and need matching) or run whole files on the 3090 with Strata out.
    # Dictation-sized requests fit beside the voice stack on the ZOTAC (~1.7 GB).
    # MISSING: an OpenAI-compatible /v1/audio/transcriptions server that keeps the model loaded
    # (like npu/asr_server.py). transcribe.cpp ships none; the Python bindings
    # (transcribe_cpp.Model(path, backend="cuda").session().run(pcm_f32_16k, diarize="on"))
    # are enough to write one. Once it exists, uncomment and adjust:
    #
    # moss-asr:
    #   unlisted: true
    #   checkEndpoint: /health
    #   env:
    #     - TRANSCRIBE_LIBRARY=/home/jim/lab/transcribe.cpp/build-shared/src/libtranscribe.so
    #     - CUDA_VISIBLE_DEVICES=GPU-af5bd53f-a1ca-d807-1ae2-7f5ef261fe1a   # ZOTAC, beside the voice stack
    #   cmd: |
    #     /home/jim/lab/transcribe-env/bin/python /home/jim/llama-swap/moss/moss_server.py
    #     --port ${PORT}
    #     --model /mnt/data/models/moss-transcribe-diarize/MOSS-Transcribe-Diarize-Q8_0.gguf
    #
    # Then point the Diction gateway on Colin at it (CUSTOM_BACKEND_MODEL=moss-asr in
    # ~/code/diction-gateway on Colin) and, if wanted, baruch-server.

    # (gemma-clean-e4b / gemma-clean-e2b removed 2026-07-26: superseded by qwen-clean-2b,
    #  which matches their quality ~40x faster. GGUFs deleted from /mnt/data/models.)

    # --- CLEANUP C: Qwen3.5-2B instruct, thinking OFF -- fast cleanup (added 2026-07-26) --
    # ~134ms/cleanup at ~90 tok/s; matches gemma-clean-e4b quality on the four dictation
    # behaviours but ~40x faster. enable_thinking:false is ESSENTIAL -- with thinking on, the
    # answer goes into reasoning_content and `content` returns empty. Used by baruch-server
    # (BARUCH_CLEANUP_MODEL). See baruch docs/eval-cleanup.md.
  qwen-clean-2b:
    # UNLISTED + NOT WARMED (2026-09-12): kept as a fallback / A-B entry only. s1-mini
    # replaced it as baruch-server's cleanup model, and the ZOTAC now belongs to the
    # resident voice stack, so this must not hold VRAM at boot. Loads on demand.
    unlisted: true
    cmd: |
      docker run --rm --name qclean-2b --runtime nvidia --cap-add SYS_ADMIN
      -e CUDA_VISIBLE_DEVICES=GPU-af5bd53f-a1ca-d807-1ae2-7f5ef261fe1a
      -p ${PORT}:8080 -v /mnt/data/models:/models
      # known-good image build: b9692
      --entrypoint /app/llama-server ghcr.io/ggml-org/llama.cpp:server-cuda13
      -m /models/Qwen3.5-2B-UD-Q4_K_XL.gguf
      --jinja --chat-template-file /models/froggeric_qwen_35_36_38_chat_template.jinja
      --chat-template-kwargs "{\"enable_thinking\": false}"
      -ngl 99
      -c 16384
      -fa on
      -np 1
      --temp 0.3
      --top-p 0.95
      --top-k 64
      --min-p 0.0
      --host 0.0.0.0
      --port 8080
    cmdStop: docker stop qclean-2b

    # --- CLEANUP (current): S1-mini text normalizer (added 2026-09-05) ------------------
    # S1-mini by Superwhisper (superwhisper/s1-mini, v1): a 0.6B (596M unique params)
    # text normalizer for ASR output, fine-tuned from Qwen3-0.6B. 94.8% token accuracy
    # on a 7.5k-case English held-out set; English only. GGUF = the Q4_K_M build
    # (462 MiB). Now baruch-server's cleanup model (replaces gemma-4-E4B-MTP; the
    # qwen-clean-2b entry above stays for fallback/A-B).
    #
    # STRICT INPUT CONTRACT (from the model card -- deviating can produce garbled or
    # blank output; nearly every integration bug traces to one of these two things):
    #  - System prompt must be EXACTLY the card's (baruch_server/prompts.py ships it).
    #  - User message = one control line + newline + the raw transcript:
    #      [Styling: casual|semi-casual|semi-formal|formal] [Structure: prose|lists] [Context: general|email]
    #  - enable_thinking MUST be false in the template. S1 was trained with thinking
    #    OFF; leaving it on emits an empty think block and NO usable output -- the #1
    #    blank-result bug. Do NOT substitute --reasoning-budget 0 (suppresses the think
    #    block a different way and degrades output).
    #  - Decode greedily: --temp 0 (normalization is deterministic; sampling adds variance).
    #  - Keep single passes under ~1000 tokens; chunk longer transcripts (client's job).
    #  - Output is plain text, may be EMPTY for filler-only input -- callers must treat
    #    "" as a valid result. Output length ~= input length.
    #
    # PLACEMENT (ZOTAC, single-GPU): UUID-pinned like the other dictation models.
    # 462 MiB of weights -- trivially fits beside gemma-4-E4B-MTP in the persistent
    # gemma-resident group (swap:false keeps them resident together; exclusive:false
    # keeps them coexisting with the qwen38-workload 27B/Flash-Next entries: the TP
    # 27B entries never touch the ZOTAC, and Flash-Next's --fit simply finds ~0.5 GB
    # less headroom on this card). License: Apache-2.0 + naming clause (keep the name
    # "S1-mini" by "Superwhisper" wherever it's used).
  s1-mini:
    cmd: |
      docker run --rm --name s1mini --runtime nvidia --cap-add SYS_ADMIN
      -e CUDA_VISIBLE_DEVICES=GPU-af5bd53f-a1ca-d807-1ae2-7f5ef261fe1a
      -p ${PORT}:8080 -v /mnt/data/models:/models
      --entrypoint /app/llama-server ghcr.io/ggml-org/llama.cpp:server-cuda13
      -m /models/s1-mini-q4_k_m.gguf
      # S1 contract: built-in Qwen3 template via --jinja with thinking OFF
      # (the exact recipe from the model card's llama.cpp section).
      --jinja
      --chat-template-kwargs "{\"enable_thinking\":false}"
      -ngl 99
      # Dictation-length input; ~1k tokens is the model's sweet spot, 8K leaves
      # headroom for long clips while KV stays well under 1 GB.
      -c 8192
      -fa on
      -np 1
      --load-mode none
      --temp 0
      --timeout 900
      --host 0.0.0.0
      --port 8080
    cmdStop: docker stop s1mini

    # --- SYSTEM 1: h2o-lightning-4b, ZOTAC, beside the voice stack ---
    # Added 2026-10-09, replacing clef-flash (Cloudflare, a Qwen3.5-9B
    # fine-tune; its GGUF was deleted). h2oai/h2o-lightning-4b: a Qwen3.5-4B
    # decision model (choice / yes-no / score questions about a record).
    # Thinking OFF.
    # QUANT: mradermacher/h2o-lightning-4b-GGUF Q4_K_M (2,708,804,928 bytes,
    # sha256 a2856d3e...a56d461, checked). Static quant, text only (no mmproj).
    # USE IT THROUGH THE SHIM: pm2 app h2o-shim, POST :8741/v1/systemone, H2O's
    # typed JSON API with calibrated probabilities. It is H2O's own shim over
    # this entry (~/llama-swap/h2o-shim; llama_backend.py swaps its vLLM client
    # for llama-server) and matches H2O's published example within ~0.01.
    # This entry on its own is a plain chat endpoint.
    # MEASURED 2026-10-09: loads in ~2 s, ~3.4 GiB on the ZOTAC (clef-flash
    # took 5.1).
    # --fit on + --fit-target 512: if the card is fuller at load time, layers go
    # to the CPU (slow) instead of the load failing.
  # --- voice-agent: Qwen3.5-4B (thinking off) + its MTP heads, on the ZOTAC ---
  # The brain for ~/code/alexa-marvin's voice assistant (Home Assistant, over Tailscale),
  # resident beside the other voice models. Replaced LFM2.5-2.6B on 2026-10-13: LFM
  # always thinks (no off switch), searched the web even for unit conversions and
  # looped, and knew little. BAKE-OFF 2026-10-13 (the HA voice prompt and tool names,
  # 14 everyday questions, mocked tools; SearXNG was blocked): LFM2.5-2.6B, Gemma 4 E4B
  # (thinking on: slow; off: spoke its reasoning), Qwen3-4B-Instruct-2507 (never
  # searched: invented shop hours, an F1 winner, a bank holiday), Qwen3.5-4B. Qwen3.5
  # searched exactly the 5 questions that needed it, used the device tools right, and
  # answered in 0.5 s median, 0.9 s max.
  # FILE: unsloth/Qwen3.5-4B-MTP-GGUF Q5_K_M (3.21 GB, sha256 280071016b...dedc), the
  # Qwen3.5-4B GGUF WITH its multi-token-prediction heads (the plain unsloth GGUF has
  # none: "model doesn't contain MTP layers"). --spec-type draft-mtp, depth 2: decode
  # 93 -> 113 t/s (+21%), +0.4 GiB; depths 3/4/6 were slower (109/102/85 t/s).
  # z-lab's Qwen3.5-4B-DFlash draft exists only as safetensors (no GGUF).
  # THINKING OFF (--reasoning off). Sampling: Qwen's non-thinking settings but temp 0.2
  # instead of 0.7: at 0.7 cooking times varied run to run (45 min / 3 h for a 1 kg
  # joint) and a shop's hours were misread; at 0.2 two runs gave the same right answers.
  # Arithmetic is its weak spot (12 kg -> "264.55 oz"); ha_agent.py's prompt asks it to
  # say the conversion factor first, which fixed it.
  # VRAM ~4.2 GiB with 16K context. -np 1 (MTP does not support more slots yet).
  Qwen3.5-4B:
    cmd: |
      docker run --rm --name qwen354b --runtime nvidia --cap-add SYS_ADMIN
      -e CUDA_VISIBLE_DEVICES=GPU-af5bd53f-a1ca-d807-1ae2-7f5ef261fe1a
      -p ${PORT}:8080 -v /mnt/data/models:/models
      --entrypoint /app/llama-server ghcr.io/ggml-org/llama.cpp:server-cuda13
      -m /models/Qwen3.5-4B-MTP-Q5_K_M.gguf
      --spec-type draft-mtp
      --spec-draft-n-max 2
      --jinja
      --reasoning off
      -ngl 99
      -fa on
      -c 16384
      -np 1
      --temp 0.2
      --top-p 0.8
      --top-k 20
      --min-p 0
      --presence-penalty 1.5
      --timeout 900
      --host 0.0.0.0
      --port 8080
    cmdStop: docker stop qwen354b
    aliases: [voice-agent]

  h2o-lightning-4b:
    cmd: |
      docker run --rm --name h2olightning --runtime nvidia --cap-add SYS_ADMIN
      -e CUDA_VISIBLE_DEVICES=GPU-af5bd53f-a1ca-d807-1ae2-7f5ef261fe1a
      -p ${PORT}:8080 -v /mnt/data/models:/models
      --entrypoint /app/llama-server ghcr.io/ggml-org/llama.cpp:server-cuda13
      -m /models/h2o-lightning-4b.Q4_K_M.gguf
      --jinja
      --reasoning off
      --fit on
      --fit-target 512
      -c 16384
      -fa on
      -np 1
      --temp 0
      --timeout 900
      --host 0.0.0.0
      --port 8080
    cmdStop: docker stop h2olightning

    # --- TTS: chatterbox-turbo, permanently resident on the ZOTAC (added 2026-09-12) ---
    # ResembleAI Chatterbox-Turbo distilled to GGUF by cstr and served by CrispASR
    # (C++/ggml; NO Python or PyTorch at runtime). This is NOT a llama.cpp model, so
    # it follows the whisper-npu-asr host-process pattern (host binary + env +
    # checkEndpoint) rather than the docker-model pattern.
    #
    # Model: cstr/chatterbox-turbo-GGUF -- a two-GGUF pipeline (T3 AR text -> speech
    # tokens, then S3Gen meanflow CFM -> 24 kHz via HiFTGenerator). `-m auto` resolves
    # BOTH files from that repo through CrispASR's registry into ~/.cache/crispasr/
    # (t3-q8_0 + s3gen-q8_0, ~1.1 GiB, the recommended deployment quants). The preset
    # voice is baked into the T3 GGUF as conds.* tensors, so no reference WAV is used.
    #
    # Build: CrispASR v0.8.32 release tarball crispasr-linux-x86_64-cuda13, matching the
    # host's CUDA 13.3. The binary warns 'compiled 13.0, runtime 13.3' and then works.
    # v0.8.1+ is REQUIRED: earlier builds lack the 19 emotion/style control tokens in
    # the tokenizer and load inconsistently.
    #
    # MEASURED 2026-09-12: healthy ~10 s after start; ~1.27 GiB VRAM on the ZOTAC
    # (card total 11.0 of 16 GiB with gemma + s1-mini already resident). POST
    # /v1/audio/speech with NO `voice` field -> 200 and 4.72 s of 24 kHz audio.
    # Do NOT pass a `voice` field unless --voice-dir holds that profile: it is read as
    # a WAV path and fails with 500 'synthesis failed (backend returned empty audio)'.
    #
    # Emotion/style tags go inline in `input`, e.g. "[laugh] Thank you!": [laugh]
    # [chuckle] [sigh] [gasp] [cough] [groan] [sniff] [shush] [clear throat]
    # [whispering] [angry] [happy] [crying] [fear] [surprised] [sarcastic] [dramatic]
    # [narration] [advertisement].
    #
    # Voice cloning needs a BAKED voice GGUF (chatterbox has no WAV cloning path) plus
    # a consent attestation, and the baker is a Python step. Not set up here.
    #
    # EU AI Act: CrispASR warns the preset voice's provenance is unrecorded and so adds
    # no spoken AI disclosure. --speaker-identity real_person makes it prepend one;
    # --speaker-identity synthetic silences the warning but asserts something NOT
    # verified. Neither is set -- decide deliberately before adding one.
  chatterbox-turbo:
    checkEndpoint: /health
    env:
      - LD_LIBRARY_PATH=/home/jim/lab/crispasr/crispasr-linux-x86_64-cuda13
      # ZOTAC only -- this entry must never see another card.
      - CUDA_VISIBLE_DEVICES=GPU-af5bd53f-a1ca-d807-1ae2-7f5ef261fe1a
    # 2026-10-13: ALSO alexa-marvin's TTS, one copy. tts/run-chatterbox.sh (was
    # ~/lab/crispasr/start-tts.sh, run by hand beside this unused entry) adds the cloned
    # voices (voices/ralph.wav: --i-have-rights, consent log), drops the spoken AI
    # disclaimer (Jim accepts the marking duty) and pins port 5811, which the Wyoming
    # bridge on Colin calls through `tailscale serve --https=5811`. Its header has why.
    # SIGTERM on unload is clean (the script execs crispasr); no cmdStop needed.
    cmd: /home/jim/llama-swap/tts/run-chatterbox.sh
    proxy: http://127.0.0.1:5811
    # No cmdStop: llama-swap SIGTERMs the process directly.

    # ############################################################################## #
    # GROUPS                                                                          #
    #   `dictation`: keep ASR (NPU) + cleanup LLM (ZOTAC) resident together.         #
    #     swap:false       -> members coexist; capture <-> cleanup never unloads.     #
    #     exclusive:false  -> does NOT evict your other (ungrouped) models.           #
    #     persistent:true  -> kept resident once loaded; a big-model load can't evict #
    #                         it (enables coexistence). Loads on 1st request, not boot #
    #   COEXISTENCE: whisper-npu-asr is GPU-free (runs on the NPU). qwen-clean-2b      #
    #   sits on GPU 0 (ZOTAC), which the 3-GPU --fit models (laguna-s-2.1 /            #
    #   qwen3.5-122B / Qwen3.6-27B-Q8) ALSO use -- don't run those concurrently with  #
    #   CLEANUP, or GPU 0 will OOM (the NPU ASR still works). The 2-GPU entries       #
    #   (vLLM TP + the -sm tensor TP entry, pinned to idx 1,2) coexist with it fine.   #
    # ############################################################################## #
groups:
  "gemma-ondemand":
    swap: true
    exclusive: false
    persistent: false
    # gemma-4-E4B-MTP on the ZOTAC, on demand only (2026-10-01): everything now points
    # at Strata, so Gemma is no longer resident. Until 2026-10-01 it shared the
    # "gemma-resident" group with the voice stack (see "resident" below).
    #   exclusive:false  -> requesting it evicts nothing; it loads beside the residents.
    #   persistent:false -> any exclusive load (e.g. a "resident" member) unloads it.
    # qwen-clean-2b and parakeet-asr remain unlisted on-demand fallbacks.
    members:
      - gemma-4-E4B-MTP
  # "factory-resident" (persistent, held Q3.8-27B-IQ4XS on the 3090 + 5070 Ti)
  # was REMOVED 2026-09-30: Strata is the only persistent model, and two persistent
  # models on the same cards cannot evict each other. The 27B went back into
  # qwen38-workload with the other models on those cards.
  # UNGROUPED EVICTION HAZARD (2026-09-13): loading an ungrouped model evicts
  # residents (it made the factory model vanish mid-task). The "qwen35-9b" group
  # (exclusive:false) existed to stop the plain 9B doing that; it was removed with that
  # entry on 2026-10-06. Still ungrouped and carrying the same hazard:
  # muse-glimmer-30B-dflash-vision, gemma-4-31B-Q4-MTP, gemma-4-26B-MoE-MTP and the
  # two curator entries. Give them a group if they start evicting residents.
  "qwen38-workload":
    swap: true
    exclusive: false
    persistent: false
    # Q3.8-27B-Q6KM uses the same 3090 + 5070 Ti pair as Flash-Next/TP, so it
    # must swap with those entries. Otherwise --fit saw only the 5060 Ti.
    # (Q6 held the other cards) and Flash-Next ran on about one GPU.
    # Requesting a qwen38-workload member evicts other group members; persistent
    # resident groups (Gemma/dictation) are not evicted.
    # Q3.8-27B-IQ4XS was removed on 2026-09-13 (made persistent in
    # `factory-resident`) and came BACK on 2026-09-30 when that group was dropped.
    # NOTE: no member here can load while persistent Strata holds the 3090 +
    # 5070 Ti -- unload Strata first (curl -X POST .../api/models/unload/Strata-IQ3S).
    members:
      # EnGram Explorer backend (reasoning-off clone of Q3.8-FN-AC-IQ4_XS).
      - Q3.8-FN-AC-IQ4_XS-explore
      - Q3.8-27B-IQ4XS
      - Q3.8-27B-Q6KM
      - Q3.8-27B-IQ4XS-DF2
      # 2026-09-18: non-MTP Flash-Next entries were removed at Jim's request;
      # MTP variants are in use. They use the same 3-card set (5070 Ti, MSI,
      # 3090). CAUTION: an ungrouped non-MTP request does not swap and could
      # oversubscribe VRAM. Add it back here before using it again.
      - Q3.8-FN-AC-IQ4XS-MTP
      # Hemmingway uses the same 3090 + 5070 Ti pair as Q6KM, so it swaps here.
      # NAME MUST MATCH THE MODEL KEY (`Hemmingway`, near line 844). The old
      # nonexistent name emitted a warning and left llama-swap serving the
      # previous config on reload.
      - Hemmingway
      # Swift-1.5-27B-Q6KS uses the same 3090 + 5070 Ti pair (and needs the
      # Q6KM-262K tensor split), so it swaps here too.
      - Swift-1.5-27B-Q6KS
  "resident":
    swap: false
    exclusive: true
    persistent: true
    # THE ALWAYS-ON STACK (2026-10-01): Strata plus the voice models. Replaces the
    # "strata" group and the voice half of "gemma-resident".
    # WHY ONE GROUP: "strata" was exclusive and "gemma-resident" was not persistent,
    # so every Strata (re)load evicted whisper, s1-mini and chatterbox although they
    # share no hardware (Strata: 5070 Ti + 3090; voice: NPU + ZOTAC).
    #   swap:false       -> members coexist; loading one never unloads another.
    #   exclusive:true   -> loading any member evicts non-persistent models, which
    #                       frees the 3090 + 5070 Ti for Strata's engine. Side effect:
    #                       reloading a voice model also evicts ad-hoc loads.
    #   persistent:true  -> nothing evicts a member. Anything else wanting the 3090 or
    #                       5070 Ti (the qwen38-workload models) cannot load until you
    #                       unload Strata.
    # Strata itself (Strata-IQ3S) is in its own group, "strata-iq3s", with the same
    # exclusive + persistent settings; it was here until Strata-IQ3XXS was deleted.
    # chatterbox-turbo is not preloaded (preload warms with a chat request, which
    # 404s on a TTS backend); it loads on its first request and then stays.
    members:
      - whisper-npu-asr
      - s1-mini
      - chatterbox-turbo
      # h2o-lightning-4b (2026-10-09, replaced clef-flash): the System 1 model
      # on the ZOTAC. Preloaded since 2026-10-13, so it is always loaded.
      - h2o-lightning-4b
      # bge-m3 (2026-10-10): markdown-rag's embeddings, ZOTAC, ~0.9 GiB. Preloaded
      # since 2026-10-13, so it is always loaded.
      - bge-m3
      # Qwen3.5-4B (2026-10-13, replaced LFM2.5-2.6B): `voice-agent`, alexa-marvin's
      # brain, ZOTAC, ~4.2 GiB with MTP. Preloaded, so the first wake word answers at once.
      - Qwen3.5-4B
  "strata-iq3s":
    swap: true
    exclusive: true
    persistent: true
    # Strata-IQ3S (2026-10-03; the only Strata since 2026-10-12).
    #   exclusive:true  -> like Strata, loading it frees the 3090 + 5070 Ti of the
    #                      non-persistent models (the voice stack is persistent: it stays).
    #   persistent:true -> nothing evicts it. It was false at first, and then every
    #                      dictation request evicted it: llama-swap enforces the resident
    #                      group's `exclusive` on each request to a member, not only on load.
    members:
      - Strata-IQ3S
