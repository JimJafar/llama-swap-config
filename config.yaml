    # (fork 53b1389 + unsloth draft -> mainline 65840ed + ggml-org draft):
    #   short prompt, 2K-token answer: decode 60.4 -> 62.9 t/s (accept 83% -> 76%)
    #   59K-token prompt: prefill 446 -> 513 t/s (+15%), decode 38.2 -> 40.9 t/s
    # Why MTP at all (2026-09-18, fork): decode stays flat with context (55.2 -> 53.7 t/s at
    # 5.4K -> 21.8K tokens) where the no-MTP entry falls 49.5 -> 27.1.
