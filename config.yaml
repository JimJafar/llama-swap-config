    # This llama.cpp entry owns the primary name. The vLLM NVFP4 variant (which briefly
    # took the name on 2026-08-31) OOMed at load on the desktop-limited 5070 -- the
    # MTP-drafter NVFP4 scale-processing peak (~14.4 GiB) is context-independent, so
    # max-model-len could not fix it -- and that entry has since been REMOVED from this
    # config entirely. This is therefore the only 27B IQ4_XS entry: 2-card -sm tensor,
    # IQ4_XS, -c 262144 native.
    # RENAMED 2026-09-17: config ids were shortened; this entry is now `Q3.8-27B-IQ4XS`.
    # Clone of Qwen3.8-27B-Q5-MTP-TP with the lighter IQ4_XS quant for MORE
    # CONTEXT. MODEL: unsloth/Qwen3.8-27B-GGUF -> Qwen3.8-27B-IQ4_XS.gguf
    # (15.7 GiB, 288 IQ4_XS + Q5_K/Q4_K outlier tensors, nextn MTP head VERIFIED
    # in the GGUF header: blk.64.nextn.{eh_proj Q8_0, enorm/hnorm/shared_head_norm
    # F32}). Native context 262144. NOTE: plain I-quants historically abort -sm
    # tensor with GGML_ASSERT SPLIT_AXIS_UNKNOWN (see Q5 entry notes); this file
    # is NOT a UD requant -- if the load aborts, drop -sm tensor or requant UD.
    #
    # CONTEXT PROBE: -c 262144 (native). Weights 18.8 -> 15.7 GiB frees ~1.5
    # GB/card vs Q5 at 175K, which had MSI at 96.6% / 5070 at 89.8% -- 262K
    # should fit; if the load OOMs at graph_reserve, step -c down (196608 ->
    # 175000) and note the ceiling here.
    #
    # 2026-08-19 UPDATE (v2): desktop compositor switched Vulkan -> OpenGL,
    # freeing ~2 GB on the 5070 Ti (device1: now 81% vs MSI device0 92%). The
    # MSI was the wall at the old split, and the freed 5070 headroom is only
    # usable by REBALANCING the tensor split. IMPORTANT: with the Meta()
    # multi-device backend in build 10362 the split ratio is EXTREMELY
    # sensitive and NOT linear:
    #    1.01,1   -> MSI-heavy  (MSI 14988 / 5070 11746 @229K, MSI at wall)
    #    0.99,1.01-> 5070 OVERLOADED (fails to load, cudaMalloc OOM on dev1)
    #    0.95,1.05-> 5070 OVERLOADED (same failure)
    #    1.00,1.00-> balanced (MSI 13944 / 5070 14383 server @245K)
    # So the balance point is 1.00,1.00 -- the split is a sharp threshold.
    # With it, -c 262144 (NATIVE MAX) loads: MSI 1545 MiB free, 5070 464 MiB
    # total free (~1064 server-side; the 5070 carries ~600 MiB of desktop
    # Xorg/compositor). See inline probe notes.
  Q3.8-27B-IQ4XS:
    cmd: |
      docker run --rm --name q38iq4xsmtptp --runtime nvidia --cap-add SYS_ADMIN
      --ipc=host
      # GPU re-pin (2026-09-08): the 5070 Ti (d64df8cf, 16 GiB @ 03:00.0) is back in
      # the box, so this pair moves OFF the 5060 Ti (57bbb375, 16 GiB @ 01:00.0) onto
      # the 5070 Ti. Machine now has three cards: 3090 (93ab52e5, 24 GiB, display @
      # 02:00.0) + 5060 Ti (57bbb375 @ 01:00.0) + 5070 Ti (d64df8cf @ 03:00.0); this
      # model runs on the 3090 + 5070 Ti. Both candidate secondary cards are 16 GiB,
      # so the split balance with the 3090 carries over unchanged. CUDA0 = 3090
      # (--main-gpu 0), CUDA1 = 5070 Ti. tensor-split is weighted toward the 3090 so
      # it holds most of the weights AND its (larger) share of the unified KV pool;
      # -c is at the 262144 native ceiling to spend the 3090's spare VRAM on KV.
      -e CUDA_VISIBLE_DEVICES=GPU-93ab52e5-8e61-197e-880a-aa6af5a13c74,GPU-d64df8cf-c877-b43d-d9a5-d6b0e38e504a
