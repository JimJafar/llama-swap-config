# ############################################################################## #
# EDIT WORKFLOW -- run this after EVERY set of edits to this file, before you    #
# consider the job finished:                                                     #
#   1. python3 ./sync-models.py   # regenerates models.json from config.yaml and  #
#                                 # copies the result to ~/.pi/agent/models.json  #
#   2. commit + push              # remote: JimJafar/llama-swap-config, branch main #
# WHY: models.json silently drifts from config.yaml if it is not regenerated, and #
# an uncommitted/unpushed edit is a change that will be lost or made twice.       #
# ORDER: run sync-models.py AFTER the config edits (it reads this file), never    #
# before -- otherwise you sync the previous state.                                #
# ############################################################################## #

# LINTING: this file is EXEMPT from yamllint -- see .yamllint.yaml. It carried
# 457 legacy >80-col lines (416 comments predating the <=80 rule, 42 command
# lines that cannot be wrapped: docker -e CUDA_VISIBLE_DEVICES= GPU-UUID lists,
# -m paths, bind mounts), so the rule re-fired on every edit with nothing new.
# The <=80 convention for NEW lines still applies here; it is enforced in
# review, not by yamllint. Re-enable by deleting the `ignore` key there.

# llama-swap runs as a host binary (llama-swap-bin AUR). Most model backends run
# as Docker containers: llama.cpp uses the official ggml-org server-cuda13 image
# (entrypoint /app/llama-server; every llama.cpp entry since 2026-10-06), while vLLM uses
# the vllm image. Strata runs
# as a host process through its launcher scripts. ${PORT} is assigned by
# llama-swap; containers publish it, while host processes bind it directly.
# cmdStop or default SIGTERM handling stops the backend and frees VRAM.
#
# Shared docker flags for llama.cpp models:
#   --runtime nvidia --cap-add SYS_ADMIN  (matches the previously-working setup)
#   --entrypoint /app/llama-server        (image entrypoint is llama-swap)
#
#   --ulimit memlock=-1:-1                REQUIRED by every model that passes --mlock
#                                         (currently q35b / g31mtp / g26moe / ge4bmtp).
#   WHY (2026-09-21): docker's default memlock rlimit inside a container is 8 KiB, so
#   `--mlock` was silently locking nothing -- llama.cpp warns and carries on. The
#   consequence was visible as 8.6 GB of ge4bmtp's weights sitting in /dev/zram0 while
#   the model was idle: because --no-mmap had already copied the weights into anonymous
#   memory, every idle page was compressible, so zram ate it and the first request after
#   a pause paid a decompress. Verified: `docker run --ulimit memlock=-1:-1 ... ulimit -l`
#   prints `unlimited` (vs `8192` by default). --cap-add IPC_LOCK is NOT needed once the
#   rlimit is unlimited -- mlock() accepts rlimit OR capability, so this stays least-priv.
#   KEEP --mlock AND --ulimit TOGETHER: --mlock without the rlimit is a no-op, and the
#   rlimit without --mlock only widens a limit nothing uses.
#   FLAG RENAME (2026-10-01): llama-server build 11277 (the :cuda image pulled
#   2026-09-30) removed --no-mmap and --mlock ("invalid argument"). They are now one
#   --load-mode: `--no-mmap --mlock` -> `--load-mode mlock`, `--no-mmap` -> `--load-mode
#   none`. "--mlock" in the notes above means --load-mode mlock.
#
# IMAGE POLICY (2026-09-07): do NOT pin llama.cpp / vLLM / llama-swap builds. Everything
# tracks mainline "latest": every llama.cpp entry uses the official ggml-org rolling
# server-cuda13 tag (2026-10-06: the last entries moved off llama-swap's bundled :cuda image,
# which lagged ~150 builds). The tag only advances when you `docker pull`, so include image
# pulls in the normal update step. A fork build is allowed only while its feature is
# unmerged; revert it to mainline latest the moment the feature lands (none remain).
#
# Max seconds to wait for a model to become ready after launch. Raised from the 120s
# default for the vLLM entries (e.g. qwen36-27b-nvfp4), which take ~180s to load + capture graphs.
healthCheckTimeout: 600
# Models get ports from 5900 up (the default, 5800, overlapped fixed ports: alexa-marvin's
# TTS server holds 5811, so bge-m3 drew 5811 on 2026-10-13, failed to bind and exited, and
# s1-mini drew 5823, the port alexa-marvin's speech-to-text bridge expects for whisper).
# Ports below 5900 are for fixed services: crispasr TTS 5811, whisper-npu-asr 5823.
startPort: 5900

# Expose model `aliases` as extra entries in /v1/models (default false). Needed
# so API-discovering clients (not just pi's models.json) can see the alias;
# e.g. `subagent`; llama-swap still routes a request to the alias either way.
includeAliasesInList: true

# Warm the whole 'default' group on every llama-swap start/restart (fires a
# background GET / at each model; swap:false in the group keeps them coexisting
# instead of swapping). 27B is the slow leg (~30-60 s); healthCheckTimeout
# covers it. Runtime eviction (e.g. a 122B/curator load) does NOT re-trigger
# this -- members just reload on their next request.
hooks:
  on_startup:
    preload:
      # Strata FIRST. Since 2026-10-01 it shares the persistent, swap:false
      # "resident" group with the voice models, so the order no longer decides who
      # survives; Strata first just gives its engine the cards before anything else.
      # 2026-10-03: Strata-IQ3S while Jim evaluates it (it holds `subagent`); it is
      # persistent in its own group, so it coexists with the voice models the same way.
      - Strata-IQ3S
      - whisper-npu-asr
      # s1-mini is tiny (462 MiB) and its load is ~seconds, so preloading it at every
      # llama-swap start keeps Baruch's first dictation warm without startup cost worth
      # worrying about. (Baruch also warms it on its own start; this covers the case
      # where llama-swap restarts after Baruch has already booted.)
      - s1-mini
      # voice-agent (Qwen3.5-4B): a voice reply should never wait for a load.
      - Qwen3.5-4B
      # 2026-10-13: the rest of the ZOTAC's resident models, so a llama-swap restart
      # brings the whole card back: h2o (System 1) and bge-m3 (markdown-rag). All
      # five llama.cpp/crispasr residents fit together: ~12.7 of 16 GiB with ezra-ocr.
      # bge-m3 serves embeddings only, so its chat warm-up fails (logged), but the
      # model is loaded and stays, as with whisper-npu-asr.
      - h2o-lightning-4b
      - bge-m3
      # chatterbox-turbo (2026-10-13): alexa-marvin's voice, so it must come back after a
      # restart. Its chat warm-up 404s (TTS only), but the model loads and stays.
      - chatterbox-turbo

# Qwen 3.5/3.6/3.8 jinja template fix
#
# The fixed template comes from here: https://huggingface.co/froggeric/Qwen-Fixed-Chat-Templates/blob/main/README.md
#
# All Qwen 3.5, 3.6 and 3.8 variants should have `--jinja --chat-template-file /models/froggeric_qwen_35_36_38_chat_template.jinja`
# (llama.cpp). The .jinja file must live in the MOUNTED models dir (/mnt/data/models on the host,
# which is bind-mounted to /models in every container) -- a host-side repo path is invisible inside
# the container. For the vLLM entry the flag is `--chat-template <path>` instead (no --jinja).
#
# The Thinking Toggle
#
# You can control the model reasoning behavior. Insert `<|think_on|>` or `<|think_off|>` anywhere in your system or user prompt. The template intercepts the tag, removes it from the final context so the model never sees it, and flips the reasoning mode instantly.
#
# **Fast answer, no reasoning:**
# ```text
# System: You are a coding assistant. <|think_off|>
# User: What's 2+2?
# ```
#
# **Deep reasoning:**
# ```text
# System: You are a coding assistant. <|think_on|>
# User: Implement a red-black tree in Rust.
# ```
# *(The tag syntax uses Qwen's control token delimiters to guarantee it will never collide with legitimate text or file paths, unlike earlier community templates that used `/think`)*
#
# Token Saving (Stripping past thoughts):
#
# By default, this template **preserves** all past `<think>` blocks in the chat history. This prevents the model from suffering "amnesia stalls" during complex agentic loops, and it mathematically guarantees a 100% Prefix KV Cache hit rate on local inference engines.
#
# If you are running constrained hardware and need to save context tokens, you can explicitly disable this feature in your engine's template kwargs to automatically strip past thoughts:
# ```json
# {
#   "preserve_thinking": false
# }
# ```
# *(Note: Setting this to false will reduce your KV Cache hit rate during multi-turn chats because the prompt string will dynamically mutate).*

##################################################################################
# GPU TOPOLOGY (4 GPUs, 72 GiB; updated 2026-09-24)                          #
#   All four cards are installed and enumerate as shown. Pin every entry by UUID #
#   so a card swap or a re-ordering can never silently move a model.             #
#                                                                                #
#   PCI       Card                VRAM      Role         UUID prefix   CUDA idx  #
#   01:00.0   RTX 5060 Ti         16 GiB    compute      57bbb375      CUDA2     #
#   02:00.0   RTX 3090            24 GiB    desktop/CPEG 93ab52e5      CUDA0     #
#   03:00.0   RTX 5070 Ti         16 GiB    compute      d64df8cf      CUDA1     #
#   M.2 RTX 5060 Ti ZOTAC 16 GiB RESERVED af5bd53f CUDA3                       #
#                                                                                #
#   The 3090 is the display card (kwin/compositor on it, ~0.6-0.7 GiB). For      #
#   the -sm tensor TP pair put the 3090 FIRST (CUDA0/--main-gpu 0) and bias      #
#   --tensor-split toward it so it carries most weights + the larger KV share.   #
#   CUDA order is fastest-first; 3090 is CUDA0 and ZOTAC is last.              #
#   Profiles list only the three compute UUIDs above; the ZOTAC is kept for     #
#   the voice stack.
#                                                                                #
# >>> ZOTAC VOICE-RESERVED <<<
#   s1-mini (~1.5 GiB) and chatterbox-turbo (~1.6 GiB) remain loaded here.
#   Gemma E4B's -c 102400 was sized to fit beside the four-GPU Tabby Qwen EXL3
#   entry's 7.5 GiB ZOTAC split; that entry was deleted 2026-10-06.
#   qwen-clean-2b and parakeet-asr remain unlisted, on-demand fallbacks.
#   Other profiles exclude af5bd53f.
#   Five former ZOTAC models moved to MSI on 2026-09-12.
##################################################################################

# NOTE 2026-09-30: this top-level `preload:` key is NOT read by llama-swap -- the
# reload log only ever preloads hooks.on_startup.preload (near the top). Kept for its
# history; edit the hooks list to change what actually preloads.
preload:
  # Large GPU models are loaded on demand so whole-machine models such as
  # Qwen3.8-Flash-Next can fit without startup contention.
  #
  # ZOTAC hosts voice services. qwen-clean-2b and parakeet-asr are on-demand
  # fallbacks. Other profiles stay pinned away from this card.
  # A preloaded model must be in a persistent group, or it can be evicted.
  #
  # NOTE: `preload` only works for CHAT-shaped backends. llama-swap warms a preloaded
  # model with a chat request, so an ASR/TTS backend 404s and llama-swap then STOPS the
  # process it just started (observed for whisper-npu-asr and chatterbox-turbo).
  # chatterbox-turbo is therefore warmed through its real endpoint by stt-warmup
  # (warmup-stt.sh) instead of being listed here.
  #
  # 2026-09-30: STRATA IS THE ONLY PRELOADED AND THE ONLY PERSISTENT MODEL (Jim's
  # call). It serves the `subagent` alias and the librarian curator. gemma-4-E4B-MTP,
  # s1-mini and Q3.8-27B-IQ4XS (the old factory model) were removed from preload:
  # Strata's group is exclusive, so it would evict them straight after they loaded,
  # and the 27B wants the same 3090 + 5070 Ti that Strata holds.
  # 2026-10-03: Strata-IQ3S while Jim evaluates it (see hooks.on_startup.preload).
  - Strata-IQ3S

models:
  # ########### #
  # QWEN MODELS #
  # ########### #

    # CURATOR LoRA ENTRIES (added 2026-08-21): The Librarian's curator, task-specific
    # rank/alpha-8 adapters on Qwen3.5-9B (Unsloth Studio SFT, completion-only, non-
    # thinking data). The 100-case grooming adapter beat its 250/500-case siblings in
    # blind review; harvesting's 100-case adapter lifted F1 78.2 -> 80.8. See
    # "How to get big results from a tiny model" (Writing/Published/AI/...).
    #
    # llama.cpp loads the adapter with --lora-scaled <gguf>:1.0 on top of
    # Qwen3.5-9B-UD-Q4_K_XL.gguf (switched from Q4_1 on 2026-08-22). The plain
    # Q3.5-9B-Q4 entry was deleted 2026-10-06; the file STAYS as these entries' base.
    # (This build has no -l short flag / space scale -- plain `--lora FNAME` also
    # works.) The r8 adapters are ~29 MB, so a curator needs ~7 GB of VRAM.
    #
    # Thinking is pinned OFF ("enable_thinking": false) to match the training data --
    # same trick as qwen-clean-2b. pi's qwen3.5 wiring (sync-models.py) can still
    # flip it per request if you want to experiment.
  curator-grooming:
    unlisted: true
    cmd: |
      docker run --rm --name q9b-cgroom --runtime nvidia --cap-add SYS_ADMIN
      -e CUDA_VISIBLE_DEVICES=GPU-57bbb375-a61a-6662-e9c8-447b948f0833
      -p ${PORT}:8080 -v /mnt/data/models:/models
      # known-good image build: b9692
      --entrypoint /app/llama-server ghcr.io/ggml-org/llama.cpp:server-cuda13
      -m /models/Qwen3.5-9B-UD-Q4_K_XL.gguf
      # this build takes --lora FNAME / --lora-scaled FNAME:SCALE (no -l, no space scale)
      --lora-scaled /models/curator-qwen35-9b-grooming-100-r8-lora-f16.gguf:1.0

      # fixed chat template
      --jinja --chat-template-file /models/froggeric_qwen_35_36_38_chat_template.jinja

      -ngl 99
      -c 132768
      -fa on
      -np 1
      --load-mode none
      -b 2048
      -ub 2048

      # draft speculation - ngram only (NO MTP: no nextn tensors in this
      # GGUF -- would abort at load). ngram-mod window retuned 2026-08-22
      # (24/24/86 measured 13.7% draft acceptance on the plain Q4 entry).

      --spec-type ngram-mod
      --spec-ngram-mod-n-match 24
      --spec-ngram-mod-n-min 12
      --spec-ngram-mod-n-max 32

      --temp 0.6
      --top-p 0.95
      --top-k 20
      --min-p 0.0
      --presence-penalty 0.0
      --repeat-penalty 1.0
      --reasoning-format none
      --chat-template-kwargs "{\"enable_thinking\": false}"
      --timeout 900
      --host 0.0.0.0
      --port 8080
    cmdStop: docker stop q9b-cgroom

  curator-harvesting:
    unlisted: true
    cmd: |
      docker run --rm --name q9b-charvest --runtime nvidia --cap-add SYS_ADMIN
      -e CUDA_VISIBLE_DEVICES=GPU-57bbb375-a61a-6662-e9c8-447b948f0833
      -p ${PORT}:8080 -v /mnt/data/models:/models
      # known-good image build: b9692
      --entrypoint /app/llama-server ghcr.io/ggml-org/llama.cpp:server-cuda13
      -m /models/Qwen3.5-9B-UD-Q4_K_XL.gguf
      # this build takes --lora FNAME / --lora-scaled FNAME:SCALE (no -l, no space scale)
      --lora-scaled /models/curator-qwen35-9b-harvesting-100-r8-lora-f16.gguf:1.0

      # fixed chat template
      --jinja --chat-template-file /models/froggeric_qwen_35_36_38_chat_template.jinja

      -ngl 99
      -c 132768
      -fa on
      -np 1
      --load-mode none
      -b 2048
      -ub 2048

      # draft speculation - ngram only (NO MTP: no nextn tensors in this
      # GGUF -- would abort at load). ngram-mod window retuned 2026-08-22
      # (24/24/86 measured 13.7% draft acceptance on the plain Q4 entry).

      --spec-type ngram-mod
      --spec-ngram-mod-n-match 24
      --spec-ngram-mod-n-min 12
      --spec-ngram-mod-n-max 32

      --temp 0.6
      --top-p 0.95
      --top-k 20
      --min-p 0.0
      --presence-penalty 0.0
      --repeat-penalty 1.0
      --reasoning-format none
      --chat-template-kwargs "{\"enable_thinking\": false}"
      --timeout 900
      --host 0.0.0.0
      --port 8080
    cmdStop: docker stop q9b-charvest

    # Qwen3.8-Flash-Next UD-IQ4_XS (added 2026-08-26): 180B total / 6B active, with
    # 51B n-gram embeddings. The three GGUF shards live on /mnt/data/models (not the usual
    # /mnt/data/models). Uses official llama.cpp mainline (server-cuda13) with --fit to
    # place the active MoE layers across all three GPUs; the large embedding table and
    # context KV stay host-memory/mmap-backed, so context scales to ~196K (verified
    # 2026-08-28). Do not preload this model alongside the resident models.
    # Re-pinned 2026-09-08 to the current 3-GPU set (5070 Ti d64df8cf, 5060 Ti
    # 57bbb375, 3090 93ab52e5) after the ZOTAC (af5bd53f) it used to pin returned-less;
    # validated: loads healthy at -c 196608, ~51 GiB VRAM across the three cards.
  Q3.8-FN-AC-IQ4_XS:
    # 2026-09-18: unlisted at Jim's request -- the MTP variant (Q3.8-FN-AC-IQ4XS-MTP) is
    # the one in use now. Still requestable by id; config kept for A/B reference.
    unlisted: true
    cmd: |
      docker run --rm --name qwen38-flash-next --runtime nvidia --ipc=host
      -e CUDA_VISIBLE_DEVICES=GPU-d64df8cf-c877-b43d-d9a5-d6b0e38e504a,GPU-57bbb375-a61a-6662-e9c8-447b948f0833,GPU-93ab52e5-8e61-197e-880a-aa6af5a13c74
      -p ${PORT}:8080 -v /mnt/data/models:/models
      --entrypoint /app/llama-server ghcr.io/ggml-org/llama.cpp:server-cuda13
      -m /models/AtomicChat-Qwen3.8-Flash-Next-IQ4/Qwen3.8-Flash-Next-AD-3.84bpw-IQ4_XS-M64-00001-of-00028.gguf
      --fit on
      # 2026-09-10 (MEASURED): with --fit-target the fit now uses ALL THREE GPUs --
      # ~50.1 GiB total at -c 196608, leaving 5060 Ti 977 MiB / 3090 2334 MiB /
      # 5070 Ti 1241 MiB free. Device order = 5070 Ti (CUDA0), 5060 Ti (CUDA1),
      # 3090 (CUDA2). Lowering the 3090 target to 512 changed nothing (used
      # 21737 -> 21757 MiB): --fit is LAYER-GRANULAR, so the next layer/experts do
      # not fit and it keeps ~2.3 GiB idle on the 3090 regardless. 1024 is therefore
      # the floor that GUARANTEES the requested >=1 GiB headroom on the 3090 (which
      # also carries the desktop). To consume the remaining 3090 slack you would
      # have to drop --fit and place layers by hand.
      --fit-target 1024,1024,1024
      --device CUDA0,CUDA1,CUDA2
      --threads 20
      --jinja --chat-template-file /models/qwen_sharp_template_oneline.jinja
      --chat-template-kwargs "{\"reasoning_effort\":\"medium\"}"
      --flash-attn on
      -c 196608
      # 2026-09-15 (MEASURED): -b 2048 -ub 512 beats the previous -b 512 -ub 256 on prefill
      # (+21% at 8k: 527->640 t/s; +22% at 32k: 483->590 t/s, TTFT 68.0->55.5 s; +20% at 98k)
      # with no decode cost. -ub 1024/2048 improve prefill slightly but collapse tg (33/24 t/s),
      # so -ub 512 is the ceiling. Loads healthy at -c 196608 (KV is preallocated at load).
      -b 2048
      -ub 512
      -ctk q8_0
      -ctv q8_0
      -np 1

      # engrams on ssd
      --load-mode none

      # draft speculation - ngram
      # ngram only, deliberately: qwen4exp MTP has been in mainline since 2026-10-01 (#29761)
      # and lives in the Q3.8-FN-AC-IQ4XS-MTP entry; this entry stays its no-MTP reference.
      --spec-type ngram-mod
      --spec-ngram-mod-n-match 24
      --spec-ngram-mod-n-min 24
      --spec-ngram-mod-n-max 86

      --reasoning-format deepseek
      --reasoning on
      --reasoning-preserve
      --temp 1.0
      --top-p 0.95
      --top-k 20
      --min-p 0.0
      --presence-penalty 0.0
      --repeat-penalty 1.0
      --timeout 900
      --host 0.0.0.0
      --port 8080
    cmdStop: docker stop qwen38-flash-next

    # Explore instance for the EnGram Explorer token-continuation browser
    # (~/llama-swap/engram-explorer, pm2 engram-explorer, http://marvin:8350). Re-created
    # 2026-10-01 on the AtomicChat IQ4_XS GGUF (its per_layer_token_embd engram table is
    # 320M x 160, Q5_1, 35.8 GiB) after the UD-IQ4_XS model and its explore entry were
    # removed. Identical to Q3.8-FN-AC-IQ4_XS except reasoning OFF and temp 0, so n_probs
    # continuations are substantive tokens, not chain-of-thought noise. The explorer
    # reaches it through llama-swap's /upstream/<model>/ passthrough (/tokenize,
    # /completion), so no fixed host port is needed. Not preloaded; swaps within
    # qwen38-workload like the other Flash-Next entries.
  Q3.8-FN-AC-IQ4_XS-explore:
    unlisted: true
    cmd: |
      docker run --rm --name qwen38-flash-next-explore --runtime nvidia --ipc=host
      -e CUDA_VISIBLE_DEVICES=GPU-d64df8cf-c877-b43d-d9a5-d6b0e38e504a,GPU-57bbb375-a61a-6662-e9c8-447b948f0833,GPU-93ab52e5-8e61-197e-880a-aa6af5a13c74
      -p ${PORT}:8080 -v /mnt/data/models:/models
      --entrypoint /app/llama-server ghcr.io/ggml-org/llama.cpp:server-cuda13
      -m /models/AtomicChat-Qwen3.8-Flash-Next-IQ4/Qwen3.8-Flash-Next-AD-3.84bpw-IQ4_XS-M64-00001-of-00028.gguf
      --fit on
      # 2026-09-10 (MEASURED): with --fit-target the fit now uses ALL THREE GPUs --
      # ~50.1 GiB total at -c 196608, leaving 5060 Ti 977 MiB / 3090 2334 MiB /
      # 5070 Ti 1241 MiB free. Device order = 5070 Ti (CUDA0), 5060 Ti (CUDA1),
      # 3090 (CUDA2). Lowering the 3090 target to 512 changed nothing (used
      # 21737 -> 21757 MiB): --fit is LAYER-GRANULAR, so the next layer/experts do
      # not fit and it keeps ~2.3 GiB idle on the 3090 regardless. 1024 is therefore
      # the floor that GUARANTEES the requested >=1 GiB headroom on the 3090 (which
      # also carries the desktop). To consume the remaining 3090 slack you would
      # have to drop --fit and place layers by hand.
      --fit-target 1024,1024,1024
      --device CUDA0,CUDA1,CUDA2
      --threads 20
      --jinja --chat-template-file /models/qwen_sharp_template_oneline.jinja
      --chat-template-kwargs "{\"reasoning_effort\":\"medium\"}"
      --flash-attn on
      -c 196608
      # 2026-09-15 (MEASURED): -b 2048 -ub 512 beats the previous -b 512 -ub 256 on prefill
      # (+21% at 8k: 527->640 t/s; +22% at 32k: 483->590 t/s, TTFT 68.0->55.5 s; +20% at 98k)
      # with no decode cost. -ub 1024/2048 improve prefill slightly but collapse tg (33/24 t/s),
      # so -ub 512 is the ceiling. Loads healthy at -c 196608 (KV is preallocated at load).
      -b 2048
      -ub 512
      -ctk q8_0
      -ctv q8_0
      -np 1

      # engrams on ssd
      --load-mode none

      # draft speculation - ngram
      # ngram only, deliberately: qwen4exp MTP has been in mainline since 2026-10-01 (#29761)
      # and lives in the Q3.8-FN-AC-IQ4XS-MTP entry; this entry stays its no-MTP reference.
      --spec-type ngram-mod
      --spec-ngram-mod-n-match 24
      --spec-ngram-mod-n-min 24
      --spec-ngram-mod-n-max 86

      --reasoning off
      --temp 0.0
      --top-p 0.95
      --top-k 20
      --min-p 0.0
      --presence-penalty 0.0
      --repeat-penalty 1.0
      --timeout 900
      --host 0.0.0.0
      --port 8080
    cmdStop: docker stop qwen38-flash-next-explore

  Strata-IQ3S:
    # THE ONE STRATA since 2026-10-12, when Strata-IQ3XXS (its comparison since
    # 2026-10-03) and its files were deleted, along with Q3.8-FN-Swift-IQ3_XXS.
    # Qwen3.8-Flash-Next GSQ-RCO IQ3_S, the bigger quant ("matches the full model"), on
    # official Strata 0.1.43 (since 2026-10-12; the marvin-tuned fork before): engine
    # config strata/strata-iq3_s.json, measurements in strata/README.md
    # (--resident-budget-gib 30 -> 27.8 GiB pinned, ~16 GiB RAM left available;
    # --vram-reserve-mib 957, as the engine asked). Files in /mnt/data/models/
    # Qwen3.8-Flash-Next-GSQ-RCO-IQ3_S; shard 2 (the PLE/engram table) is the same file
    # (same SHA-256) for every size; it was a symlink to the IQ3_XXS copy until that went.
    # PERSISTENT SINCE 2026-10-03: non-persistent, it was evicted by EVERY dictation
    # request -- llama-swap applies the resident group's `exclusive` on each request to a
    # member (s1-mini, whisper, chatterbox, h2o, bge-m3), not only on load.
    # RUNAWAY GUARD (2026-10-01). A request with NO max_tokens gets the whole context as
    # its output budget (~240K tokens), and Swift can fall into a thinking loop: the
    # librarian curator (ssd-nodes, model `subagent`, no max_tokens, 5-min client
    # timeout, intake every 5 min) ran three requests to 237-247K tokens, ~33 min each.
    # Strata only notices a vanished client when it writes to it, so a non-streaming
    # request keeps generating after the client gives up, and the next sweep queues
    # behind it. `max_tokens?` only fills a MISSING value (the "?"), so pi and other
    # clients that send their own max_tokens are unaffected. 16384 at ~110 t/s is
    # ~2.5 min: done inside the curator's 5-min timeout.
    # MOVED (2026-10-01) from a llama-swap `max_tokens?` filter to Strata's own
    # shared settings (now strata/strata-iq3_s.shared-settings.json, "max_tokens":
    # 16384). The filter only checked
    # max_tokens, so it also stamped requests that send max_completion_tokens (pi);
    # Strata fills the default only when a request has neither.
    checkEndpoint: /health
    proxy: http://127.0.0.1:${PORT}
    useModelName: qwen3.8-flash-next-iq3_s
    cmd: /home/jim/llama-swap/strata/run-strata.sh ${PORT} /home/jim/llama-swap/strata/strata-iq3_s.json
    # `subagent` (the factory builder role, the librarian curator) points here, and this
    # is the preloaded Strata.
    aliases: [subagent]
    # VOICE (2026-10-13): Home Assistant's voice assistant (Echo Show, via HA on Colin)
    # asks for `subagent-voice`, which is this same loaded model with thinking off.
    # HA's LiteLLM integration cannot send extra request fields itself. Measured: a
    # short voice answer 0.5 s with reasoning_effort none vs 1.1-1.8 s at the
    # shared-settings default (medium), and a tool-using reply makes 2-3 calls.
    # setParamsByID creates the alias itself; `subagent` callers are unaffected.
    filters:
      setParamsByID:
        "subagent-voice":
          reasoning_effort: none

    # MTP entry -- OFFICIAL IMAGE since 2026-10-06. Upstream merged qwen4exp MTP (#29761,
    # 2026-10-01) plus the qwen4exp speed-ups (#29824 masks, #29825 indexer memory), so the
    # danielhanchen qwen4exp/mtp fork (a host binary in images/qwen4exp-mtp) was retired and
    # deleted. History of the fork and its measurements: git log for this file.
    #
    # MTP DRAFT FILE: mainline needs ggml-org's MTP GGUF (ggml-org/Qwen3.8-Flash-Next-GGUF,
    # mtp-Qwen3.8-Flash-Next-Q4_0.gguf, 2.2 GB, in /mnt/data/models). The unsloth
    # mtp-...-Q4_K_M.gguf the fork used lacks the `qwen4exp.attention.recurrent_layers`
    # key: mainline then aborts at load with GGML_ASSERT(buffer) in
    # llama_kv_cache::set_input_k_idxs (k-pool). That file was deleted.
