  # --- Altworld/Hemmingway-1 (added 2026-09-21) ---
  # A prose-writing fine-tune of Qwen3.8-27B, Apache-2.0. bartowski imatrix Q4_K_M
  # (17.44 GB / 16.24 GiB), quantized with llama.cpp b10964. Built on the same base as
  # Q3.8-27B-* so this entry is a copy of Q3.8-27B-Q6KM with the deltas called out below.
  #
  # VERIFIED in the local GGUF header (2026-09-21): arch qwen35, 65 blocks, head_count 24,
  # head_count_kv 4, key/value_length 256, full_attention_interval 4, context 262144,
  # size_label 27B -- and the SAME 4 head-carrying MTP tensors the Q6KM entry documents:
  # blk.64.nextn.{eh_proj,enorm,hnorm,shared_head_norm} with nextn_predict_layers=1. So MTP
  # needs no separate export; the quants ship it, per the bartowski card.
  #
  # MTP MEASURED 2026-09-21 (same model, same prompt, two ways):
  #   --spec-type draft-mtp alone : 68.88 t/s, draft 240/131 (54.6%) -- uses the file's OWN
  #                                 nextn head; the log confirms "creating MTP draft context
  #                                 against the target model".
  #   + -md qwen3.8-mtp-Q4_0.gguf : 71.98 t/s, draft 234/133 (56.8%)
  # Both work, but -md IS DELIBERATELY OMITTED here. Two reasons:
  #  1. The gain above is ONE ~211-token run -- inside noise, and under 5%.
  #  2. It costs real VRAM, which this entry cannot spare. MEASURED 2026-09-21 by loading
  #     these same flags twice with only -md differing and diffing nvidia-smi after a full
  #     load (so the draft's KV + compute buffers are included):
  #         no -md  : 3090 15201 MiB + 5070 Ti 15167 MiB = 30368 MiB
  #         with -md : 3090 15603 MiB + 5070 Ti 15569 MiB = 31172 MiB
  #         => -md costs 804 MiB TOTAL, ~402 MiB PER CARD, split evenly.
  #     The draft FILE is 1307 MiB, but only ~804 MiB reaches VRAM because the draft BORROWS
  #     the target's embeddings and lm head (branch commit "llama: let an MTP draft borrow the
  #     target's embeddings and lm head"), so that portion is never loaded.
  #     At --fit off / --tensor-split 1.00,1.00 the 5070 Ti is the wall, so 402 MiB there is
  #     the difference between ~537 MiB and ~939 MiB free -- a materially safer margin.
  # Head-carrying MTP costs ZERO extra VRAM: the 4 nextn tensors are already inside the model
  # file, so this needs no second file and no second bind mount.
  # To re-enable the separate draft, restore the -md line AND `-v /mnt/data/models:/shared`.
  #
  # DELIBERATE OMISSIONS vs the 27B entries:
  #   --mmproj          : the model card lists "Input support: text". The Qwen3.8 vision
  #                       projector is not part of this fine-tune.
  #   -c 240000 (Q6KM)  : that cap exists to fit a 23 GB Q6_K. This file is 16.24 GiB, so the
  #                       full native 262144 is attempted here.
  #   --reasoning-budget -1 : Q6KM sets it (unlimited). Left OFF because a measured run on this
  #                       family with unlimited budget spent the whole allowance inside
  #                       reasoning and emitted no content tokens. Remove if you want it.
  #
  # Same 2-card pair (3090 + 5070 Ti) and the same no-P2P workaround as Q3.8-27B-Q6KM, so it
  # MUST stay in the `qwen38-workload` group or it will not swap.
  Hemmingway:
