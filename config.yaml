        # ############### #
        # DEEPSEEK MODELS #
        # ############### #

        # DeepSeek-V4-Flash-0731, unsloth UD-IQ2_M, 3 shards (added 2026-08-01) -- point -m at
        # the FIRST shard, llama.cpp auto-loads the rest.
        #
        # !! DIFFERENT MOUNT !! These shards live on /mnt/models (nvme1n1p5, its own XFS
        # partition), NOT /mnt/shared/models like every other entry in this file. Hence
        # `-v /mnt/models:/models`. Do not copy the usual mount line into this entry.
        #
        # Arch/size: `deepseek4`, 43 blocks, 256 routed experts + 1 shared, 6 active
        # (~285B total / ~9B active). Shards are 5 MB (metadata + tokenizer only, 0 tensors),
        # 46.5 GiB, and ~37 GiB -- ~84 GiB of weights against 47.8 GiB VRAM + 62 GiB RAM.
        # Per layer: ~1.80 GiB routed experts + ~0.14 GiB attention/shared; embd+output ~0.6 GiB.
        # So at least ~36 GiB of experts must live in RAM, realistically ~45 GiB once KV and
        # compute buffers have taken their share of VRAM.
        #
        # Quant choice (checked 2026-08-01) -- IQ2_M is the largest one that actually FITS, not the
        # best one available. Unsloth's ladder, with mean KL-divergence:
        #     UD-IQ2_M      84.7 GiB   KLD 0.3612   <- this entry; ~43 GiB RAM-side, ~84% of free RAM
        #     UD-Q2_K_XL    90.2 GiB   KLD 0.2992   ~50 GiB RAM-side = ~97% of free RAM, no slack for
        #                                           page-cache eviction; also ~13% slower decode (2 more
        #                                           expert layers on CPU) and forces -c down to ~128K.
        #     UD-IQ3_XXS    97.1 GiB   KLD 0.1842   DOES NOT FIT. ~95 GiB of usable weight budget exists
        #                                           before KV; Unsloth themselves spec 110GB+ RAM for it.
        # The big quality step is IQ3_XXS, and it needs 128 GB of RAM -- that, not a quant bump, is the
        # upgrade path. Q2_K_XL buys the least KLD per GiB of the three and eats all remaining headroom,
        # so it was considered and rejected. If IQ2_M proves too degraded, prefer switching models
        # (qwen3.5-122B-IQ3-MTP, laguna-s-2.1-mainline) over climbing this ladder.
        #
        # Placement: --fit on, same as laguna-s-2.1-mainline. It measures the real graph, spreads
        # non-expert weights + KV across all 3 cards, and offloads routed experts to RAM as
        # evictable mmap. Do NOT add -ngl / --n-cpu-moe / --tensor-split -- they abort the fit.
        # -c IS set explicitly so fit only adjusts placement, never context: left unset, fit
        # would chase the model's 1M native ctx and push nearly every expert into RAM, which
        # does not fit in 62 GiB and would thrash on NVMe.
        #
        # Deliberately NO --mlock and NO --no-mmap (unlike the qwen MoE entries): the ~45 GiB of
        # RAM-resident experts must stay evictable page cache, or a RAM spike becomes an OOM kill
        # instead of a re-read. (--mlock would fail on this host's RLIMIT_MEMLOCK anyway.)
        #
        # NO MTP / --spec-type draft-mtp: split.tensors.count is 1328 = blk.0-42 + embd/output
        # only, with no nextn block. Adding it aborts at load, same as qwen3.5-9B-Q8.
        #
        # The chat template is EMBEDDED in the GGUF (Unsloth's fixed one), so --jinja on its own
        # -- no --chat-template-file, unlike the qwen/gemma entries.
        #
        # Context: 262144 (256K). Native is 1048576 via YaRN (factor 16 over a 65536 base) and KV
        # is cheap on this arch -- deepseek4 compresses it per layer (attention.compress_ratios:
        # 2 layers uncompressed, 21 at 4x, 20 at 128x) on top of MLA (kv_lora 512 + 64 rope) and
        # a 128-token raw sliding window -- so 256K should cost only a few GiB. It is set
        # conservatively because `deepseek4` was brand new when this entry was written and its
        # real KV/compute buffers could not be measured: the 3rd shard was still downloading.
        # TO RAISE IT, load once and read the actual numbers:
        #   docker logs dsv4f 2>&1 | grep -E "KV self size|compute buffer|n_ctx|flash_attn|offloaded"
        # then trade GiB for GiB -- roughly every 1.8 GiB of extra KV pushes one more layer of
        # experts out of VRAM and into RAM, and RAM is the binding constraint here (~53 GiB free).
        # 524288 is the realistic next step up; 1048576 is not.
        #
        # Fit target is asymmetric because CUDA0 is the desktop 5070 Ti: keep 2 GiB free there
        # for interactive apps, 1 GiB on the dictation card (CUDA1), and 512 MiB on the otherwise
        # idle x8 5060 Ti (CUDA2). Fit sees dictation's live allocation before placing this model.
        # With dictation resident, -ub 1024 loaded at 262K context with 2.34 GiB free on the 5070
        # and prefetched a 1,033-token uncached prompt at 130.35 t/s (2026-08-13).
        # Levers if it will not load: -ctk q8_0 -ctv q8_0 halves KV but may be rejected on this
        # arch's compressed-KV path; -c 131072 as a floor.
        #
        # -fa auto rather than the `-fa on` used everywhere else, on purpose: if this arch has no
        # flash-attention kernel yet, `on` aborts the load whereas `auto` falls back. Check the log
        # for "flash_attn = 1" and switch to `on` once confirmed.
        #
        # Sampling is DeepSeek's own, NOT the 0.6/0.95 the qwen entries use. general.sampling.temp
        # and top_p in the GGUF are both 1.0; the model card says temp 1.0 with top_p 1.0 in
        # general, or top_p 0.95 for agentic use -- switch to 0.95 if you drive this with a tool
        # loop. Note that temp 1.0 / top_p 1.0 / top-k 0 / penalties at their no-op values is not
        # an arbitrary choice: DeepSeek's own API documents that thinking mode ignores temperature,
        # top_p, presence_penalty and frequency_penalty outright (accepted for compatibility, no
        # effect), so this block is what reproduces hosted behaviour locally. That silent-ignore is
        # an API-side policy, NOT a property of the weights -- llama.cpp knows nothing about
        # "thinking mode" and WILL apply whatever you put here, so do not set temp 0.6 and assume
        # the model overrides it. See https://api-docs.deepseek.com/guides/thinking_mode/
        #
        # !! ALWAYS SEND A SYSTEM PROMPT !! (measured 2026-08-01, n=6 per condition, fixed seeds)
        # On a low-signal prompt -- literally "Hi" -- this quant picks its output language at the
        # first token of the <think> block and gets it wrong often: 3/6 replies came back entirely
        # in Chinese, one in French. It is sticky, so the whole conversation then continues in it.
        #   temp 1.0 / top_p 1.0 / top-k 0 (as configured):  3/6 Chinese
        #   temp 0.6 / top_p 0.95 / top-k 40 (tightened):    2/6 Chinese   <- sampling is NOT the fix
        #   any system prompt pinning English:               0/6 Chinese   <- this is the fix
        # Substantive English prompts carry enough signal to mask it, so it looks fine until someone
        # opens the playground and types "Hi". This is quantization damage to the language prior, not
        # a template or client bug -- consistent with IQ2_M's 0.3612 KLD (see the quant ladder above),
        # and another argument for UD-Q2_K_XL if it keeps biting.
        # There is no server-side lever: --system-prompt-file / -spf no longer exist in this build. The
        # only ways to guarantee it are (a) the client always sends a system prompt, or (b) extract the
        # embedded template to a .jinja file and inject a default directive when no system message is
        # present, then point --chat-template-file at it like the qwen/gemma/laguna entries do.
        #
        # Thinking is OFF by default -- the embedded template does `{%- set thinking = false -%}`
        # and gates <think>/</think> on it (this is NOT the qwen <|think_on|> tag scheme). To turn
        # it on, add:  --chat-template-kwargs "{\"thinking\": true}"  . --reasoning-format none is
        # kept so the raw <think> block reaches the client either way, as with the other entries.
        #
        # The real depth knob is `reasoning_effort` (template default: none; accepts 'low', 'high',
        # 'max'), which injects an effort directive into the prompt -- combine as
        #   --chat-template-kwargs "{\"thinking\": true, \"reasoning_effort\": \"high\"}"
        # Watch the context budget if you do: DeepSeek documents up to 384K output tokens at high/
        # max effort, which does not fit the 256K -c set here. Cap it client-side via max_tokens.
        #
        # NB: the `dictation` group is persistent: true, so parakeet-asr + qwen-clean-2b are NOT
        # evicted automatically. Unload them before loading this, or --fit will find the ZOTAC
        # (CUDA idx 0) short and shrink the GPU share -- pushing yet more experts into RAM.
        #
        # MTP evaluation profile (replaced DSpark 2026-08-04). 131K context, same IQ2_M target.
        # Uses the MTP draft head from ddh0/DeepSeek-V4-Flash-GGUF (Q8_0, ~4.4 GB) instead of
        # the DSpark drafter (~10 GB). MTP is self-speculative (nextn baked into the assistant),
        # wired with -md like the gemma entries rather than --model-draft.
        #
        # Use the pinned official b10362 runtime shared with Muse Glimmer. The older v246 image
        # supports DeepSeekV4 MTP but auto-fit aborts while measuring this graph. The draft GGUF
        # is an mtp-only partial model (block 43 + nextn heads, no blk.0-42); current llama.cpp
        # auto-detects that (mtp_only) and marks the trunk tensors TENSOR_NOT_REQUIRED.
        #
        # PLACEMENT (re-tuned 2026-08-13 with dictation resident): dynamic fit replaces the old
        #   fixed tensor split, which could leave too little room on CUDA1 for the KV cache. Fit
        #   b10362 includes the separately-loaded MTP model in its fit result, so CUDA0 only
        #   reserves the desired 2 GiB desktop headroom. CUDA1 reserves 1 GiB above dictation's
        #   live allocation; CUDA2 reserves 512 MiB.
        #   Device map: CUDA0 = 5070 Ti, CUDA1 = ZOTAC 5060 Ti (dictation), CUDA2 = MSI
        #   5060 Ti (fastest-first enumeration).
        #
        # DRAFT DEPTH: --spec-draft-n-max 1, NOT 3. DeepSeek-V4 MTP has a single nextn block
        #   that drafts sequentially; drafting 3 tokens ahead collapses acceptance (0.38 @
        #   n-max 3 vs 0.81 @ n-max 1) and the extra draft decodes eat the gains. n-max 1
        #   measured 16.01 t/s warm vs 14.36 @ n-max 2, 7.68 @ n-max 3 cpu-moe.
        #
        # MEASURED 2026-08-04 (warm = 2nd+ request; 1st request is polluted by graph-capture
        #   warmup, ~30 s regardless of placement/ctx -- do not benchmark first requests):
        #   this entry 16.01-16.09 t/s @ 0.815 acceptance; DSpark (replaced) was 17.02-17.53
        #   t/s @ 0.697 -- effectively parity, minus the 10 GB DSpark draft file.
        # MEASURED 2026-08-13 (new fit, dictation resident): a 7 GiB CUDA0 fit target left the
        #   5070 only 53% used because b10362 already accounts for MTP memory. Reduced to 2 GiB
        #   to place more target layers there while preserving desktop headroom: final 5070 use
        #   rose from 8.71 GiB (53.4%) to 13.84 GiB (84.9%), leaving 2.00 GiB free. On the same
        #   3,082-token uncached prefill, throughput rose from 139.24 to 156.34 t/s (+12.3%).
        deepseek-v4-flash-IQ2-MTP-131K:
            cmd: |
                docker run --rm --name dsv4f-mtp --runtime nvidia --cap-add SYS_ADMIN
                -p ${PORT}:8080 -v /mnt/models:/models
                --entrypoint /app/llama-server
                ghcr.io/ggml-org/llama.cpp@sha256:1190d8f78e90466e6ed8c8f02eaa0eb6fd9c07b5a4ace1f669e4bbeef13775aa
                -m /models/deepseek-v4-flash/DeepSeek-V4-Flash-0731-UD-IQ2_M-00001-of-00003.gguf
                -md /models/deepseek-v4-flash/DeepSeek-V4-Flash-MTP-Q8_0.gguf
                --jinja
                --fit on
                --fit-target 2048,1024,512
                --device CUDA0,CUDA1,CUDA2
                --spec-type draft-mtp,ngram-mod
                --spec-draft-n-max 3
                --spec-draft-device CUDA0
                --spec-ngram-mod-n-match 24
                --spec-ngram-mod-n-min 48
                --spec-ngram-mod-n-max 64
                --gpu-layers-draft 99
                -c 131072
                --threads 20
                -fa auto
                -np 1
                -b 2048
                -ub 1024
                --temp 1.0
                --top-p 0.95
                --top-k 0
                --min-p 0.0
                --presence-penalty 0.0
                --repeat-penalty 1.0
                --reasoning-format none
                --timeout 900
                --host 0.0.0.0
                --port 8080
            cmdStop: docker stop dsv4f-mtp

        # DSpark evaluation profile (re-tuned 2026-08-13 with dictation resident). Dynamic fit
        # replaces the stale fixed split that OOMed CUDA1 while allocating its KV cache. Fit does
        # not include the separately-loaded 10.15 GiB DSpark model. The draft runs on the idle
        # x8 5060 Ti (CUDA2), where the target's shared output.weight naturally lands, so CUDA2
        # reserves 13 GiB. CUDA0 keeps 2 GiB free for desktop apps and CUDA1 keeps 1 GiB above
        # dictation's live allocation. Do not pin output.weight manually: tensor overrides make
        # auto-fit abort before placement.
        #
        # MEASURED 2026-08-04 (warm, 131K, same prompt as the MTP benchmark): 16.59 t/s @
        # 0.589 acceptance / mean len 2.75. MTP entry (n-max 1): 16.01-16.09 t/s @ 0.815 -- a
        # dead heat; DSpark marginally ahead on this run. Original cpu-moe config measured
        # 17.02-17.53 t/s on 2026-08-03, so both drafts sit in the same ~16-17.5 band.
        # MEASURED 2026-08-13 (new fit, dictation resident, 1,033 uncached prompt tokens):
        #   -ub 512 = 84.68 t/s; -ub 1024 = 97.12 t/s; -ub 2048 = 72.70 t/s. Keep 1024:
        #   the 2048 compute buffer evicts enough target weights to make prefill slower overall.
        #
        # Legacy notes from the original 2026-08-03 eval: no-draft control at the old placement
        # was 7.90-9.07 t/s; the 131K auto-fit control was 13.36 t/s median.
        deepseek-v4-flash-IQ2-dspark-131K:
            cmd: |
                docker run --rm --name dsv4f-dspark --runtime nvidia --cap-add SYS_ADMIN
                -p ${PORT}:8080 -v /mnt/models:/models
                --entrypoint /app/llama-server
                ghcr.io/ggml-org/llama.cpp@sha256:1190d8f78e90466e6ed8c8f02eaa0eb6fd9c07b5a4ace1f669e4bbeef13775aa
                -m /models/deepseek-v4-flash/DeepSeek-V4-Flash-0731-UD-IQ2_M-00001-of-00003.gguf
                --model-draft /models/deepseek-v4-flash/DeepseekV4-Flash-20260731-DSpark.gguf
                --jinja
                --fit on
                --fit-target 2048,1024,13312
                --device CUDA0,CUDA1,CUDA2
                --spec-type draft-dspark
                --spec-draft-n-max 3
                --spec-draft-device CUDA2
                --gpu-layers-draft 4
                -c 131072
                --threads 20
                -fa auto
                -np 1
                -b 2048
                -ub 1024
                --temp 1.0
                --top-p 1.0
                --top-k 0
                --min-p 0.0
                --presence-penalty 0.0
                --repeat-penalty 1.0
                --reasoning-format none
                --timeout 900
                --host 0.0.0.0
                --port 8080
            cmdStop: docker stop dsv4f-dspark

        # ################ #
        # EMBEDDING MODELS #
        # ################ #

        bge-m3:
            unlisted: true
            cmd: |
                docker run --rm --name bge --runtime nvidia --cap-add SYS_ADMIN
                -p ${PORT}:8080 -v /mnt/shared/models:/models
                --entrypoint /app/llama-server ghcr.io/mostlygeek/llama-swap:cuda
                -m /models/bge-m3-FP16.gguf
                --host 0.0.0.0
                --port 8080
                --ctx-size 8192
                --batch-size 8192
                --rope-scaling yarn
                --rope-freq-scale 0.75
                -ngl 99
                --embeddings
                --no-mmap
            cmdStop: docker stop bge

        # Qwen3-Embedding-4B (added 2026-07-04): upgrade over bge-m3 for CODE retrieval.
        # Qwen3-Embedding is explicitly trained for code + 100 languages, tops MTEB, and is
        # vLLM-native (same ecosystem as the LLMs). 4B = quality/VRAM sweet spot on a 16GB
        # card (~8GB BF16, loads on one GPU, no TP). Use for indexing a codebase for RAG.
        # bge-m3 kept above for general multilingual dense+sparse; this one for code search.
        #
        # HARD-WON SETUP NOTES (2026-07-04):
        #  - `--runner pooling` is the embedding flag in vLLM 0.22 (the old `--task embed`
        #    is gone). It auto-configures LAST-token pooling for Qwen3-Embedding.
        #  - `--enforce-eager`: skip torch.compile/cudagraph capture. Right call for a
        #    swap-in embedder (fast start > peak throughput; a single forward pass barely
        #    benefits from cudagraphs). Without it, first start compiles for many minutes.
        #  - LOCAL PATH + HF_HUB_OFFLINE=1: point at the pre-downloaded dir, NOT the HF id.
        #    With the HF id, vLLM makes unauthenticated HF Hub calls at load that get
        #    rate-limited and HANG forever (model loads to VRAM then sits at 0% util). The
        #    model was snapshot_download'd to /mnt/shared/models/Qwen3-Embedding-4B.
        #  - Pinned to one card (device 0). Embedding needs no TP; llama-swap serves one
        #    model at a time so it has the GPU to itself. Query the OpenAI /v1/embeddings
        #    endpoint with model=qwen3-embedding-4b. NB Qwen3-Embedding wants an instruction
        #    prefix on QUERIES (not documents) for best retrieval -- that's a client concern.
        qwen3-embedding-4b:
            unlisted: true
            cmd: |
                docker run --rm --name qwen3emb --runtime nvidia --ipc=host
                -e HF_HUB_OFFLINE=1 -e TRANSFORMERS_OFFLINE=1
                -e CUDA_DEVICE_ORDER=PCI_BUS_ID -e CUDA_VISIBLE_DEVICES=0
                -e VLLM_NO_USAGE_STATS=1
                -p ${PORT}:8000 -v /mnt/shared/models:/models
                vllm/vllm-openai:latest
                --model /models/Qwen3-Embedding-4B
                --runner pooling
                --enforce-eager
                --served-model-name qwen3-embedding-4b
                --max-model-len 8192
                --gpu-memory-utilization 0.60
                --host 0.0.0.0
                --port 8000
            cmdStop: docker stop qwen3emb

        # ############### #
        # DICTATION       #
        # ############### #
        # Speech-to-text dictation pipeline (added 2026-07-26; ASR moved to the NPU 2026-08-04).
        # Capture (ASR on the NPU) + cleanup (LLM on the ZOTAC) kept RESIDENT TOGETHER via the
        # `dictation` group (swap:false; defined at the bottom of this file) so a capture ->
        # cleanup round trip never unloads/reloads between steps.
        #
        # ASR now runs ENTIRELY on the Core Ultra 7 265KF's NPU (13 TOPS) via OpenVINO GenAI's
        # static WhisperPipeline -- NO GPU, so the ASR leg works even while 3-GPU --fit models
        # hold GPU 0. Cleanup (qwen-clean-2b) is the only dictation member left on the ZOTAC.
        #
        # FLOW: POST /v1/audio/transcriptions (model=whisper-npu-asr) -> transcript
        #    -> POST /v1/chat/completions   (model=qwen-clean-2b) -> clean text.
        # llama-swap routes each request by its `model` field; the group keeps both loaded.
        #
        # --- ASR: distil-whisper/distil-medium.en (int8) on the Intel NPU --------------------
        # Added 2026-08-04 (replaces parakeet-asr as the primary dictation ASR). ~1.5s per clip
        # (fixed 30s-window encoder floor; still faster than real-time), WER closest to Parakeet
        # of the NPU options (~2% vs ~1.4% on LibriSpeech test-clean). Server: npu/asr_server.py
        # (FastAPI, OpenAI /v1/audio/transcriptions) over ov_genai.WhisperPipeline(device="NPU",
        # static). Export recipe + decoder patcher + full benchmark matrix: npu/README.md.
        # LD_LIBRARY_PATH is REQUIRED -- the rootless NPU Level Zero driver lives in the venv's
        # openvino/libs dir (the loader does not self-locate).
        whisper-npu-asr:
            checkEndpoint: /health
            env:
                - LD_LIBRARY_PATH=/home/jim/npu-env/lib/python3.13/site-packages/openvino/libs
            cmd: |
                # SIGTERM on unload is clean (uvicorn shuts down); no cmdStop needed.
                /home/jim/npu-env/bin/python /home/jim/llama-swap/npu/asr_server.py --port ${PORT}
                --model-dir /mnt/shared/models/distil-medium.en-npu

        # --- ASR FALLBACK: NVIDIA Parakeet TDT 0.6B (ONNX) via achetronic/parakeet ------------
        # Kept OUT of the dictation group since 2026-08-04: it needs the ZOTAC (GPU 0), which
        # defeats the NPU ASR's GPU-freedom. Load on demand (model=parakeet-asr) if the NPU
        # server is down or its quality gap matters. OpenAI-compatible, English, lowest WER of
        # all ASR options. The :latest-cuda image SHIPS the model built in (fp32 ~2.5 GB); pass
        # `language=en` per request. Server listens on :5092.
        parakeet-asr:
            checkEndpoint: none
            unlisted: true
            cmd: |
                docker run --rm --name parakeet --runtime nvidia
                -e CUDA_VISIBLE_DEVICES=GPU-af5bd53f-a1ca-d807-1ae2-7f5ef261fe1a
                -p ${PORT}:5092
                ghcr.io/achetronic/parakeet:latest-cuda
            cmdStop: docker stop parakeet

        # (gemma-clean-e4b / gemma-clean-e2b removed 2026-07-26: superseded by qwen-clean-2b,
        #  which matches their quality ~40x faster. GGUFs deleted from /mnt/shared/models.)

        # --- CLEANUP C: Qwen3.5-2B instruct, thinking OFF -- fast cleanup (added 2026-07-26) --
        # ~134ms/cleanup at ~90 tok/s; matches gemma-clean-e4b quality on the four dictation
        # behaviours but ~40x faster. enable_thinking:false is ESSENTIAL -- with thinking on, the
        # answer goes into reasoning_content and `content` returns empty. Used by baruch-server
        # (BARUCH_CLEANUP_MODEL). See baruch docs/eval-cleanup.md.
        qwen-clean-2b:
            cmd: |
                docker run --rm --name qclean-2b --runtime nvidia --cap-add SYS_ADMIN
                -e CUDA_VISIBLE_DEVICES=GPU-af5bd53f-a1ca-d807-1ae2-7f5ef261fe1a
                -p ${PORT}:8080 -v /mnt/shared/models:/models
                # known-good image build: b9692
                --entrypoint /app/llama-server ghcr.io/mostlygeek/llama-swap:cuda
                -m /models/Qwen3.5-2B-UD-Q4_K_XL.gguf
                --jinja --chat-template-file /models/froggeric_qwen_35_36_38_chat_template.jinja
                --chat-template-kwargs "{\"enable_thinking\": false}"
                -ngl 99
                -c 16384
                -fa on
                -np 1
                --temp 0.3
                --top-p 0.95
                --top-k 64
                --min-p 0.0
                --host 0.0.0.0
                --port 8080
            cmdStop: docker stop qclean-2b

# ############################################################################## #
# GROUPS                                                                          #
#   `dictation`: keep ASR (NPU) + cleanup LLM (ZOTAC) resident together.         #
#     swap:false       -> members coexist; capture <-> cleanup never unloads.     #
#     exclusive:false  -> does NOT evict your other (ungrouped) models.           #
#     persistent:true  -> kept resident once loaded; a big-model load can't evict #
#                         it (enables coexistence). Loads on 1st request, not boot #
#   COEXISTENCE: whisper-npu-asr is GPU-free (runs on the NPU). qwen-clean-2b      #
#   sits on GPU 0 (ZOTAC), which the 3-GPU --fit models (laguna-s-2.1 /            #
#   qwen3.5-122B / Qwen3.6-27B-Q8) ALSO use -- don't run those concurrently with  #
#   CLEANUP, or GPU 0 will OOM (the NPU ASR still works). The 2-GPU entries       #
#   (vLLM TP + the -sm tensor TP entry, pinned to idx 1,2) coexist with it fine.   #
# ############################################################################## #
groups:
    'default':
        swap: false
        exclusive: false
        persistent: true
        members:
            - Qwen3.8-27B-UD-IQ4_XS-MTP-TP
            - gemma-4-E4B-MTP
            - qwen-clean-2b
            - whisper-npu-asr
