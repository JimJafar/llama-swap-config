  # general.name is "Miroslav 1.0"). Same 2-card pair as Q6KM/Hemmingway:
  # 3090 + 5070 Ti, no-P2P workaround, tensor mode, full native context.
  #
  # VERIFIED in the local GGUF header (2026-09-26; 866 tensors; file COMPLETE --
  # expected size from the tensor table == actual size, byte-exact): arch
  # qwen35, 65 blocks (64 + 1 MTP block), head_count 24, head_count_kv 4,
  # key/value_length 256, full_attention_interval 4, context 262144,
  # nextn_predict_layers 1, and the SAME 4 head-carrying MTP tensors as
  # Q6KM/Hemmingway: blk.64.nextn.{eh_proj,enorm,hnorm,shared_head_norm}.
  # So MTP uses the file's OWN head: no -md, no second file, no extra VRAM
  # (the Hemmingway measurement put the separate draft at +804 MiB for <5%).
  # This is structurally the same model as Hemmingway, so that entry is the
  # right template -- and its arch/flags are already proven on this card pair.
  #
  # QUANT: 21.28 GiB of tensor data = Q6_K 19.07 + Q8_0 1.88 + Q4_0 0.22 +
  # F32 0.10 GiB (24.97B params at Q6_K). K-quants only, so -sm tensor is safe;
  # the GGML_ASSERT SPLIT_AXIS_UNKNOWN trap is for plain I-quants.
  #
  # BUDGET at -c 262144, q8_0 KV. KV is cheap on this hybrid: 16 of 64 layers
  # carry it (full_attention_interval 4 -> blocks 3,7,...,63) at 4 KV heads x
  # 256 (k) + 4 x 256 (v) = 2048 elems/layer/token => ~34 KiB/token at q8_0
  # => ~8.5 GiB for 262144. f16 KV needs 16 GiB and does NOT fit this pair, so
  # q8_0 here is a requirement, not a preference.
  #
  # Anchored on the MEASURED Hemmingway load (same arch, same cards, same
  # flags, 16.24 GiB): 3090 15201 + 5070 Ti 15167 = 30368 MiB, i.e. ~13.7 GiB
  # of non-weight overhead (KV + graph reserve + SSM state). Our weights are
  # 5.04 GiB larger, so Hemmingway's 1.00,1.00 would OOM device1 -- this file
  # needs the Q6KM-262K weighting.
  #
  # SPLIT: 1.00,0.65 -- the value the Q6KM 262K snapshot used for a 22.01 GiB
  # file at this same context on this same pair. Solving the per-card budget
  # (3090 <= 21548, 5070 Ti <= 15385 MiB after 1024/512 headroom) gives a
  # feasible 3090 weight share of 0.58-0.62; 1.00,0.65 = 0.606 and predicts
  # ~550 MiB free on the 3090 / ~850 MiB on the 5070 Ti. The split is a SHARP
  # threshold (see the IQ4XS notes), so if graph_reserve OOMs on device1 step
  # to 1.00,0.60 -- and only then start lowering -c.
  #
  # MUST stay in `qwen38-workload` or it will not swap with the other entries
  # that use these two cards. CAUTION: the persistent `factory-resident`
  # Q3.8-27B-IQ4XS also owns the 3090 + 5070 Ti; if it is loaded, unload it
  # first (switch-profile.sh) -- this entry cannot evict a persistent group.
  Swift-1.5-27B-Q6KS:
    cmd: |
      docker run --rm --name swift27b --runtime nvidia --cap-add SYS_ADMIN
      --ipc=host
      # CUDA0 = 3090 = --main-gpu 0 (this is also the desktop card, hence the
      # larger 1024 MiB headroom in the split reasoning), CUDA1 = 5070 Ti.
      -e CUDA_VISIBLE_DEVICES=GPU-93ab52e5-8e61-197e-880a-aa6af5a13c74,GPU-d64df8cf-c877-b43d-d9a5-d6b0e38e504a
      -e NCCL_P2P_DISABLE=1 -e NCCL_CUMEM_ENABLE=0
      -e LD_PRELOAD=/opt/newnccl/libnccl.so.2
      -v /home/jim/llama-swap/vendor/libnccl.so.2.30.4:/opt/newnccl/libnccl.so.2:ro
      -p ${PORT}:8080 -v /mnt/data/models:/models
      # official mainline image: MTP is in mainline since 2026-09-07 and is
