      -m /models/Qwen3.6-27B-Q6_K.gguf
      -c 98304
      -ngl 999
      --flash-attn on
      -ctk q4_0
      -ctv q4_0
      --main-gpu 0
      --tensor-split 1.1,1
      -np 1
      --no-mmap
      -b 1024
      -ub 1024
      --temp 0.6
      --top-p 0.95
      --top-k 20
      --min-p 0.05
      --presence-penalty 0.0
      --repeat-penalty 1.0
      --reasoning-budget -1
      --chat-template-kwargs "{\"preserve_thinking\": true}"
      --timeout 900
      --host 0.0.0.0
      --port 8080
    cmdStop: docker stop q27q6
  Qwen3.6-27B-NVFP4:
