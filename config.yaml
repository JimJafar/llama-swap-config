# llama-swap runs as a host binary (llama-swap-bin AUR) and launches each model
# as a docker container. llama.cpp models use the bundled mostlygeek image with
# the entrypoint overridden to /app/llama-server; the vLLM model uses the vllm
# image. ${PORT} is assigned by llama-swap and published from the container; the
# server inside always listens on its own fixed port. cmdStop stops the named
# container cleanly on swap so VRAM is freed.
#
# Shared docker flags for llama.cpp models:
#   --runtime nvidia --cap-add SYS_ADMIN  (matches the previously-working setup)
#   --entrypoint /app/llama-server        (image entrypoint is llama-swap)
models:
  qwen3.6-35B-Q4:
    cmd: |
      docker run --rm --name q35b --runtime nvidia --cap-add SYS_ADMIN
      -p ${PORT}:8080 -v /home/jim/models:/models
      --entrypoint /app/llama-server ghcr.io/mostlygeek/llama-swap:cuda
      -m /models/Qwen3.6-35B-A3B-UD-Q4_K_M.gguf
      --fit on
      --fit-ctx 128000
      --fit-target 256
      -np 1
      -fa on
      --no-mmap
      --mlock
      -b 2048
      -ub 2048
      -ctk q8_0
      -ctv q8_0
      --temp 0.6
      --top-p 0.95
      --top-k 20
      --min-p 0.0
      --presence-penalty 0.0
      --repeat-penalty 1.0
      --reasoning-budget -1
      --chat-template-kwargs "{\"preserve_thinking\": true}"
      --timeout 900
      --host 0.0.0.0
      --port 8080
    cmdStop: docker stop q35b
  qwen3.6-27B-Q6:
    cmd: |
      docker run --rm --name q27q6 --runtime nvidia --cap-add SYS_ADMIN
      -p ${PORT}:8080 -v /home/jim/models:/models
      --entrypoint /app/llama-server ghcr.io/mostlygeek/llama-swap:cuda
      -m /models/Qwen3.6-27B-Q6_K.gguf
      -c 98304
      -ngl 999
      --flash-attn on
      -ctk q4_0
      -ctv q4_0
      --main-gpu 0
      --tensor-split 1.1,1
      -np 1
      --no-mmap
      -b 1024
      -ub 1024
      --temp 0.6
      --top-p 0.95
      --top-k 20
      --min-p 0.05
      --presence-penalty 0.0
      --repeat-penalty 1.0
      --reasoning-budget -1
      --chat-template-kwargs "{\"preserve_thinking\": true}"
      --timeout 900
      --host 0.0.0.0
      --port 8080
    cmdStop: docker stop q27q6
  Qwen3.6-27B-NVFP4:
    cmd: |
      docker run --rm --name q27nvfp4 --runtime nvidia --cap-add SYS_ADMIN
      -p ${PORT}:8080 -v /home/jim/models:/models
      --entrypoint /app/llama-server ghcr.io/mostlygeek/llama-swap:cuda
      -m /models/AEON-Qwen3.6-27B-Ultimate-Uncensored-Multimodal-NVFP4-XS.gguf
      -ngl 99
      --flash-attn on
      --spec-draft-n-max 2
      -b 2048
      -c 52000
      -ctk q8_0
      -ctv q8_0
      --main-gpu 0
      --tensor-split 1.1,1
      -np 1
      -ub 512
      --temp 0.6
      --top-p 0.95
      --top-k 20
      --min-p 0.05
      --presence-penalty 0.0
      --repeat-penalty 1.0
      --reasoning-budget -1
      --chat-template-kwargs "{\"preserve_thinking\": true}"
      --timeout 900
      --host 0.0.0.0
      --port 8080
    cmdStop: docker stop q27nvfp4
  Qwen3.6-27B-Q5-MTP:
    cmd: |
      docker run --rm --name q27mtp --runtime nvidia --cap-add SYS_ADMIN
      -p ${PORT}:8080 -v /home/jim/models:/models
      --entrypoint /app/llama-server ghcr.io/mostlygeek/llama-swap:cuda
      -m /models/Qwen3.6-27B-UD-Q5_K_XL.gguf
      -ngl 99
      --flash-attn on
      # --spec-type draft-mtp
      # --spec-draft-n-max 3

      --spec-type draft-mtp,ngram-mod
      --spec-draft-n-max 3
      --spec-ngram-mod-n-match 40
      --spec-ngram-mod-n-min 0
      --spec-ngram-mod-n-max 16

      # --spec-draft-p-min 0.75
      # --cache-type-k-draft q5_0
      # --cache-type-v-draft q5_0

      # --kv-unified
      -b 2048
      -c 156000
      -ctk q8_0
      -ctv q8_0
      --main-gpu 0
      --tensor-split 1,1
      -np 1
      -ub 512
      --temp 0.6
      --top-p 0.95
      --top-k 20
      --min-p 0.05
      --presence-penalty 0.0
      --repeat-penalty 1.0
      --reasoning-budget -1
      --chat-template-kwargs "{\"preserve_thinking\": true}"
      --timeout 900
      --host 0.0.0.0
      --port 8080
    cmdStop: docker stop q27mtp
  # NVFP4 + MTP via vLLM is parked — it loads but dual-GPU TP deadlocks at the
  # first all-reduce on this NODE (no-P2P) topology, and the ~15 GB model won't
  # fit one 16 GB card. See README "Parked: NVFP4 + MTP via vLLM" for the full
  # investigation and the best-known command to resume from.
  gemma-4-31B-Q4-QAT:
    # Tuned 2026-06-08: ~25 -> ~31 tok/s decode (measured, empty-context).
    # Key change vs the old `--fit` config: bias layers onto the fast 5070 Ti
    # (--tensor-split 2,1) instead of capacity-balancing onto the slow 5060 Ti,
    # and drop the 156K context (which over-allocated KV and crowded the 5070).
    # Measured split: 5070 ~14.5G / 5060 ~7.7G. Nudge --tensor-split toward "1,1"
    # only if you raise -c and the 5070 OOMs; toward "2.3,1" for a bit more speed
    # if the 5070 has headroom. -ub 512 keeps the 5060's prefill buffer safe.
    cmd: |
      docker run --rm --name g31q4 --runtime nvidia --cap-add SYS_ADMIN
      -p ${PORT}:8080 -v /home/jim/models:/models
      --entrypoint /app/llama-server ghcr.io/mostlygeek/llama-swap:cuda
      -m /models/gemma-4-31B-it-qat-UD-Q4_K_XL.gguf
      -ngl 99
      -c 98304
      --tensor-split 1.5,1
      -np 1
      -fa on
      --no-mmap
      --mlock
      -b 2048
      -ub 256
      -ctk q8_0
      -ctv q8_0
      --temp 0.6
      --top-p 0.95
      --top-k 64
      --min-p 0.0
      --presence-penalty 0.0
      --repeat-penalty 1.0
      --reasoning-budget -1
      --chat-template-kwargs "{\"preserve_thinking\": true}"
      --timeout 900
      --no-context-shift
      --ctx-checkpoints 128
      --host 0.0.0.0
      --port 8080
    cmdStop: docker stop g31q4
  gemma-4-31B-Q6:
    cmd: |
      docker run --rm --name g31q6 --runtime nvidia --cap-add SYS_ADMIN
