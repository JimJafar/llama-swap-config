# llama-swap runs as a host binary (llama-swap-bin AUR) and launches each model
# as a docker container. llama.cpp models use the bundled mostlygeek image with
# the entrypoint overridden to /app/llama-server; the vLLM model uses the vllm
# image. ${PORT} is assigned by llama-swap and published from the container; the
# server inside always listens on its own fixed port. cmdStop stops the named
# container cleanly on swap so VRAM is freed.
#
# Shared docker flags for llama.cpp models:
#   --runtime nvidia --cap-add SYS_ADMIN  (matches the previously-working setup)
#   --entrypoint /app/llama-server        (image entrypoint is llama-swap)
#
# Max seconds to wait for a model to become ready after launch. Raised from the 120s
# default for the vLLM entries (e.g. qwen36-27b-nvfp4), which take ~180s to load + capture graphs.
healthCheckTimeout: 600

# Warm the whole 'default' group on every llama-swap start/restart (fires a
# background GET / at each model; swap:false in the group keeps them coexisting
# instead of swapping). 27B is the slow leg (~30-60 s); healthCheckTimeout
# covers it. Runtime eviction (e.g. a 122B/curator load) does NOT re-trigger
# this -- members just reload on their next request.
hooks:
    on_startup:
        preload:
            - Qwen3.8-27B-UD-IQ4_XS-MTP-TP
            - gemma-4-E4B-MTP
            - qwen-clean-2b
            - whisper-npu-asr

# Qwen 3.5/3.6/3.8 jinja template fix
#
# The fixed template comes from here: https://huggingface.co/froggeric/Qwen-Fixed-Chat-Templates/blob/main/README.md
#
# All Qwen 3.5, 3.6 and 3.8 variants should have `--jinja --chat-template-file /models/froggeric_qwen_35_36_38_chat_template.jinja`
# (llama.cpp). The .jinja file must live in the MOUNTED models dir (/mnt/shared/models on the host,
# which is bind-mounted to /models in every container) -- a host-side repo path is invisible inside
# the container. For the vLLM entry the flag is `--chat-template <path>` instead (no --jinja).
#
# The Thinking Toggle
#
# You can control the model reasoning behavior. Insert `<|think_on|>` or `<|think_off|>` anywhere in your system or user prompt. The template intercepts the tag, removes it from the final context so the model never sees it, and flips the reasoning mode instantly.
#
# **Fast answer, no reasoning:**
# ```text
# System: You are a coding assistant. <|think_off|>
# User: What's 2+2?
# ```
#
# **Deep reasoning:**
# ```text
# System: You are a coding assistant. <|think_on|>
# User: Implement a red-black tree in Rust.
# ```
# *(The tag syntax uses Qwen's control token delimiters to guarantee it will never collide with legitimate text or file paths, unlike earlier community templates that used `/think`)*
#
# Token Saving (Stripping past thoughts):
#
# By default, this template **preserves** all past `<think>` blocks in the chat history. This prevents the model from suffering "amnesia stalls" during complex agentic loops, and it mathematically guarantees a 100% Prefix KV Cache hit rate on local inference engines.
#
# If you are running constrained hardware and need to save context tokens, you can explicitly disable this feature in your engine's template kwargs to automatically strip past thoughts:
# ```json
# {
#   "preserve_thinking": false
# }
# ```
# *(Note: Setting this to false will reduce your KV Cache hit rate during multi-turn chats because the prompt string will dynamically mutate).*

# ############################################################################## #
# GPU TOPOLOGY (3 GPUs, 48 GB VRAM total; 3rd GPU added 2026-07-21)               #
#   llama.cpp defaults to fastest-first CUDA order (CUDA0 = 5070 Ti); pin         #
#   bandwidth-sensitive (-sm tensor) entries by UUID. vLLM entries set PCI_BUS_ID.#
#                                                                                 #
#   PCI       Card                  Link                   UUID prefix / PCI idx  #
#   01:00.0   RTX 5060 Ti (ZOTAC)   Gen4 x4 (M.2 adapter)  af5bd53f  / idx 0      #
#   02:00.0   RTX 5070 Ti (Palit)   Gen5 x8 (CPU PEG)      d64df8cf  / idx 1      #
#   03:00.0   RTX 5060 Ti (MSI)     Gen5 x8 (CPU PEG)      57bbb375  / idx 2      #
#                                                                                 #
#   Keep TP all-reduce on the two x8/Gen5 cards (PCI idx 1,2 / UUIDs d64df8cf +   #
#   57bbb375). The ZOTAC on the x4 adapter is fine for layer-split, MoE RAM       #
#   offload, and embeddings, but a poor TP leg (slow all-reduce over x4).         #
# ############################################################################## #

preload:
    - gemma-4-E4B-MTP
    - gemma-4-31B-Q4-MTP
    - qwen3.6-35B-Q4

models:
    # ########### #
    # QWEN MODELS #
    # ########### #

    qwen3.6-35B-Q4:
        # MoE + MTP (2026-06-12): ~119 -> ~168 t/s decode (+41%) via the MTP-enabled GGUF
        # (Qwen3.6-35B-A3B-UD-Q4_K_M-MTP.gguf from unsloth/Qwen3.6-35B-A3B-MTP-GGUF) plus
        # --spec-type draft-mtp. Fastest model here, ~3x the vLLM 27B; n-max 2 per Unsloth
        # docs. (The non-MTP fallback GGUF was deleted 2026-07-21 to free disk; only the
        # -MTP GGUF this entry runs remains.)
        cmd: |
            docker run --rm --name q35b --runtime nvidia --cap-add SYS_ADMIN
            -p ${PORT}:8080 -v /mnt/shared/models:/models
            --entrypoint /app/llama-server ghcr.io/mostlygeek/llama-swap:cuda
            -m /models/Qwen3.6-35B-A3B-UD-Q4_K_M-MTP.gguf

            # fixed chat template
            --jinja --chat-template-file /models/froggeric_qwen_35_36_38_chat_template.jinja

            --spec-type draft-mtp
            --spec-draft-n-max 2
            --fit on
            --fit-ctx 128000
            --fit-target 256
            -np 1
            -fa on
            --no-mmap
            --mlock
            -b 2048
            -ub 2048
            -ctk q8_0
            -ctv q8_0
            --temp 0.6
            --top-p 0.95
            --top-k 20
            --min-p 0.0
            --presence-penalty 0.0
            --repeat-penalty 1.0
            --reasoning-format none
            --reasoning-budget -1
            --chat-template-kwargs "{\"preserve_thinking\": true}"
            --timeout 900
            --host 0.0.0.0
            --port 8080
        cmdStop: docker stop q35b
        # Qwen3.5-122B-A10B (added 2026-06-25): the BIG sibling of qwen3-coder-next -- SAME
        # hybrid arch (Gated DeltaNet + Gated Attention + MoE, 64 layers, MTP-trained), so
        # the same ggml-org b9570 image and the same tuning playbook apply. 122B total / 10B
        # active, 256 experts (8 routed + 1 shared). unsloth UD-IQ3_XXS (44.7 GB single file)
        # = the sweet-spot quant per unsloth's KLD benchmarks (Q2->Q3 is the big quality jump;
        # Q3->Q4 marginal). Fits CURRENT 32 GB RAM: ~26 GB GPU + ~19 GB RAM, ~13 GB headroom.
        #
        # TWO VALIDATED PROFILES (2026-06-25), both 6/6 needle recall, GPU mem rock-solid:
        #  * 128K ctx (ACTIVE below): --n-cpu-moe 28, --tensor-split 2.5,1, -ub 256, -c 131072
        #    -> 5060 86% / 5070 78%, 147 t/s prefill, 37 t/s gen.
        #  * 32K ctx (max speed): --n-cpu-moe 22, --tensor-split 2,1, -ub 512, -c 32768
        #    -> 5060 94% / 5070 92%, 277 t/s prefill, 41 t/s gen.
        # MTP WORKS on this GGUF (unlike Coder-Next, the nextn tensors were KEPT) -- --spec-type
        # draft-mtp below is what makes these speeds (plain 10B-active offload would be ~15-22).
        # Sampling below is a generic Qwen3 non-thinking default; adjust per the model card.
        #
        # THE CONSTRAINT HERE IS SYSTEM RAM, NOT VRAM. ~16-24 GB of the model lives in RAM, so:
        #  - PUSH the GPUs to ~90% like any other config (LOW --n-cpu-moe). That's safe AND it
        #    shrinks the RAM footprint -- both goals align. VRAM % was never the problem.
        #  - KEEP mmap (NO --no-mmap on 32 GB at 128K!). --no-mmap hard-allocated ~24 GB of
        #    experts -> 93% RAM -> swap-thrash -> system lag -> 5060 fell off the PCIe bus
        #    (driver watchdog). mmap keeps RAM-resident experts as EVICTABLE page cache (shows
        #    as buff/cache, not "used") so RAM can't thrash. Watch `free -h` SWAP, not VRAM %.
        #    --no-mmap MEASURED (2026-06-25, 32K profile): prefill 277 -> 600 t/s (+117%!),
        #    gen 41 -> 42 (mmap page-faults crush PREFILL on the offloaded experts; decode is
        #    cache-warm so ~unaffected). Stable at 80% RAM on the 32K profile (n22, ~15 GB in
        #    RAM). NOT safe at 128K (n28, ~19 GB -> ~90% RAM = crash zone) until 64 GB.
        #  - Knobs: --n-cpu-moe = RAM<->GPU/SPEED (lower = more on GPU = faster + less RAM,
        #    until a card OOMs); --tensor-split A,B = balance (A = CUDA0 = 5070 Ti; LOWER A ->
        #    shift load to 5060). Both profiles PREFILL-VALIDATED with a 31K NIAH prompt (see
        #    test-30K.md): GPU mem rock-solid, 6/6 recall at all depths incl. the middle.
        #  - GOING TO 128K: the killer isn't KV/weights, it's the PROMPT-PROCESSING COMPUTE
        #    BUFFER -- it grows with context and must fit on device 0 (5070), failing with
        #    "graph_reserve: failed to allocate compute pp buffers" even when weights/KV fit.
        #    Fix = LOWER -ub (512->256 ~halves it) + raise --n-cpu-moe for room. NOT a split
        #    problem -- no ratio fits if total VRAM is short. (-ub 256 also drops prefill
        #    277->147 t/s; a FULL 128K prefill is then ~15 min, fine for typical prompts.)
        # 64 GB RAM: the real win is --no-mmap AT 128K = ~2x prefill (a full 128K ingest drops
        # from ~15 min to ~4) on long-context work, the one thing 32 GB can't safely give.
        # NOT higher quants -- those TANK speed (Q4_K_S ~62% in RAM -> ~18-22 t/s vs IQ3's 37,
        # for a marginal KLD gain per unsloth's curve). IQ3_XXS is the sweet spot; keep it.
        qwen3.5-122B-IQ3-MTP:
            cmd: |
                docker run --rm --name q122b --runtime nvidia --cap-add SYS_ADMIN
                -p ${PORT}:8080 -v /mnt/shared/models:/models
                # known-good image build: b9692
                --entrypoint /app/llama-server ghcr.io/mostlygeek/llama-swap:cuda
                -m /models/Qwen3.5-122B-A10B-UD-IQ3_XXS.gguf

                # fixed chat template
                --jinja --chat-template-file /models/froggeric_qwen_35_36_38_chat_template.jinja

                -ngl 99
                --n-cpu-moe 28
                --threads 12
                -c 131072
                --tensor-split 2.5,1
                # MTP: TESTING -- Jim reports this is an MTP model. If load fails with "model
                # doesn't contain MTP layers" (like Coder-Next), comment these two out + drop
                # --n-cpu-moe back toward 30. If it loads, big win (10B active is slow, MTP helps).
                --spec-type draft-mtp
                --spec-draft-n-max 2
                -np 1
                -fa on
                -b 2048
                -ub 256
                -ctk q8_0
                -ctv q8_0
                --temp 0.7
                --top-p 0.8
                --top-k 20
                --min-p 0.0
                --presence-penalty 0.0
                --repeat-penalty 1.0
                --reasoning-format none
                --timeout 900
                --host 0.0.0.0
                --port 8080
            cmdStop: docker stop q122b

        # Qwen3.5-9B Q8_0 (added 2026-07-31): the small/FAST member of the qwen35 family. Same
        # hybrid arch as the 27B/122B (Gated DeltaNet + full attention every 4th layer), 32 dense
        # layers, 9.5 GB at Q8_0 (near-lossless). Tuned purely for SPEED:
        #  - SINGLE GPU, pinned by UUID to the ZOTAC 5060 Ti (af5bd53f). Weights + KV + compute
        #    buffer land around ~11 GB, so no split, no all-reduce, no cross-card traffic. It
        #    COEXISTS with the `dictation` group (qwen-clean-2b, ~1.7 GB) ON the ZOTAC: ~11 + ~1.7
        #    = ~12.7 GB of the card's 16 GB. Swaps with gemma-4-26B-MoE-MTP (also ZOTAC-pinned --
        #    the two can't be resident together, but dictation always is).
        #  - NO MTP. This GGUF ships no nextn tensors (427 tensors, blk.0-31 only), unlike the
        #    27B/35B -MTP builds -- `--spec-type draft-mtp` would abort at load. Don't add it.
        #  - Context 32K (native max is 262144). KV is cheap on this arch -- only 8 of the 32
        #    layers are full-attention (full_attention_interval=4) -- so 32K costs well under 1 GB
        #    even at f16. f16 KV (no -ctk/-ctv) is DELIBERATE: there's headroom, and it's both
        #    lossless and a touch faster than q8_0 KV. Raise -c if you need more; there's room.
        #  - --no-mmap: read the weights straight into VRAM, no page-fault stalls on prefill.
        #    Deliberately NO --mlock (unlike the MoE entries): with -ngl 99 nothing of substance
        #    stays in RAM to pin, and this host's RLIMIT_MEMLOCK is too low anyway -- it just
        #    logs "failed to mlock 2172362752-byte buffer / Cannot allocate memory" and moves on.
        #  - -b/-ub 2048 for fast prefill; the compute buffer stays small at 32K.
        qwen3.5-9B-Q8:
            unlisted: true
            cmd: |
                docker run --rm --name q9b --runtime nvidia --cap-add SYS_ADMIN
                -e CUDA_VISIBLE_DEVICES=GPU-af5bd53f-a1ca-d807-1ae2-7f5ef261fe1a
                -p ${PORT}:8080 -v /mnt/shared/models:/models
                # known-good image build: b9692
                --entrypoint /app/llama-server ghcr.io/mostlygeek/llama-swap:cuda
                -m /models/Qwen3.5-9B-Q8_0.gguf

                # fixed chat template
                --jinja --chat-template-file /models/froggeric_qwen_35_36_38_chat_template.jinja

                -ngl 99
                -c 32768
                -fa on
                -np 1
                --no-mmap
                -b 2048
                -ub 2048
                --temp 0.6
                --top-p 0.95
                --top-k 20
                --min-p 0.0
                --presence-penalty 0.0
                --repeat-penalty 1.0
                --reasoning-format deepseek
                --reasoning-budget -1
                --chat-template-kwargs "{\"preserve_thinking\": true}"
                --timeout 900
                --host 0.0.0.0
                --port 8080
            cmdStop: docker stop q9b

        # Q4 member of the qwen35 family. Switched 2026-08-22 from Qwen3.5-9B-Q4_1.gguf
        # to unsloth's UD-Q4_K_XL requant (~5.6 GB) -- finer per-block scaling, roughly
        # same size. ngram-mod speculation below (NO MTP: this GGUF, like the Q4_1/Q8_0
        # builds and every file in unsloth/Qwen3.5-9B-GGUF, ships no nextn tensors --
        # verified 2026-08-22: 427 tensors, blk.0-31 only. --spec-type draft-mtp would
        # abort at load; see the Q8 entry note). ZOTAC-pinned like the Q8 entry;
        # weights ~5.6 GB + KV + dictation ~1.7 GB still fits 16 GB.
        Qwen3.5-9B-Q4:
            cmd: |
                docker run --rm --name q9bq4 --runtime nvidia --cap-add SYS_ADMIN
                -e CUDA_VISIBLE_DEVICES=GPU-af5bd53f-a1ca-d807-1ae2-7f5ef261fe1a
                -p ${PORT}:8080 -v /mnt/shared/models:/models
                # known-good image build: b9692
                --entrypoint /app/llama-server ghcr.io/mostlygeek/llama-swap:cuda
                -m /models/Qwen3.5-9B-UD-Q4_K_XL.gguf

                # fixed chat template
                --jinja --chat-template-file /models/froggeric_qwen_35_36_38_chat_template.jinja

                -ngl 99
                -c 250000
                -fa on
                -np 2
                --no-mmap
                -b 2048
                -ub 2048

                # draft speculation - ngram only (NO MTP: no nextn tensors in this
                # GGUF -- would abort at load). ngram-mod window retuned 2026-08-22
                # from the 27B sibling's 24/24/86 after a live probe measured 13.7%
                # draft acceptance (32/234) -- long ngrams barely match this model's
                # output. Re-check the "draft acceptance" line in the logs; if it's
                # still <~30%, drop speculation entirely.

                --spec-type ngram-mod
                --spec-ngram-mod-n-match 24
                --spec-ngram-mod-n-min 12
                --spec-ngram-mod-n-max 32

                --temp 1.0
                --top-p 0.95
                --top-k 20
                --min-p 0.0
                --presence-penalty 1.5
                --repeat-penalty 1.0
                --reasoning off
                --reasoning-format deepseek
                --chat-template-kwargs "{\"preserve_thinking\": false}"
                --timeout 900
                --host 0.0.0.0
                --port 8080
            cmdStop: docker stop q9bq4

        # CURATOR LoRA ENTRIES (added 2026-08-21): The Librarian's curator, task-specific
        # rank/alpha-8 adapters on Qwen3.5-9B (Unsloth Studio SFT, completion-only, non-
        # thinking data). The 100-case grooming adapter beat its 250/500-case siblings in
        # blind review; harvesting's 100-case adapter lifted F1 78.2 -> 80.8. See
        # "How to get big results from a tiny model" (Writing/Published/AI/...).
        #
        # llama.cpp loads the adapter with --lora-scaled <gguf>:1.0 on top of the SAME
        # base as the Qwen3.5-9B-Q4 entry above (Qwen3.5-9B-UD-Q4_K_XL.gguf, switched
        # from Q4_1 on 2026-08-22). (This build has no -l short flag / space
        # scale -- plain `--lora FNAME` also works.) The r8 adapters are ~29 MB, so VRAM/
        # coexistence math follows the plain 9B entry (ZOTAC, ~7 GB +
        # dictation's ~1.7 GB fits the 16 GB card).
        # The three entries (plain + these two) swap with each other on request; only
        # one 9B can be resident at a time (same ZOTAC card).
        #
        # Thinking is pinned OFF ("enable_thinking": false) to match the training data --
        # same trick as qwen-clean-2b. pi's qwen3.5 wiring (sync-models.py) can still
        # flip it per request if you want to experiment.
        curator-grooming:
            unlisted: true
            cmd: |
                docker run --rm --name q9b-cgroom --runtime nvidia --cap-add SYS_ADMIN
                -e CUDA_VISIBLE_DEVICES=GPU-af5bd53f-a1ca-d807-1ae2-7f5ef261fe1a
                -p ${PORT}:8080 -v /mnt/shared/models:/models
                # known-good image build: b9692
                --entrypoint /app/llama-server ghcr.io/mostlygeek/llama-swap:cuda
                -m /models/Qwen3.5-9B-UD-Q4_K_XL.gguf
                # this build takes --lora FNAME / --lora-scaled FNAME:SCALE (no -l, no space scale)
                --lora-scaled /models/curator-qwen35-9b-grooming-100-r8-lora-f16.gguf:1.0

                # fixed chat template
                --jinja --chat-template-file /models/froggeric_qwen_35_36_38_chat_template.jinja

                -ngl 99
                -c 132768
                -fa on
                -np 1
                --no-mmap
                -b 2048
                -ub 2048

                # draft speculation - ngram only (NO MTP: no nextn tensors in this
                # GGUF -- would abort at load). ngram-mod window retuned 2026-08-22
                # (24/24/86 measured 13.7% draft acceptance on the plain Q4 entry).

                --spec-type ngram-mod
                --spec-ngram-mod-n-match 24
                --spec-ngram-mod-n-min 12
                --spec-ngram-mod-n-max 32

                --temp 0.6
                --top-p 0.95
                --top-k 20
                --min-p 0.0
                --presence-penalty 0.0
                --repeat-penalty 1.0
                --reasoning-format none
                --chat-template-kwargs "{\"enable_thinking\": false}"
                --timeout 900
                --host 0.0.0.0
                --port 8080
            cmdStop: docker stop q9b-cgroom

        curator-harvesting:
            unlisted: true
            cmd: |
                docker run --rm --name q9b-charvest --runtime nvidia --cap-add SYS_ADMIN
                -e CUDA_VISIBLE_DEVICES=GPU-af5bd53f-a1ca-d807-1ae2-7f5ef261fe1a
                -p ${PORT}:8080 -v /mnt/shared/models:/models
                # known-good image build: b9692
                --entrypoint /app/llama-server ghcr.io/mostlygeek/llama-swap:cuda
                -m /models/Qwen3.5-9B-UD-Q4_K_XL.gguf
                # this build takes --lora FNAME / --lora-scaled FNAME:SCALE (no -l, no space scale)
                --lora-scaled /models/curator-qwen35-9b-harvesting-100-r8-lora-f16.gguf:1.0

                # fixed chat template
                --jinja --chat-template-file /models/froggeric_qwen_35_36_38_chat_template.jinja

                -ngl 99
                -c 132768
                -fa on
                -np 1
                --no-mmap
                -b 2048
                -ub 2048

                # draft speculation - ngram only (NO MTP: no nextn tensors in this
                # GGUF -- would abort at load). ngram-mod window retuned 2026-08-22
                # (24/24/86 measured 13.7% draft acceptance on the plain Q4 entry).

                --spec-type ngram-mod
                --spec-ngram-mod-n-match 24
                --spec-ngram-mod-n-min 12
                --spec-ngram-mod-n-max 32

                --temp 0.6
                --top-p 0.95
                --top-k 20
                --min-p 0.0
                --presence-penalty 0.0
                --repeat-penalty 1.0
                --reasoning-format none
                --chat-template-kwargs "{\"enable_thinking\": false}"
                --timeout 900
                --host 0.0.0.0
                --port 8080
            cmdStop: docker stop q9b-charvest

        # Qwen3.8-27B Q6_K (added 2026-08-14): dense 27B, UD Q6_K quant (23.09 GB; dynamic
        # layout mixes Q8_0/Q5_K/Q4_K blocks + a few IQ1_S). Hybrid arch (Gated DeltaNet +
        # full attention every 4th layer) so KV cache is cheap.
        #
        # TENSOR-SPLIT (switched 2026-08-19): now -sm tensor, mirroring the validated
        # Qwen3.8-27B-UD-IQ4_XS-MTP-TP entry. The old "plain Q6_K can't -sm tensor
        # (GGML_ASSERT SPLIT_AXIS_UNKNOWN)" caveat was a BUILD artifact of the b9692-era
        # image, not a property of this file -- the current mostlygeek image (>= b10362,
        # same as the IQ4_XS TP entry) tensor-splits these quants fine. Same 2-card UUID
        # pinning (MSI 5060 Ti = device0, 5070 Ti = device1), NCCL 2.30.4 LD_PRELOAD,
        # --fit off (fit is unimplemented for tensor mode), -ts 1.00,1.00 (the
        # sharp-threshold balance point from the IQ4_XS probe).
        #
        # MEMORY WARNING (NOT YET PROBED): weights are 23.09 GB vs the validated IQ4_XS's
        # 16.86 GB, ~4.9 GB/card more at 1.00,1.00 -- the 262144 ctx that loaded for IQ4_XS
        # (MSI 1545 / 5070 464 MiB free) will almost certainly NOT fit here. Probe like the
        # IQ4_XS context probe: step -c down (196608 -> 131072 -> 98304) and/or -ub 512 ->
        # 256 until graph_reserve stops OOMing on device0. The 5070 (device1) carries ~600
        # MiB of desktop and will be the wall. Realistic ceiling looks like ~64-128K.
        #
        # KV: q8_0 kept (validated with -sm tensor at b10362). If a future image rejects
        # quantized KV + tensor mode (current master does), switch -ctk/-ctv to f16.
        #
        # MTP: VERIFIED 2026-08-16 (GGUF header parse) -- this file DOES ship the 4
        # nextn tensors (blk.64.nextn.{eh_proj,enorm,hnorm,shared_head_norm}). The
        # --spec-type draft-mtp flags below work on this file.
        #
        # Chat template: uses the shared Qwen 3.5/3.6 fixed template (Qwen3.8 inherits
        # the same template structure). If reasoning tags don't parse correctly, check
        # froggeric/Qwen-Fixed-Chat-Templates for a Qwen3.8 update.
        Qwen3.8-27B-UD-Q6_K_M:
            cmd: |
                docker run --rm --name q38-27b --runtime nvidia --cap-add SYS_ADMIN
                --ipc=host
                # Same 2-card UUID pinning as the IQ4_XS TP entry (MSI 5060 Ti first =
                # device0), board/enumeration-independent.
                -e CUDA_VISIBLE_DEVICES=GPU-57bbb375-a61a-6662-e9c8-447b948f0833,GPU-d64df8cf-c877-b43d-d9a5-d6b0e38e504a
                -e NCCL_P2P_DISABLE=1 -e NCCL_CUMEM_ENABLE=0
