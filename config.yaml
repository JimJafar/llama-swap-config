      -m /models/Qwen3.8-27B-UD-IQ4_XS.gguf
      --mmproj /models/qwen3.8-mmproj-BF16.gguf

      # fixed chat template
      --jinja --chat-template-file /models/qwen_sharp_template_oneline.jinja
      --chat-template-kwargs "{\"reasoning_effort\":\"medium\"}"

      -ngl 99
      --flash-attn on
      -sm tensor
      --fit off

      # draft speculation - MTP + ngram
      --spec-type draft-mtp,ngram-mod
      -md /models/qwen3.8-mtp-Q4_0.gguf
      --spec-draft-n-max 3
      --spec-ngram-mod-n-match 24
      --spec-ngram-mod-n-min 48
      --spec-ngram-mod-n-max 64

      -b 2048
      # 2-slot unified shared KV pool: two slots share one pool on the fast TP pair;
      # idle slots cost ~0. -c is the TOTAL pool (KV allocated up front, split across
      # the two TP ranks). Now at an EVEN split both ranks hold ~equal weights AND ~equal
      # KV. NOTE: the Meta() split ratio is a SHARP threshold -- the 5070 Ti has only
      # 16 GiB vs the 3090's 24 GiB, so if CUDA1 (5070 Ti) OOMs at load at this split,
      # pull the ratio back toward the 3090 (e.g. 1.00,0.70); if the 3090 (CUDA0) shows
      # large idle headroom after load, it can take even more weights/KV.
      -c 393216
      -ctk q8_0
      -ctv q8_0
      # 2026-09-16: -c raised 262144 -> 393216 (384K shared pool) with the split pulled to
      # 1.00,0.70 so the 3090's spare VRAM can hold KV. MEASURED ceiling on this pair:
      # 393216 LOADS; 458752 OOMs in graph_reserve ("failed allocating 896.00 MiB on
      # device 1" = the 5070 Ti); 524288 OOMs on device 0 (2640.28 MiB) = the 3090.
      # NOTE the OOM is the COMPUTE buffer in ggml_backend_sched_reserve, not the KV cache,
      # and it moves between cards with size -- so both are near their limit and this is
      # NOT the fill point. Validate any raise with a real long prefill, per the llama-cpp
      # skill ("the idle VRAM-fill point is not a safe -c").
      # --- CONCURRENCY EXPERIMENT (2026-09-16): -np 1 -> -np 4 ---
      # -c stays the TOTAL shared pool, so the VRAM budget is UNCHANGED from the -np 1
      # profile (KV is still 262144 tokens x 34 KiB/token ~= 8.5 GiB; 16 of the 64
      # layers carry KV because the other 48 are Gated DeltaNet with fixed state).
      # --kv-unified MUST be explicit: its documented default is "enabled if number of
      # slots is auto", and -np 4 is explicit, so without this flag -c would be SPLIT
      # four ways (4 x 65536) instead of being one shared pool.
      # --kv-unified-per-slot 131072 caps each sequence so two long requests can coexist
      # (2 x 131072 = the whole pool) while 4 short ones still fit.
      -np 4
      --kv-unified
      --kv-unified-per-slot 262144
      # --- PREFIX REUSE (2026-09-16) ---
      # The subagent pattern is N agents sharing one long system prompt, so the shared
      # prefix should be prefilled ONCE. Neither flag does this by default:
      #   --cache-reuse defaults to 0 = OFF (it is what lets a new request reuse a
      #     prefix from the slot cache via KV shifting);
      #   -sps defaults to 0.10, which only decides which SLOT a request is routed to.
      # Raised -sps so a similar prompt is routed to the slot already holding its prefix.
      --cache-reuse 256
      -sps 0.5
      --main-gpu 0
      # Even split (2026-09-08): balanced so neither card is the serial bottleneck -- at
      # 1.00,0.50 the 3090 did ~2/3 of the transformer work and capped decode throughput
      # (moving to the 5070 Ti at the old ratio gave no speedup). Both ranks now do ~equal
      # work. WATCH: the 5070 Ti is only 16 GiB vs the 3090's 24 GiB, so an even split puts
      # ~half the weights AND ~half the unified KV pool on the 5070; if it OOMs at load at
      # -c 262144, pull the ratio back toward the 3090 (e.g. 1.00,0.70) to trade load for fit.
      --tensor-split 1.00,0.70
      # -np 2
      -ub 512
      --temp 1.0
      --top-p 0.95
      --top-k 20
      --min-p 0.0
      --presence-penalty 0.0
      --repeat-penalty 1.0

      --reasoning-format deepseek
      --reasoning-budget -1
      --reasoning on
      --reasoning-preserve

      --timeout 900
      --host 0.0.0.0
      --port 8080
