# llama-swap runs as a host binary (llama-swap-bin AUR) and launches each model
# as a docker container. llama.cpp models use the bundled mostlygeek image with
# the entrypoint overridden to /app/llama-server; the vLLM model uses the vllm
# image. ${PORT} is assigned by llama-swap and published from the container; the
# server inside always listens on its own fixed port. cmdStop stops the named
# container cleanly on swap so VRAM is freed.
#
# Shared docker flags for llama.cpp models:
#   --runtime nvidia --cap-add SYS_ADMIN  (matches the previously-working setup)
#   --entrypoint /app/llama-server        (image entrypoint is llama-swap)
#
# Max seconds to wait for a model to become ready after launch. Raised from the 120s
# default for the vLLM entries (e.g. qwen36-27b-nvfp4), which take ~180s to load + capture graphs.
healthCheckTimeout: 300

# Qwen 3.5/3.6 jinja template fix
#
# The fixed template comes from here: https://huggingface.co/froggeric/Qwen-Fixed-Chat-Templates/blob/main/README.md
#
# All Qwen 3.5 and 3.6 variants should have `--jinja --chat-template-file /models/qwen_35_36_chat_template.jinja`
# (llama.cpp). The .jinja file must live in the MOUNTED models dir (/mnt/shared/models on the host,
# which is bind-mounted to /models in every container) -- a host-side repo path is invisible inside
# the container. For the vLLM entry the flag is `--chat-template <path>` instead (no --jinja).
#
# The Thinking Toggle
#
# You can control the model reasoning behavior. Insert `<|think_on|>` or `<|think_off|>` anywhere in your system or user prompt. The template intercepts the tag, removes it from the final context so the model never sees it, and flips the reasoning mode instantly.
#
# **Fast answer, no reasoning:**
# ```text
# System: You are a coding assistant. <|think_off|>
# User: What's 2+2?
# ```
#
# **Deep reasoning:**
# ```text
# System: You are a coding assistant. <|think_on|>
# User: Implement a red-black tree in Rust.
# ```
# *(The tag syntax uses Qwen's control token delimiters to guarantee it will never collide with legitimate text or file paths, unlike earlier community templates that used `/think`)*
#
# Token Saving (Stripping past thoughts):
#
# By default, this template **preserves** all past `<think>` blocks in the chat history. This prevents the model from suffering "amnesia stalls" during complex agentic loops, and it mathematically guarantees a 100% Prefix KV Cache hit rate on local inference engines.
#
# If you are running constrained hardware and need to save context tokens, you can explicitly disable this feature in your engine's template kwargs to automatically strip past thoughts:
# ```json
# {
#   "preserve_thinking": false
# }
# ```
# *(Note: Setting this to false will reduce your KV Cache hit rate during multi-turn chats because the prompt string will dynamically mutate).*

# ############################################################################## #
# GPU TOPOLOGY (3 GPUs, 48 GB VRAM total; 3rd GPU added 2026-07-21)               #
#   llama.cpp defaults to fastest-first CUDA order (CUDA0 = 5070 Ti); pin         #
#   bandwidth-sensitive (-sm tensor) entries by UUID. vLLM entries set PCI_BUS_ID.#
#                                                                                 #
#   PCI       Card                  Link                   UUID prefix / PCI idx  #
#   01:00.0   RTX 5060 Ti (ZOTAC)   Gen4 x4 (M.2 adapter)  af5bd53f  / idx 0      #
#   02:00.0   RTX 5070 Ti (Palit)   Gen5 x8 (CPU PEG)      d64df8cf  / idx 1      #
#   03:00.0   RTX 5060 Ti (MSI)     Gen5 x8 (CPU PEG)      57bbb375  / idx 2      #
#                                                                                 #
#   Keep TP all-reduce on the two x8/Gen5 cards (PCI idx 1,2 / UUIDs d64df8cf +   #
#   57bbb375). The ZOTAC on the x4 adapter is fine for layer-split, MoE RAM       #
#   offload, and embeddings, but a poor TP leg (slow all-reduce over x4).         #
# ############################################################################## #

models:
  # ########### #
  # QWEN MODELS #
  # ########### #

  qwen3.6-35B-Q4:
    # MoE + MTP (2026-06-12): ~119 -> ~168 t/s decode (+41%) via the MTP-enabled GGUF
    # (Qwen3.6-35B-A3B-UD-Q4_K_M-MTP.gguf from unsloth/Qwen3.6-35B-A3B-MTP-GGUF) plus
    # --spec-type draft-mtp. Fastest model here, ~3x the vLLM 27B; n-max 2 per Unsloth
    # docs. (The non-MTP fallback GGUF was deleted 2026-07-21 to free disk; only the
    # -MTP GGUF this entry runs remains.)
    cmd: |
      docker run --rm --name q35b --runtime nvidia --cap-add SYS_ADMIN
      -p ${PORT}:8080 -v /mnt/shared/models:/models
      --entrypoint /app/llama-server ghcr.io/mostlygeek/llama-swap:cuda
      -m /models/Qwen3.6-35B-A3B-UD-Q4_K_M-MTP.gguf

      # fixed chat template
      --jinja --chat-template-file /models/qwen_35_36_chat_template.jinja

      --spec-type draft-mtp
      --spec-draft-n-max 2
      --fit on
      --fit-ctx 128000
      --fit-target 256
      -np 1
      -fa on
      --no-mmap
      --mlock
      -b 2048
      -ub 2048
      -ctk q8_0
      -ctv q8_0
      --temp 0.6
      --top-p 0.95
      --top-k 20
      --min-p 0.0
      --presence-penalty 0.0
      --repeat-penalty 1.0
      --reasoning-format none
      --reasoning-budget -1
      --chat-template-kwargs "{\"preserve_thinking\": true}"
      --timeout 900
      --host 0.0.0.0
      --port 8080
    cmdStop: docker stop q35b
  Qwen3.6-27B-Q5-MTP:
    cmd: |
      docker run --rm --name q27mtp --runtime nvidia --cap-add SYS_ADMIN
      -p ${PORT}:8080 -v /mnt/shared/models:/models
      --entrypoint /app/llama-server ghcr.io/mostlygeek/llama-swap:cuda
      -m /models/Qwen3.6-27B-UD-Q5_K_XL.gguf

      # fixed chat template
      --jinja --chat-template-file /models/qwen_35_36_chat_template.jinja

      -ngl 99
      --flash-attn on

      # ngram-mod removed 2026-06-12: silently off at -np 1, and benchmarked as a
      # no-op vs draft-mtp alone on fresh generation (only helps repetitive/echoing
      # tasks, which would need -np 2 and halve context). draft-mtp gives +50%.
      --spec-type draft-mtp
      --spec-draft-n-max 3

      # --spec-draft-p-min 0.75
      # --cache-type-k-draft q5_0
      # --cache-type-v-draft q5_0

      # --kv-unified
      -b 2048
      -c 142000
      -ctk q8_0
      -ctv q8_0
      --main-gpu 0
      --tensor-split 1,1
      -np 1
      -ub 512
      --temp 0.6
      --top-p 0.95
      --top-k 20
      --min-p 0.05
      --presence-penalty 0.0
      --repeat-penalty 1.0
      --reasoning-format none
      --reasoning-budget -1
      --chat-template-kwargs "{\"preserve_thinking\": true}"
      --timeout 900
      --host 0.0.0.0
      --port 8080
    cmdStop: docker stop q27mtp
  # --- TENSOR-PARALLEL variant of Qwen3.6-27B-Q5-MTP (added 2026-06-08) ---
  # A/B against Qwen3.6-27B-Q5-MTP. Real tensor parallelism via `-sm tensor` (the
  # non-deprecated TP mode; `-sm row` is deprecated). Measured FASTER than the
  # layer-split prod entry: ~39.5 vs ~35 tok/s decode (Q5_K_XL, +MTP, 2x16GB).
  # RE-MEASURED 2026-07-03 on the Z890 (both GPUs CPU-attached Gen5 x8/x8, riser
  # gone): prefill 147 -> 1200+ t/s (~8x, was interconnect-bound), decode 39.5 ->
  # 47-59 t/s. Old prefill-bound tuning notes below (the -c OOM-under-prefill
  # ceiling especially) are stale and worth re-probing on this board.
  #
  # Why the extra docker flags (full story in README "Tensor parallelism"):
  #  - The image's bundled NCCL 2.25.1 has a broken sm_120 (RTX 50-series) kernel
  #    launch, so `-sm tensor` aborts at the first all-reduce with
  #    "Cuda failure 1 'invalid argument'". Preloading NCCL 2.30.4 fixes it.
  #    This was the real blocker -- NOT the no-P2P topology and NOT the driver.
  #  - --ipc=host lifts Docker's 64 MB /dev/shm cap so NCCL's SHM transport works
  #    (the two GPUs have no P2P; NCCL connects via SHM/direct).
  #  - --fit off: llama_params_fit is not implemented for SPLIT_MODE_TENSOR.
  # Fit note (post-riser): device1 = 5070 Ti holds the desktop + draft ctx and fills
  # first; raise the 1st tensor-split number to relieve it (NOT 1,1.2). Keep -c well
  # below the VRAM-fill point -- ~185k loads but OOMs under prefill. See inline below.
  # Vendored lib (vendor/libnccl.so.2.30.4) is git-ignored; refetch with:
  #   pip download --no-deps nvidia-nccl-cu12  (then unzip the wheel)
  Qwen3.6-27B-Q5-MTP-TP:
    cmd: |
      docker run --rm --name q27mtptp --runtime nvidia --cap-add SYS_ADMIN
      --ipc=host
      # Was CUDA_DEVICE_ORDER=PCI_BUS_ID, but PCI enumeration shifts across board/GPU
      # changes: with the 3rd GPU added 2026-07-21, 01:00 = ZOTAC 5060 Ti (x4 M.2
      # adapter), 02:00 = 5070 Ti, 03:00 = MSI 5060 Ti. Integer-index pinning piled the
      # bigger split + --main-gpu 0 + desktop onto the wrong card -> OOM. Pin by UUID
      # instead (MSI 5060 Ti first = device0), board/enumeration-independent:
      -e CUDA_VISIBLE_DEVICES=GPU-57bbb375-a61a-6662-e9c8-447b948f0833,GPU-d64df8cf-c877-b43d-d9a5-d6b0e38e504a
      -e NCCL_P2P_DISABLE=1 -e NCCL_CUMEM_ENABLE=0
      -e LD_PRELOAD=/opt/newnccl/libnccl.so.2
      -v /home/jim/llama-swap/vendor/libnccl.so.2.30.4:/opt/newnccl/libnccl.so.2:ro
      -p ${PORT}:8080 -v /mnt/shared/models:/models
      --entrypoint /app/llama-server ghcr.io/mostlygeek/llama-swap:cuda
      -m /models/Qwen3.6-27B-UD-Q5_K_XL.gguf

      # fixed chat template
      --jinja --chat-template-file /models/qwen_35_36_chat_template.jinja

      -ngl 99
      --flash-attn on
      -sm tensor
      --fit off
      # ngram-mod removed 2026-06-12: silently off at -np 1, and benchmarked as a
      # no-op vs draft-mtp alone on fresh generation (only helps repetitive/echoing
      # tasks, which would need -np 2 and halve context). draft-mtp gives +50%.
      --spec-type draft-mtp
      --spec-draft-n-max 3
      -b 2048
      # -c: filling VRAM toward ~90% (~175k -> 89/96) OOMs under a real prefill load;
      # backed off to a conservative 80000 for headroom (2026-06-11).
      -c 175000
      -ctk q8_0
      -ctv q8_0
      --main-gpu 0
      # device0,device1 = 5060 Ti, 5070 Ti (pinned by UUID above; PCI addrs changed on Z890).
      # The split only BALANCES the pair: 5070 = device1 is overhead-bound (desktop +
      # draft ctx) so it barely moves; the 5060 is hypersensitive, so step it gently.
      # -c is what adds total VRAM: KV lands on both cards by this ratio, filling the
      # 5070 headroom the split can't reach. NOTE: filling to ~90% (~185k -> 89/96) is
      # NOT stable -- it OOMs on a long-context prefill, hence the conservative -c above.
      # Tune: 5070 hotter or draft OOMs -> raise 1st num; 5060 hotter -> lower it.
      --tensor-split 1.01,1
      -np 1
      -ub 512
      --temp 0.6
      --top-p 0.95
      --top-k 20
      --min-p 0.05
      --presence-penalty 0.0
      --repeat-penalty 1.0
      --reasoning-format none
      --reasoning-budget -1
      --chat-template-kwargs "{\"preserve_thinking\": true}"
      --timeout 900
      --host 0.0.0.0
      --port 8080
    cmdStop: docker stop q27mtptp

  # Qwen3.6-27B Q8 @ full 262K (added 2026-07-21): the "spend the 3rd GPU's 16 GB on
  # QUALITY" build. This hybrid arch (Gated-DeltaNet: most layers store NO KV, only the
  # few full-attention layers do) makes long context CHEAP, so 48 GB VRAM removes the
  # context ceiling entirely -- every quant reaches the 262K native max. So the VRAM goes
  # to the QUANT: Q8_0 (near-lossless, 29 GB) vs the Q5_K_XL prod entry, + Q8 KV + MTP,
  # at the full native window. (Was ABANDONED on 32 GB -- see the note below.)
  #  - LAYER-SPLIT across all 3 cards, NOT -sm tensor: (1) -sm tensor needs UD quants on
  #    this arch (plain Q6_K/Q8_0 crash SPLIT_AXIS_UNKNOWN, see below); (2) TP all-reduce
  #    would bottleneck on the ZOTAC's x4 link. Layer-split uses all 3 for CAPACITY with
  #    tiny inter-GPU traffic, works with any quant, and MTP works. Trade: slower decode
  #    than the -MTP-TP entry -- that stays the SPEED pick; this is QUALITY/CONTEXT.
  #  - GGUF: unsloth's Qwen3.6-27B-*MTP*-GGUF repo (the plain -GGUF is nextn-stripped = no
  #    MTP). Q8_0 = 29 GB. Swaps (just change -m): UD-Q6_K_XL (26 GB, ~= quality, more
  #    headroom) or UD-Q8_K_XL (35.8 GB, max quant but caps ctx ~128-175K -- not worth it).
  #  - Context: -c 262144 (native max). The limit at load is the prompt COMPUTE BUFFER
  #    (grows with ctx, must fit CUDA0 = 5070 Ti) -- keep -ub 256; if it still OOMs, drop
  #    -c first, then LOWER the 1st --tensor-split number to move layers off the 5070.
  Qwen3.6-27B-Q8-MTP:
    cmd: |
      docker run --rm --name q27q8 --runtime nvidia --cap-add SYS_ADMIN
      -p ${PORT}:8080 -v /mnt/shared/models:/models
      --entrypoint /app/llama-server ghcr.io/mostlygeek/llama-swap:cuda
      -m /models/Qwen3.6-27B-Q8_0.gguf

      # fixed chat template
      --jinja --chat-template-file /models/qwen_35_36_chat_template.jinja

      # --fit auto-distributes the weights + KV across all 3 GPUs (no manual -ngl/--tensor-
      # split; mainline llama.cpp supports --fit, mostlygeek build 9935). VALIDATED 2026-07-22
      # at the FULL native window: -c 262144 fits at ~13-14 GB/card (~2 GB headroom each), MTP
      # accept 0.75. MTP is self-speculative (nextn baked in), so unlike Laguna's DFlash it
      # needs NO --fit-target margin. (--fit-ctx is only a FLOOR for --fit when -c is unset;
      # here we pin the full 256K explicitly.)
      --fit on
      -c 262144
      --flash-attn on
      --spec-type draft-mtp
      --spec-draft-n-max 3
      -ctk q8_0
      -ctv q8_0
      -np 1
      --temp 0.6
      --top-p 0.95
      --top-k 20
      --min-p 0.05
      --presence-penalty 0.0
      --repeat-penalty 1.0
      --reasoning-format none
      --reasoning-budget -1
      --chat-template-kwargs "{\"preserve_thinking\": true}"
      --timeout 900
      --host 0.0.0.0
      --port 8080
    cmdStop: docker stop q27q8
  # --- Qwen3.6-27B Q6 @ 128K: ABANDONED 2026-06-26 (do not retry on 32 GB VRAM) ---
  # UPDATE 2026-07-21: no longer VRAM-bound on the 3-GPU (48 GB) box -- superseded by the
  #   Qwen3.6-27B-Q8-MTP entry ABOVE (Q8_0 @ full 262K). The 32 GB findings below stand.
  # Goal was "highest quant @ 128K @ >=30 t/s". Q6 is a dead end on 2x16 GB; the win
  # over Q5_K_XL is sub-0.1% KLD (flat tail) and not worth the VRAM fight. Evidence:
  #  - MTP lives in unsloth/Qwen3.6-27B-MTP-GGUF (NOT the plain ...-GGUF repo, which
  #    ships nextn-stripped, block_count=64). Match the -MTP-GGUF naming like the 35B.
  #  - Plain Q6_K (22.9 GB, MTP) + `-sm tensor` -> GGML_ASSERT SPLIT_AXIS_UNKNOWN crash.
  #    Tensor-split only works on UD quants (they keep key tensors at higher precision);
  #    plain quants can't be tensor-split for this hybrid (qwen35) arch.
  #  - Plain Q6_K + LAYER-split @128K: loads (split 1.3,1, -ub 256) but VRAM is at the
  #    ceiling (dev0 ~670 MiB free). Decode looked OK (~31 t/s on an empty prompt) but
  #    PREFILL THRASHES as KV grows: 63 -> 32 -> 21 t/s over the first 6 K tokens
  #    (super-linear), so a 31 K prompt ~25 min. Unusable for long context.
  #  - UD-Q6_K_XL (26 GB) tensor-splits fine but overflows the 128K fit (~0.6 GB over).
  # Net: Q5_K_XL (UD, tensor-split, 147 t/s prefill / 39.5 t/s decode, headroom, MTP)
  # is the ceiling on 32 GB. Only MORE VRAM unlocks Q6@128K; the 64 GB RAM does NOT
  # (dense weights are VRAM-bound, not RAM-offloadable). Q6's only viable niche here
  # would be REDUCED context (~48-64 K) via UD-Q6_K_XL tensor-split -- not pursued.
  # --- vLLM on this host: general notes (apply to every vLLM entry below) ---
  # Uses the vllm/vllm-openai image (NOT the mostlygeek llama.cpp image). Slow start
  # (~130-180s) -> relies on healthCheckTimeout (top of file). gpu-memory-utilization is
  # tuned (0.85-0.92) to clear the 5070's desktop use on vLLM's startup memory pre-check.
  # DEVICE ENV: MUST use integer indices, NOT UUIDs -- vLLM v0.22.0's model-inspection
  # subprocess crashes (exit 1, "architecture failed to be inspected") on UUID-format
  # CUDA_VISIBLE_DEVICES. That's fine here: vLLM TP=2 is SYMMETRIC (each card holds half
  # of every layer), so unlike the llama.cpp -sm tensor entry it carries no tuned split
  # that depends on WHICH card is device0. 3-GPU re-pin (2026-07-21): CUDA_VISIBLE_DEVICES
  # =1,2 selects the two x8/Gen5 cards (5070 Ti + MSI 5060 Ti); local device0 = 5070 Ti.
  # BATCHED SERVING: for a throughput profile, clone a vLLM entry with --max-num-seqs 32
  # and drop --speculative-config (MTP + heavy batching don't combine); vLLM beats the
  # llama.cpp -sm tensor TP entry decisively only under concurrency (~355-462 tok/s peak
  # at 32 concurrent, vs ~55-60 tok/s single-stream with MTP).
  # --- Unsloth NVFP4 dense 27B (Qwen3.6). Replaced the earlier Text-NVFP4-MTP vLLM
  #     entry, which was slower and less accurate (removed 2026-07-12). ---
  # Source: unsloth/Qwen3.6-27B-NVFP4 (https://unsloth.ai/docs/models/qwen3.6).
  #   - This is the FULL vision-language model (arch Qwen3_5ForConditionalGeneration,
  #     model_type qwen3_5); ships video/image preprocessors. We run it TEXT-ONLY via
  #     --language-model-only. NB the vision tower is only ~0.9 GB, so this is about
  #     keeping the MTP/text path simple, NOT saving VRAM. Drop the flag to enable vision.
  #   - VRAM REALITY: language weights measure 22.5 GB (>Q5_K_XL's 20.35 GB) = ~70% of
  #     the 32 GB aggregate / ~11.25 GB per card. BUT this is a HYBRID arch: most layers
  #     are Gated-DeltaNet (linear_attn) which store NO per-token KV, so only the minority
  #     full-attention layers use the cache. With --kv-cache-dtype fp8 + util 0.92 the KV
  #     pool measures ~100-120K tokens (~2.2 GB/card free). max-model-len 100352 = ~3.1x
  #     the naive 32K, verified to load + generate with ~1.2x headroom. Still short of the
  #     Q5-MTP llama.cpp entry's 142K, but far past where dense-arch fp16 math predicts.
  #     If a future load OOMs, the pool sizing varies run-to-run -- drop max-model-len first.
  #   - Quant is compressed-tensors NVFP4 (W4A4). Let vLLM auto-select the FP4 backend --
  #     do NOT pass a Marlin backend (Unsloth: ~2.5x slowdown with W4A4). We never did.
  #   - MTP is baked into the quant (config.json mtp_num_hidden_layers=1). The correct
  #     speculative method for the qwen3_5 arch is "qwen3_5_mtp" (verified against
  #     vLLM v0.22.0's registered methods) -- NOT "qwen3_next_mtp" used by the entry above,
  #     which is a different (MoE) arch. Wrong method => vLLM refuses to start.
  #   - Launch: TP=2 across the two x8/Gen5 cards (PCI idx 1,2), util 0.92, single seq, fixed chat template,
  #     ~100K ctx via fp8 KV cache. Unique container name for clean swaps.
  qwen36-27b-nvfp4:
    cmd: |
      docker run --rm --name qwen36-27b-nvfp4 --runtime nvidia --ipc=host
      # 3-GPU re-pin 2026-07-21: PCI idx 1,2 = 5070 Ti + MSI 5060 Ti (both x8/Gen5);
      # idx 0 = ZOTAC on the x4 adapter is EXCLUDED to keep TP all-reduce off the slow link.
      -e CUDA_DEVICE_ORDER=PCI_BUS_ID -e CUDA_VISIBLE_DEVICES=1,2
      -e NCCL_P2P_DISABLE=1 -e NCCL_SHM_DISABLE=0 -e NCCL_IB_DISABLE=1 -e NCCL_CUMEM_ENABLE=0
      -e PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True -e VLLM_NO_USAGE_STATS=1
      -p ${PORT}:8000 -v /mnt/shared/models:/models
      # NB this NVFP4 quant FP4-quantizes lm_head (ships lm_head.weight_scale); needs a
      # recent vLLM (>=0.24.0 per Unsloth). We track :latest across all vLLM entries.
      vllm/vllm-openai:latest
      --model /models/vllm-direct/Qwen3.6-27B-NVFP4

      # fixed chat template (vLLM uses --chat-template, NOT llama.cpp's --jinja/--chat-template-file)
      --chat-template /models/qwen_35_36_chat_template.jinja
      # preserve_thinking: keep <think> history in-context. vLLM's flag is
      # --default-chat-template-kwargs (this build has NO --chat-template-kwargs); it
      # feeds the same template kwarg the llama.cpp entries pass. No --reasoning-parser
      # is set, so vLLM leaves reasoning INLINE in content -- the equivalent of the
      # llama.cpp entries' --reasoning-format none.
      --default-chat-template-kwargs "{\"preserve_thinking\": true}"

      --served-model-name qwen36-27b-nvfp4
      --tensor-parallel-size 2
      --max-model-len 100352
      --max-num-seqs 1
      --gpu-memory-utilization 0.92
      --kv-cache-dtype fp8
      --disable-custom-all-reduce
      --trust-remote-code
      --language-model-only
      # method "mtp" (vLLM >=0.25 renamed qwen3_5_mtp -> mtp; auto-detects the Qwen3_5MTP draft)
      --speculative-config "{\"method\":\"mtp\",\"num_speculative_tokens\":1}"
      --host 0.0.0.0
      --port 8000
    cmdStop: docker stop qwen36-27b-nvfp4

  # Qwen3.5-122B-A10B (added 2026-06-25): the BIG sibling of qwen3-coder-next -- SAME
  # hybrid arch (Gated DeltaNet + Gated Attention + MoE, 64 layers, MTP-trained), so
  # the same ggml-org b9570 image and the same tuning playbook apply. 122B total / 10B
  # active, 256 experts (8 routed + 1 shared). unsloth UD-IQ3_XXS (44.7 GB single file)
  # = the sweet-spot quant per unsloth's KLD benchmarks (Q2->Q3 is the big quality jump;
  # Q3->Q4 marginal). Fits CURRENT 32 GB RAM: ~26 GB GPU + ~19 GB RAM, ~13 GB headroom.
  #
  # TWO VALIDATED PROFILES (2026-06-25), both 6/6 needle recall, GPU mem rock-solid:
  #  * 128K ctx (ACTIVE below): --n-cpu-moe 28, --tensor-split 2.5,1, -ub 256, -c 131072
  #    -> 5060 86% / 5070 78%, 147 t/s prefill, 37 t/s gen.
  #  * 32K ctx (max speed): --n-cpu-moe 22, --tensor-split 2,1, -ub 512, -c 32768
  #    -> 5060 94% / 5070 92%, 277 t/s prefill, 41 t/s gen.
  # MTP WORKS on this GGUF (unlike Coder-Next, the nextn tensors were KEPT) -- --spec-type
  # draft-mtp below is what makes these speeds (plain 10B-active offload would be ~15-22).
  # Sampling below is a generic Qwen3 non-thinking default; adjust per the model card.
  #
  # THE CONSTRAINT HERE IS SYSTEM RAM, NOT VRAM. ~16-24 GB of the model lives in RAM, so:
  #  - PUSH the GPUs to ~90% like any other config (LOW --n-cpu-moe). That's safe AND it
  #    shrinks the RAM footprint -- both goals align. VRAM % was never the problem.
  #  - KEEP mmap (NO --no-mmap on 32 GB at 128K!). --no-mmap hard-allocated ~24 GB of
  #    experts -> 93% RAM -> swap-thrash -> system lag -> 5060 fell off the PCIe bus
  #    (driver watchdog). mmap keeps RAM-resident experts as EVICTABLE page cache (shows
  #    as buff/cache, not "used") so RAM can't thrash. Watch `free -h` SWAP, not VRAM %.
  #    --no-mmap MEASURED (2026-06-25, 32K profile): prefill 277 -> 600 t/s (+117%!),
  #    gen 41 -> 42 (mmap page-faults crush PREFILL on the offloaded experts; decode is
  #    cache-warm so ~unaffected). Stable at 80% RAM on the 32K profile (n22, ~15 GB in
  #    RAM). NOT safe at 128K (n28, ~19 GB -> ~90% RAM = crash zone) until 64 GB.
  #  - Knobs: --n-cpu-moe = RAM<->GPU/SPEED (lower = more on GPU = faster + less RAM,
  #    until a card OOMs); --tensor-split A,B = balance (A = CUDA0 = 5070 Ti; LOWER A ->
  #    shift load to 5060). Both profiles PREFILL-VALIDATED with a 31K NIAH prompt (see
  #    test-30K.md): GPU mem rock-solid, 6/6 recall at all depths incl. the middle.
  #  - GOING TO 128K: the killer isn't KV/weights, it's the PROMPT-PROCESSING COMPUTE
  #    BUFFER -- it grows with context and must fit on device 0 (5070), failing with
  #    "graph_reserve: failed to allocate compute pp buffers" even when weights/KV fit.
  #    Fix = LOWER -ub (512->256 ~halves it) + raise --n-cpu-moe for room. NOT a split
  #    problem -- no ratio fits if total VRAM is short. (-ub 256 also drops prefill
  #    277->147 t/s; a FULL 128K prefill is then ~15 min, fine for typical prompts.)
  # 64 GB RAM: the real win is --no-mmap AT 128K = ~2x prefill (a full 128K ingest drops
  # from ~15 min to ~4) on long-context work, the one thing 32 GB can't safely give.
  # NOT higher quants -- those TANK speed (Q4_K_S ~62% in RAM -> ~18-22 t/s vs IQ3's 37,
  # for a marginal KLD gain per unsloth's curve). IQ3_XXS is the sweet spot; keep it.
  qwen3.5-122B-IQ3-MTP:
    cmd: |
      docker run --rm --name q122b --runtime nvidia --cap-add SYS_ADMIN
      -p ${PORT}:8080 -v /mnt/shared/models:/models
      # known-good image build: b9692
      --entrypoint /app/llama-server ghcr.io/mostlygeek/llama-swap:cuda
      -m /models/Qwen3.5-122B-A10B-UD-IQ3_XXS.gguf

      # fixed chat template
      --jinja --chat-template-file /models/qwen_35_36_chat_template.jinja

      -ngl 99
      --n-cpu-moe 28
      --threads 12
      -c 131072
      --tensor-split 2.5,1
      # MTP: TESTING -- Jim reports this is an MTP model. If load fails with "model
      # doesn't contain MTP layers" (like Coder-Next), comment these two out + drop
      # --n-cpu-moe back toward 30. If it loads, big win (10B active is slow, MTP helps).
      --spec-type draft-mtp
      --spec-draft-n-max 2
      -np 1
      -fa on
      -b 2048
      -ub 256
      -ctk q8_0
      -ctv q8_0
      --temp 0.7
      --top-p 0.8
      --top-k 20
      --min-p 0.0
      --presence-penalty 0.0
      --repeat-penalty 1.0
      --reasoning-format none
      --timeout 900
      --host 0.0.0.0
      --port 8080
    cmdStop: docker stop q122b

  # Qwen3.5-9B Q8_0 (added 2026-07-31): the small/FAST member of the qwen35 family. Same
  # hybrid arch as the 27B/122B (Gated DeltaNet + full attention every 4th layer), 32 dense
  # layers, 9.5 GB at Q8_0 (near-lossless). Tuned purely for SPEED:
  #  - SINGLE GPU, pinned by UUID to the 5070 Ti (d64df8cf = PCI idx 1, Gen5 x8, the fastest
  #    card/link here). Weights + KV + compute buffer land around ~11 GB of its 16 GB, so no
  #    split, no all-reduce, no cross-card traffic -- the fastest possible shape at this size.
  #    It also leaves the ZOTAC (idx 0) alone, so this COEXISTS with the `dictation` group.
  #  - NO MTP. This GGUF ships no nextn tensors (427 tensors, blk.0-31 only), unlike the
  #    27B/35B -MTP builds -- `--spec-type draft-mtp` would abort at load. Don't add it.
  #  - Context 32K (native max is 262144). KV is cheap on this arch -- only 8 of the 32
  #    layers are full-attention (full_attention_interval=4) -- so 32K costs well under 1 GB
  #    even at f16. f16 KV (no -ctk/-ctv) is DELIBERATE: there's headroom, and it's both
  #    lossless and a touch faster than q8_0 KV. Raise -c if you need more; there's room.
  #  - --no-mmap: read the weights straight into VRAM, no page-fault stalls on prefill.
  #    Deliberately NO --mlock (unlike the MoE entries): with -ngl 99 nothing of substance
  #    stays in RAM to pin, and this host's RLIMIT_MEMLOCK is too low anyway -- it just
  #    logs "failed to mlock 2172362752-byte buffer / Cannot allocate memory" and moves on.
  #  - -b/-ub 2048 for fast prefill; the compute buffer stays small at 32K.
  qwen3.5-9B-Q8:
    cmd: |
      docker run --rm --name q9b --runtime nvidia --cap-add SYS_ADMIN
      -e CUDA_VISIBLE_DEVICES=GPU-d64df8cf-c877-b43d-d9a5-d6b0e38e504a
      -p ${PORT}:8080 -v /mnt/shared/models:/models
      # known-good image build: b9692
      --entrypoint /app/llama-server ghcr.io/mostlygeek/llama-swap:cuda
      -m /models/Qwen3.5-9B-Q8_0.gguf

      # fixed chat template
      --jinja --chat-template-file /models/qwen_35_36_chat_template.jinja

      -ngl 99
      -c 32768
      -fa on
      -np 1
      --no-mmap
      -b 2048
      -ub 2048
      --temp 0.6
      --top-p 0.95
      --top-k 20
      --min-p 0.0
      --presence-penalty 0.0
      --repeat-penalty 1.0
      --reasoning-format none
      --reasoning-budget -1
      --chat-template-kwargs "{\"preserve_thinking\": true}"
      --timeout 900
      --host 0.0.0.0
      --port 8080
    cmdStop: docker stop q9b

  # Laguna-S-2.1 (poolside): 117.6B-total / 8.5B-active MoE, `laguna` arch, 262K native ctx,
  # agentic-coding. Quant: unsloth UD-IQ4_XS, 3 shards (~57.6 GB) -- point -m at the FIRST shard,
  # llama.cpp auto-loads the rest. --fit balances it across the 3 GPUs (~14.8 GB/card) and offloads
  # routed experts to RAM as evictable mmap; do NOT add -ngl/--n-cpu-moe/--tensor-split (they abort
  # the fit). --threads 20 = all cores for CPU expert math. known-good image build: b10143 (digest
  # sha256:88b644c232f36da21405f5d849e2d58d333210e79512e7b3efd8bde7345f64fd); if a future latest
  # OOMs a card, pin `server-cuda13@sha256:<known-good>` or switch to `-ngl 99 --n-cpu-moe N`.
  laguna-s-2.1-mainline:
    cmd: |
      docker run --rm --name laguna-mainline --runtime nvidia --cap-add SYS_ADMIN
      -p ${PORT}:8080 -v /mnt/shared/models:/models
      --entrypoint /app/llama-server ghcr.io/ggml-org/llama.cpp:server-cuda13
      -m /models/Laguna-S-2.1-UD-IQ4_XS-00001-of-00003.gguf

      # Unsloth's fixed external chat template (same file the fork entry uses).
      --jinja --chat-template-file /models/laguna_chat_template.jinja

      # --fit first (mirrors the fork). If a card OOMs, see the --n-cpu-moe fallback above.
      --fit on
      --threads 20
      -fa on
      -ctk q8_0
      -ctv q8_0
      -c 262144
      -ub 768
      --temp 0.7
      --top-p 0.95
      --min-p 0.0
      --presence-penalty 0.0
      --repeat-penalty 1.0
      --reasoning-format none
      --timeout 900
      --host 0.0.0.0
      --port 8080
    cmdStop: docker stop laguna-mainline

  # ############ #
  # GEMMA MODELS #
  # ############ #

  # NB: no `-sm tensor` gemma entry -- gemma TP+MTP crashes (GGML_ASSERT, tensor-split
  # can't allocate the MTP graph on gemma's shared-KV arch) and TP-no-MTP (35.8 t/s) loses
  # to layer-split+MTP below (64.3 t/s). Use gemma-4-31B-Q4-MTP; don't re-add a TP variant.
  # gemma-4-31B-Q4-QAT + MTP assistant (added 2026-06-09). Measured ~30 -> ~50 tok/s
  # decode (~1.68x), ~61-63% draft acceptance.
  #
  # known-good image build: b9692 (the gemma-4 MTP assistant needs >= b9570).
  #
  # MTP wiring: -md <assistant> + --spec-type draft-mtp; the assistant has
  # nextn_predict_layers=4 so --spec-draft-n-max 4. -c trimmed to 65536 and
  # --tensor-split eased to 1.3,1 to leave the 5070 Ti room for the draft alongside
  # the main model. If the 5070 OOMs, lower -c further or pin the draft to the 5060
  # with `-devd CUDA1`.
  gemma-4-31B-Q4-MTP:
    cmd: |
      docker run --rm --name g31mtp --runtime nvidia --cap-add SYS_ADMIN
      -e CUDA_VISIBLE_DEVICES=GPU-d64df8cf-c877-b43d-d9a5-d6b0e38e504a,GPU-57bbb375-a61a-6662-e9c8-447b948f0833
      -p ${PORT}:8080 -v /mnt/shared/models:/models
      --entrypoint /app/llama-server ghcr.io/mostlygeek/llama-swap:cuda
      -m /models/gemma-4-31B-it-qat-UD-Q4_K_XL.gguf
      -md /models/gemma-4-31B-it-qat-assistant-MTP-Q8_0.gguf

      # Google's updated canonical Gemma-4 chat template (from google/gemma-4-31B-it,
      # published 2026-07-09: tool-calling / turn-closure / thinking-ordering fixes).
      # Needs --jinja for its macros; preserve_thinking below is still supported by it.
      --jinja --chat-template-file /models/gemma-4-chat_template.jinja

      --spec-type draft-mtp
      --spec-draft-n-max 4
      -ngl 99
      -ngld 99
      -c 75536
      --tensor-split 1.3,1
      -np 1
      -fa on
      --no-mmap
      --mlock
      -b 2048
      -ub 256
      -ctk q8_0
      -ctv q8_0
      --temp 0.6
      --top-p 0.95
      --top-k 64
      --min-p 0.0
      --presence-penalty 0.0
      --repeat-penalty 1.0
      --reasoning-budget -1
      --chat-template-kwargs "{\"preserve_thinking\": true}"
      --timeout 900
      --no-context-shift
      --ctx-checkpoints 128
      --host 0.0.0.0
      --port 8080
    cmdStop: docker stop g31mtp

  # MoE + MTP (2026-06-12): ~140 -> ~184 t/s decode (+30%) — the fastest model here.
  # gemma-4-26B-A4B MoE (qat UD-Q4_K_XL) + its separate MTP draft, both from
  # unsloth/gemma-4-26B-A4B-it-qat-GGUF. ggml-org image (gemma MTP needs the newer
  # build). NO --swa-full -- gemma's iSWA would OOM with it (dual KV cache). The dense
  # gemma-4-31B-Q4-MTP above stays for higher coding quality; this is the speed pick.
  gemma-4-26B-MoE-MTP:
    cmd: |
      docker run --rm --name g26moe --runtime nvidia --cap-add SYS_ADMIN
      -p ${PORT}:8080 -v /mnt/shared/models:/models
      --entrypoint /app/llama-server ghcr.io/mostlygeek/llama-swap:cuda
      -m /models/gemma-4-26B-A4B-it-qat-UD-Q4_K_XL.gguf
      -md /models/gemma-4-26B-A4B-it-Q8_0-MTP.gguf

      # Google's updated canonical Gemma-4 chat template (from google/gemma-4-26B-A4B-it;
      # byte-identical to the 31B one -- Google ships one shared template for gemma-4).
      # Needs --jinja for its macros.
      --jinja --chat-template-file /models/gemma-4-chat_template.jinja

      --spec-type draft-mtp
      --spec-draft-n-max 2
      -ngl 99
      -ngld 99
      -c 256000
      --tensor-split 1,1
      -np 1
      -fa on
      --no-mmap
      --mlock
      -b 2048
      -ub 512
      -ctk q8_0
      -ctv q8_0
      --temp 0.6
      --top-p 0.95
      --top-k 64
      --min-p 0.0
      --timeout 900
      --no-context-shift
      --ctx-checkpoints 128
      --host 0.0.0.0
      --port 8080
    cmdStop: docker stop g26moe

  # ############### #
  # DEEPSEEK MODELS #
  # ############### #

  # DeepSeek-V4-Flash-0731, unsloth UD-IQ2_M, 3 shards (added 2026-08-01) -- point -m at
  # the FIRST shard, llama.cpp auto-loads the rest.
  #
  # !! DIFFERENT MOUNT !! These shards live on /mnt/models (nvme1n1p5, its own XFS
  # partition), NOT /mnt/shared/models like every other entry in this file. Hence
  # `-v /mnt/models:/models`. Do not copy the usual mount line into this entry.
  #
  # Arch/size: `deepseek4`, 43 blocks, 256 routed experts + 1 shared, 6 active
  # (~285B total / ~9B active). Shards are 5 MB (metadata + tokenizer only, 0 tensors),
  # 46.5 GiB, and ~37 GiB -- ~84 GiB of weights against 47.8 GiB VRAM + 62 GiB RAM.
  # Per layer: ~1.80 GiB routed experts + ~0.14 GiB attention/shared; embd+output ~0.6 GiB.
  # So at least ~36 GiB of experts must live in RAM, realistically ~45 GiB once KV and
  # compute buffers have taken their share of VRAM.
  #
  # Quant choice (checked 2026-08-01) -- IQ2_M is the largest one that actually FITS, not the
  # best one available. Unsloth's ladder, with mean KL-divergence:
  #     UD-IQ2_M      84.7 GiB   KLD 0.3612   <- this entry; ~43 GiB RAM-side, ~84% of free RAM
  #     UD-Q2_K_XL    90.2 GiB   KLD 0.2992   ~50 GiB RAM-side = ~97% of free RAM, no slack for
  #                                           page-cache eviction; also ~13% slower decode (2 more
  #                                           expert layers on CPU) and forces -c down to ~128K.
  #     UD-IQ3_XXS    97.1 GiB   KLD 0.1842   DOES NOT FIT. ~95 GiB of usable weight budget exists
  #                                           before KV; Unsloth themselves spec 110GB+ RAM for it.
  # The big quality step is IQ3_XXS, and it needs 128 GB of RAM -- that, not a quant bump, is the
  # upgrade path. Q2_K_XL buys the least KLD per GiB of the three and eats all remaining headroom,
  # so it was considered and rejected. If IQ2_M proves too degraded, prefer switching models
  # (qwen3.5-122B-IQ3-MTP, laguna-s-2.1-mainline) over climbing this ladder.
  #
  # Placement: --fit on, same as laguna-s-2.1-mainline. It measures the real graph, spreads
  # non-expert weights + KV across all 3 cards, and offloads routed experts to RAM as
  # evictable mmap. Do NOT add -ngl / --n-cpu-moe / --tensor-split -- they abort the fit.
  # -c IS set explicitly so fit only adjusts placement, never context: left unset, fit
  # would chase the model's 1M native ctx and push nearly every expert into RAM, which
  # does not fit in 62 GiB and would thrash on NVMe.
  #
  # Deliberately NO --mlock and NO --no-mmap (unlike the qwen MoE entries): the ~45 GiB of
  # RAM-resident experts must stay evictable page cache, or a RAM spike becomes an OOM kill
  # instead of a re-read. (--mlock would fail on this host's RLIMIT_MEMLOCK anyway.)
  #
  # NO MTP / --spec-type draft-mtp: split.tensors.count is 1328 = blk.0-42 + embd/output
  # only, with no nextn block. Adding it aborts at load, same as qwen3.5-9B-Q8.
  #
  # The chat template is EMBEDDED in the GGUF (Unsloth's fixed one), so --jinja on its own
  # -- no --chat-template-file, unlike the qwen/gemma entries.
  #
  # Context: 262144 (256K). Native is 1048576 via YaRN (factor 16 over a 65536 base) and KV
  # is cheap on this arch -- deepseek4 compresses it per layer (attention.compress_ratios:
  # 2 layers uncompressed, 21 at 4x, 20 at 128x) on top of MLA (kv_lora 512 + 64 rope) and
  # a 128-token raw sliding window -- so 256K should cost only a few GiB. It is set
  # conservatively because `deepseek4` was brand new when this entry was written and its
  # real KV/compute buffers could not be measured: the 3rd shard was still downloading.
  # TO RAISE IT, load once and read the actual numbers:
  #   docker logs dsv4f 2>&1 | grep -E "KV self size|compute buffer|n_ctx|flash_attn|offloaded"
  # then trade GiB for GiB -- roughly every 1.8 GiB of extra KV pushes one more layer of
  # experts out of VRAM and into RAM, and RAM is the binding constraint here (~53 GiB free).
  # 524288 is the realistic next step up; 1048576 is not.
  #
  # Levers if it will not load: --fit-target 512 (default is 1024 MiB/device) claws ~1.5 GiB
  # back into VRAM; -ctk q8_0 -ctv q8_0 halves KV but may be rejected on this arch's
  # compressed-KV path; -c 131072 as a floor.
  #
  # -fa auto rather than the `-fa on` used everywhere else, on purpose: if this arch has no
  # flash-attention kernel yet, `on` aborts the load whereas `auto` falls back. Check the log
  # for "flash_attn = 1" and switch to `on` once confirmed.
  #
  # Sampling is DeepSeek's own, NOT the 0.6/0.95 the qwen entries use. general.sampling.temp
  # and top_p in the GGUF are both 1.0; the model card says temp 1.0 with top_p 1.0 in
  # general, or top_p 0.95 for agentic use -- switch to 0.95 if you drive this with a tool
  # loop. Note that temp 1.0 / top_p 1.0 / top-k 0 / penalties at their no-op values is not
  # an arbitrary choice: DeepSeek's own API documents that thinking mode ignores temperature,
  # top_p, presence_penalty and frequency_penalty outright (accepted for compatibility, no
  # effect), so this block is what reproduces hosted behaviour locally. That silent-ignore is
  # an API-side policy, NOT a property of the weights -- llama.cpp knows nothing about
  # "thinking mode" and WILL apply whatever you put here, so do not set temp 0.6 and assume
  # the model overrides it. See https://api-docs.deepseek.com/guides/thinking_mode/
  #
  # !! ALWAYS SEND A SYSTEM PROMPT !! (measured 2026-08-01, n=6 per condition, fixed seeds)
  # On a low-signal prompt -- literally "Hi" -- this quant picks its output language at the
  # first token of the <think> block and gets it wrong often: 3/6 replies came back entirely
  # in Chinese, one in French. It is sticky, so the whole conversation then continues in it.
  #   temp 1.0 / top_p 1.0 / top-k 0 (as configured):  3/6 Chinese
  #   temp 0.6 / top_p 0.95 / top-k 40 (tightened):    2/6 Chinese   <- sampling is NOT the fix
  #   any system prompt pinning English:               0/6 Chinese   <- this is the fix
  # Substantive English prompts carry enough signal to mask it, so it looks fine until someone
  # opens the playground and types "Hi". This is quantization damage to the language prior, not
  # a template or client bug -- consistent with IQ2_M's 0.3612 KLD (see the quant ladder above),
  # and another argument for UD-Q2_K_XL if it keeps biting.
  # There is no server-side lever: --system-prompt-file / -spf no longer exist in this build. The
  # only ways to guarantee it are (a) the client always sends a system prompt, or (b) extract the
  # embedded template to a .jinja file and inject a default directive when no system message is
  # present, then point --chat-template-file at it like the qwen/gemma/laguna entries do.
  #
  # Thinking is OFF by default -- the embedded template does `{%- set thinking = false -%}`
  # and gates <think>/</think> on it (this is NOT the qwen <|think_on|> tag scheme). To turn
  # it on, add:  --chat-template-kwargs "{\"thinking\": true}"  . --reasoning-format none is
  # kept so the raw <think> block reaches the client either way, as with the other entries.
  #
  # The real depth knob is `reasoning_effort` (template default: none; accepts 'low', 'high',
  # 'max'), which injects an effort directive into the prompt -- combine as
  #   --chat-template-kwargs "{\"thinking\": true, \"reasoning_effort\": \"high\"}"
  # Watch the context budget if you do: DeepSeek documents up to 384K output tokens at high/
  # max effort, which does not fit the 256K -c set here. Cap it client-side via max_tokens.
  #
  # NB: the `dictation` group is persistent: true, so parakeet-asr + qwen-clean-2b are NOT
  # evicted automatically. Unload them before loading this, or --fit will find the ZOTAC
  # (CUDA idx 0) short and shrink the GPU share -- pushing yet more experts into RAM.
  deepseek-v4-flash-IQ2:
    cmd: |
      docker run --rm --name dsv4f --runtime nvidia --cap-add SYS_ADMIN
      -p ${PORT}:8080 -v /mnt/models:/models
      # known-good image build: b10143 (first build here with `deepseek4` arch support)
      --entrypoint /app/llama-server ghcr.io/mostlygeek/llama-swap:cuda
      -m /models/DeepSeek-V4-Flash-0731-UD-IQ2_M-00001-of-00003.gguf

      # chat template ships inside the GGUF -- no --chat-template-file
      --jinja

      --fit on
      -c 262144
      --threads 20
      -fa auto
      -np 1
      -b 2048
      -ub 512
      --temp 1.0
      --top-p 0.95
      --top-k 0
      --min-p 0.0
      --presence-penalty 0.0
      --repeat-penalty 1.0
      --reasoning-format none
      --timeout 900
      --host 0.0.0.0
      --port 8080
    cmdStop: docker stop dsv4f

  # MTP evaluation profile (replaced DSpark 2026-08-04). 131K context, same IQ2_M target.
  # Uses the MTP draft head from ddh0/DeepSeek-V4-Flash-GGUF (Q8_0, ~4.4 GB) instead of
  # the DSpark drafter (~10 GB). MTP is self-speculative (nextn baked into the assistant),
  # wired with -md like the gemma entries rather than --model-draft.
  #
  # !! IMAGE MUST BE THE PINNED v246 DIGEST (same as the old DSpark entry), NOT :cuda !!
  #   :cuda is v243 (built 2026-07-26) -- it PREDATES the DeepseekV4 MTP merge
  #   (llama.cpp#25784, merged 2026-08-02) and aborts the draft load with
  #   "missing tensor 'blk.0.attn_norm.weight'". The draft GGUF is an mtp-only partial
  #   model (block 43 + nextn heads, no blk.0-42); v246+ auto-detects that (mtp_only)
  #   and marks the trunk tensors TENSOR_NOT_REQUIRED.
  #
  # PLACEMENT (tuned 2026-08-04): fit CANNOT be used with this draft -- measuring the MTP
  #   context hits GGML_ASSERT(n_graph_inputs < GGML_SCHED_MAX_SPLIT_INPUTS) (deepseek4
  #   graph > 30 inputs/split). Explicit placement instead. --cpu-moe (all experts CPU)
  #   left the GPUs at ~30% and ~7.7 t/s; --n-cpu-moe 33 (first 33 layers' experts CPU,
  #   layers 33-42 on GPU) with a rebalanced split fills the 5070 Ti + MSI 5060 Ti
  #   (~70% total) while keeping the ZOTAC (CUDA1, dictation card) light at ~4.5 GB
  #   so the dictation group can coexist. Device map: CUDA0 = 5070 Ti, CUDA1 = ZOTAC
  #   5060 Ti, CUDA2 = MSI 5060 Ti (fastest-first enumeration).
  #
  # DRAFT DEPTH: --spec-draft-n-max 1, NOT 3. DeepSeek-V4 MTP has a single nextn block
  #   that drafts sequentially; drafting 3 tokens ahead collapses acceptance (0.38 @
  #   n-max 3 vs 0.81 @ n-max 1) and the extra draft decodes eat the gains. n-max 1
  #   measured 16.01 t/s warm vs 14.36 @ n-max 2, 7.68 @ n-max 3 cpu-moe.
  #
  # MEASURED 2026-08-04 (warm = 2nd+ request; 1st request is polluted by graph-capture
  #   warmup, ~30 s regardless of placement/ctx -- do not benchmark first requests):
  #   this entry 16.01-16.09 t/s @ 0.815 acceptance; DSpark (replaced) was 17.02-17.53
  #   t/s @ 0.697 -- effectively parity, minus the 10 GB DSpark draft file.
