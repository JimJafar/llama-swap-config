    # --- TENSOR-PARALLEL IQ4_XS variant of Qwen3.8-27B (added 2026-08-19) ---
    # This llama.cpp entry owns the primary name. The vLLM NVFP4 variant (which briefly
    # took the name on 2026-08-31) OOMed at load on the desktop-limited 5070 -- the
    # MTP-drafter NVFP4 scale-processing peak (~14.4 GiB) is context-independent, so
    # max-model-len could not fix it -- and that entry has since been REMOVED from this
    # config entirely. This is therefore the only 27B IQ4_XS entry: 2-card -sm tensor,
    # IQ4_XS, -c 262144 native.
    # RENAMED 2026-09-17: config ids were shortened; this entry is now `Q3.8-27B-IQ4XS`.
    # Clone of Qwen3.8-27B-Q5-MTP-TP with the lighter IQ4_XS quant for MORE
    # CONTEXT. MODEL: unsloth/Qwen3.8-27B-GGUF -> Qwen3.8-27B-IQ4_XS.gguf
    # (15.7 GiB, 288 IQ4_XS + Q5_K/Q4_K outlier tensors, nextn MTP head VERIFIED
    # in the GGUF header: blk.64.nextn.{eh_proj Q8_0, enorm/hnorm/shared_head_norm
    # F32}). Native context 262144. NOTE: plain I-quants historically abort -sm
    # tensor with GGML_ASSERT SPLIT_AXIS_UNKNOWN (see Q5 entry notes); this file
    # is NOT a UD requant -- if the load aborts, drop -sm tensor or requant UD.
    #
    # CONTEXT PROBE: -c 262144 (native). Weights 18.8 -> 15.7 GiB frees ~1.5
    # GB/card vs Q5 at 175K, which had MSI at 96.6% / 5070 at 89.8% -- 262K
    # should fit; if the load OOMs at graph_reserve, step -c down (196608 ->
    # 175000) and note the ceiling here.
    #
    # 2026-08-19 UPDATE (v2): desktop compositor switched Vulkan -> OpenGL,
    # freeing ~2 GB on the 5070 Ti (device1: now 81% vs MSI device0 92%). The
    # MSI was the wall at the old split, and the freed 5070 headroom is only
    # usable by REBALANCING the tensor split. IMPORTANT: with the Meta()
    # multi-device backend in build 10362 the split ratio is EXTREMELY
    # sensitive and NOT linear:
    #    1.01,1   -> MSI-heavy  (MSI 14988 / 5070 11746 @229K, MSI at wall)
    #    0.99,1.01-> 5070 OVERLOADED (fails to load, cudaMalloc OOM on dev1)
    #    0.95,1.05-> 5070 OVERLOADED (same failure)
    #    1.00,1.00-> balanced (MSI 13944 / 5070 14383 server @245K)
    # So the balance point is 1.00,1.00 -- the split is a sharp threshold.
    # With it, -c 262144 (NATIVE MAX) loads: MSI 1545 MiB free, 5070 464 MiB
    # total free (~1064 server-side; the 5070 carries ~600 MiB of desktop
    # Xorg/compositor). See inline probe notes.
  Q3.8-27B-IQ4XS:
    cmd: |
      docker run --rm --name q38iq4xsmtptp --runtime nvidia --cap-add SYS_ADMIN
      --ipc=host
      # GPU re-pin (2026-09-08): the 5070 Ti (d64df8cf, 16 GiB @ 03:00.0) is back in
      # the box, so this pair moves OFF the 5060 Ti (57bbb375, 16 GiB @ 01:00.0) onto
      # the 5070 Ti. Machine now has three cards: 3090 (93ab52e5, 24 GiB, display @
      # 02:00.0) + 5060 Ti (57bbb375 @ 01:00.0) + 5070 Ti (d64df8cf @ 03:00.0); this
      # model runs on the 3090 + 5070 Ti. Both candidate secondary cards are 16 GiB,
      # so the split balance with the 3090 carries over unchanged. CUDA0 = 3090
      # (--main-gpu 0), CUDA1 = 5070 Ti. tensor-split is weighted toward the 3090 so
      # it holds most of the weights AND its (larger) share of the unified KV pool;
      # -c is at the 262144 native ceiling to spend the 3090's spare VRAM on KV.
      -e CUDA_VISIBLE_DEVICES=GPU-93ab52e5-8e61-197e-880a-aa6af5a13c74,GPU-d64df8cf-c877-b43d-d9a5-d6b0e38e504a
      -e NCCL_P2P_DISABLE=1 -e NCCL_CUMEM_ENABLE=0
      -e LD_PRELOAD=/opt/newnccl/libnccl.so.2
      -v /home/jim/llama-swap/vendor/libnccl.so.2.30.4:/opt/newnccl/libnccl.so.2:ro
      -p ${PORT}:8080 -v /mnt/data/models:/models
      # 2026-09-07: MTP is now in mainline; moved off the mostlygeek bundled image (where MTP
      # was first available) onto the official ggml-org main image. Per repo policy we do NOT
      # pin builds - this tracks the latest mainline CUDA13 tag (docker pull to advance).
      # Verified on the 3090+5060Ti at 262K under production settings: MTP decode ~67->~80 t/s
      # (novel prose) / ~82->~97 t/s (code), ~+18% vs the old bundled image.
      --entrypoint /app/llama-server ghcr.io/ggml-org/llama.cpp:server-cuda13
      -m /models/Qwen3.8-27B-UD-IQ4_XS.gguf
      --mmproj /models/qwen3.8-mmproj-BF16.gguf

      # fixed chat template
      --jinja --chat-template-file /models/qwen_sharp_template_oneline.jinja
      --chat-template-kwargs "{\"reasoning_effort\":\"medium\"}"

      -ngl 99
      --flash-attn on
      -sm tensor
      --fit off

      # draft speculation - MTP + ngram
      --spec-type draft-mtp,ngram-mod
      -md /models/qwen3.8-mtp-Q4_0.gguf
      --spec-draft-n-max 3
      --spec-ngram-mod-n-match 24
      --spec-ngram-mod-n-min 48
      --spec-ngram-mod-n-max 64

      # --no-host: with -sm tensor, llama.cpp materialises the whole model in a
      # private anon host buffer -- SPLIT_MODE_TENSOR must divide every tensor
      # across the two ranks, so it cannot stream from the mmap'd GGUF. With
      # -ngl 99 it all sits in VRAM anyway and that host copy is never read
      # again. MEASURED 2026-09-30 without this flag: 14.38 GiB unnamed anon,
      # 100% swapped out (0.009 GiB resident) -> ~8 GiB of zram RAM for nothing.
      --no-host
      -b 2048
      # 2-slot unified shared KV pool: two slots share one pool on the fast TP pair;
      # idle slots cost ~0. -c is the TOTAL pool (KV allocated up front, split across
      # the two TP ranks). Now at an EVEN split both ranks hold ~equal weights AND ~equal
      # KV. NOTE: the Meta() split ratio is a SHARP threshold -- the 5070 Ti has only
      # 16 GiB vs the 3090's 24 GiB, so if CUDA1 (5070 Ti) OOMs at load at this split,
      # pull the ratio back toward the 3090 (e.g. 1.00,0.70); if the 3090 (CUDA0) shows
      # large idle headroom after load, it can take even more weights/KV.
      -c 393216
      -ctk q8_0
      -ctv q8_0
      # 2026-09-16: -c raised 262144 -> 393216 (384K shared pool) with the split pulled to
      # 1.00,0.70 so the 3090's spare VRAM can hold KV. MEASURED ceiling on this pair:
      # 393216 LOADS; 458752 OOMs in graph_reserve ("failed allocating 896.00 MiB on
      # device 1" = the 5070 Ti); 524288 OOMs on device 0 (2640.28 MiB) = the 3090.
      # NOTE the OOM is the COMPUTE buffer in ggml_backend_sched_reserve, not the KV cache,
      # and it moves between cards with size -- so both are near their limit and this is
      # NOT the fill point. Validate any raise with a real long prefill, per the llama-cpp
      # skill ("the idle VRAM-fill point is not a safe -c").
      # --- CONCURRENCY EXPERIMENT (2026-09-16): -np 1 -> -np 4 ---
      # -c stays the TOTAL shared pool, so the VRAM budget is UNCHANGED from the -np 1
      # profile (KV is still 262144 tokens x 34 KiB/token ~= 8.5 GiB; 16 of the 64
      # layers carry KV because the other 48 are Gated DeltaNet with fixed state).
      # --kv-unified MUST be explicit: its documented default is "enabled if number of
      # slots is auto", and -np 4 is explicit, so without this flag -c would be SPLIT
      # four ways (4 x 65536) instead of being one shared pool.
      # --kv-unified-per-slot 131072 caps each sequence so two long requests can coexist
      # (2 x 131072 = the whole pool) while 4 short ones still fit.
      -np 4
      --kv-unified
      --kv-unified-per-slot 262144
      # --- PREFIX REUSE (2026-09-16) ---
      # The subagent pattern is N agents sharing one long system prompt, so the shared
      # prefix should be prefilled ONCE. Neither flag does this by default:
      #   --cache-reuse defaults to 0 = OFF (it is what lets a new request reuse a
      #     prefix from the slot cache via KV shifting);
      #   -sps defaults to 0.10, which only decides which SLOT a request is routed to.
      # Raised -sps so a similar prompt is routed to the slot already holding its prefix.
      --cache-reuse 256
      -sps 0.5
      --main-gpu 0
      # Even split (2026-09-08): balanced so neither card is the serial bottleneck -- at
      # 1.00,0.50 the 3090 did ~2/3 of the transformer work and capped decode throughput
      # (moving to the 5070 Ti at the old ratio gave no speedup). Both ranks now do ~equal
      # work. WATCH: the 5070 Ti is only 16 GiB vs the 3090's 24 GiB, so an even split puts
      # ~half the weights AND ~half the unified KV pool on the 5070; if it OOMs at load at
      # -c 262144, pull the ratio back toward the 3090 (e.g. 1.00,0.70) to trade load for fit.
      --tensor-split 1.00,0.70
      # -np 2
      -ub 512
      --temp 1.0
      --top-p 0.95
      --top-k 20
      --min-p 0.0
      --presence-penalty 0.0
      --repeat-penalty 1.0

      --reasoning-format deepseek
      --reasoning-budget -1
      --reasoning on
      --reasoning-preserve

      --timeout 900
      --host 0.0.0.0
      --port 8080
    cmdStop: docker stop q38iq4xsmtptp
