      --spec-type draft-mtp,ngram-mod
      -md /models/qwen3.8-mtp-Q4_0.gguf
      --spec-draft-n-max 3
      --spec-ngram-mod-n-match 24
      --spec-ngram-mod-n-min 24
      --spec-ngram-mod-n-max 86

      --timeout 900
      --host 0.0.0.0
      --port 8080
