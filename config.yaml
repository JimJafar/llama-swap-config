      --entrypoint /app/llama-server ghcr.io/ggml-org/llama.cpp:server-cuda13
      -m /models/Swift-1.5-Qwen3.8-27B-Q6_K_S.gguf

      # fixed chat template (shared with the other Qwen3.8 entries; the file
      # already sits in /mnt/data/models, so no second mount). A/B: this GGUF
      # ships its OWN template which also handles reasoning_effort and
      # preserve_thinking, so if reasoning tags misparse on this fine-tune,
