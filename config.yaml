# ############################################################################## #
# EDIT WORKFLOW -- run this after EVERY set of edits to this file, before you    #
# consider the job finished:                                                     #
#   1. python3 ./sync-models.py   # regenerates models.json from config.yaml and  #
#                                 # copies the result to ~/.pi/agent/models.json  #
#   2. commit + push              # remote: JimJafar/llama-swap-config, branch main #
# WHY: models.json silently drifts from config.yaml if it is not regenerated, and #
# an uncommitted/unpushed edit is a change that will be lost or made twice.       #
# ORDER: run sync-models.py AFTER the config edits (it reads this file), never    #
# before -- otherwise you sync the previous state.                                #
# ############################################################################## #

# llama-swap runs as a host binary (llama-swap-bin AUR) and launches each model
# as a docker container. llama.cpp models use the bundled mostlygeek image with
# the entrypoint overridden to /app/llama-server; the vLLM model uses the vllm
# image. ${PORT} is assigned by llama-swap and published from the container; the
# server inside always listens on its own fixed port. cmdStop stops the named
# container cleanly on swap so VRAM is freed.
#
# Shared docker flags for llama.cpp models:
#   --runtime nvidia --cap-add SYS_ADMIN  (matches the previously-working setup)
#   --entrypoint /app/llama-server        (image entrypoint is llama-swap)
#
#   --ulimit memlock=-1:-1                REQUIRED by every model that passes --mlock
#                                         (currently q35b / g31mtp / g26moe / ge4bmtp).
#   WHY (2026-09-21): docker's default memlock rlimit inside a container is 8 KiB, so
#   `--mlock` was silently locking nothing -- llama.cpp warns and carries on. The
#   consequence was visible as 8.6 GB of ge4bmtp's weights sitting in /dev/zram0 while
#   the model was idle: because --no-mmap had already copied the weights into anonymous
#   memory, every idle page was compressible, so zram ate it and the first request after
#   a pause paid a decompress. Verified: `docker run --ulimit memlock=-1:-1 ... ulimit -l`
#   prints `unlimited` (vs `8192` by default). --cap-add IPC_LOCK is NOT needed once the
#   rlimit is unlimited -- mlock() accepts rlimit OR capability, so this stays least-priv.
#   KEEP --mlock AND --ulimit TOGETHER: --mlock without the rlimit is a no-op, and the
#   rlimit without --mlock only widens a limit nothing uses.
#
# IMAGE POLICY (2026-09-07): do NOT pin llama.cpp / vLLM / llama-swap builds. Everything
# tracks mainline "latest": official ggml-org llama.cpp uses the rolling server-cuda13 tag;
# llama-swap's bundled image is its rolling :cuda tag. These tags only advance when you
# `docker pull`, so include image pulls in the normal update step. The one deliberate
# exception is a local fork build (local/llama-swap:...) while its feature is still unmerged;
# revert it to mainline latest the moment the feature lands.
#
# Max seconds to wait for a model to become ready after launch. Raised from the 120s
# default for the vLLM entries (e.g. qwen36-27b-nvfp4), which take ~180s to load + capture graphs.
healthCheckTimeout: 600

# Warm the whole 'default' group on every llama-swap start/restart (fires a
# background GET / at each model; swap:false in the group keeps them coexisting
# instead of swapping). 27B is the slow leg (~30-60 s); healthCheckTimeout
# covers it. Runtime eviction (e.g. a 122B/curator load) does NOT re-trigger
# this -- members just reload on their next request.
hooks:
  on_startup:
    preload:
      - whisper-npu-asr
      # s1-mini is tiny (462 MiB) and its load is ~seconds, so preloading it at every
      # llama-swap start keeps Baruch's first dictation warm without startup cost worth
      # worrying about. (Baruch also warms it on its own start; this covers the case
      # where llama-swap restarts after Baruch has already booted.)
      - s1-mini

# Qwen 3.5/3.6/3.8 jinja template fix
#
# The fixed template comes from here: https://huggingface.co/froggeric/Qwen-Fixed-Chat-Templates/blob/main/README.md
#
# All Qwen 3.5, 3.6 and 3.8 variants should have `--jinja --chat-template-file /models/froggeric_qwen_35_36_38_chat_template.jinja`
# (llama.cpp). The .jinja file must live in the MOUNTED models dir (/mnt/shared/models on the host,
# which is bind-mounted to /models in every container) -- a host-side repo path is invisible inside
# the container. For the vLLM entry the flag is `--chat-template <path>` instead (no --jinja).
#
# The Thinking Toggle
#
# You can control the model reasoning behavior. Insert `<|think_on|>` or `<|think_off|>` anywhere in your system or user prompt. The template intercepts the tag, removes it from the final context so the model never sees it, and flips the reasoning mode instantly.
#
# **Fast answer, no reasoning:**
# ```text
# System: You are a coding assistant. <|think_off|>
# User: What's 2+2?
# ```
#
# **Deep reasoning:**
# ```text
# System: You are a coding assistant. <|think_on|>
# User: Implement a red-black tree in Rust.
# ```
# *(The tag syntax uses Qwen's control token delimiters to guarantee it will never collide with legitimate text or file paths, unlike earlier community templates that used `/think`)*
#
# Token Saving (Stripping past thoughts):
#
# By default, this template **preserves** all past `<think>` blocks in the chat history. This prevents the model from suffering "amnesia stalls" during complex agentic loops, and it mathematically guarantees a 100% Prefix KV Cache hit rate on local inference engines.
#
# If you are running constrained hardware and need to save context tokens, you can explicitly disable this feature in your engine's template kwargs to automatically strip past thoughts:
# ```json
# {
#   "preserve_thinking": false
# }
# ```
# *(Note: Setting this to false will reduce your KV Cache hit rate during multi-turn chats because the prompt string will dynamically mutate).*

##################################################################################
# GPU TOPOLOGY (4 GPUs, 72 GB VRAM total; updated 2026-09-12)                    #
#   All four cards are installed and enumerate as shown. Pin every entry by UUID #
#   so a card swap or a re-ordering can never silently move a model.             #
#                                                                                #
#   PCI       Card                VRAM      Role         UUID prefix   CUDA idx  #
#   01:00.0   RTX 5060 Ti         16 GiB    compute      57bbb375      CUDA2     #
#   02:00.0   RTX 3090            24 GiB    desktop/CPEG 93ab52e5      CUDA0     #
#   03:00.0   RTX 5070 Ti         16 GiB    compute      d64df8cf      CUDA1     #
#   M.2       RTX 5060 Ti ZOTAC   16 GiB    RESERVED     af5bd53f      CUDA3     #
#                                                                                #
#   The 3090 is the display card (kwin/compositor on it, ~0.6-0.7 GiB). For      #
#   the -sm tensor TP pair put the 3090 FIRST (CUDA0/--main-gpu 0) and bias      #
#   --tensor-split toward it so it carries most weights + the larger KV share.   #
#   CUDA index order is fastest-first, so the 3090 is CUDA0 and the ZOTAC is last.#
#   CUDA_VISIBLE_DEVICES preserves the order you list, so naming the three       #
#   compute UUIDs (93ab52e5,d64df8cf,57bbb375) keeps CUDA0..CUDA2 on those cards #
#   and makes the ZOTAC invisible to that container.                              #
#                                                                                #
# >>> ZOTAC af5bd53f IS RESERVED (2026-09-12) <<<                                #
#   The ZOTAC is dedicated to the always-on voice stack and must not be          #
#   allocated by any other model or group. RESIDENT (loaded at every boot):      #
#     gemma-4-E4B-MTP  ~8.2 GiB  (LLM)      chatterbox-turbo  ~1.6 GiB  (TTS)    #
#     s1-mini          ~1.5 GiB  (cleanup)  <-- ~11.3 GiB of 16 GiB committed    #
#   Those three are members of the persistent "gemma-resident" group and are      #
#   warmed at boot (see `preload:` and warmup-stt.sh).                           #
#   qwen-clean-2b and parakeet-asr are ZOTAC-pinned but UNLISTED and NOT warmed   #
#   (2026-09-12): s1-mini replaced qwen-clean-2b as baruch-server's cleanup model #
#   and the NPU covers ASR, so both are on-demand fallbacks only. They load       #
#   lazily into the ~4.5 GiB left free (measured: 11391 MiB used, 4499 MiB free).    #
#   Every other entry excludes af5bd53f via CUDA_VISIBLE_DEVICES. Five models    #
#   that used to sit on the ZOTAC (qwen3.5-9B-Q8, Q3.5-9B-Q4, curator-           #
#   grooming, curator-harvesting, gemma-4-26B-MoE-MTP) moved to the MSI 5060 Ti  #
#   (57bbb375) on 2026-09-12 and now share that card with the big models.        #
#   CONSEQUENCE: the DeepSeek / Flash-Next --fit entries are back to 3 GPUs, so   #
#   the measured 4-GPU MTP gain (~+21%, 14.2 -> 17.2 t/s) is deliberately        #
#   forfeited in exchange for the ZOTAC being exclusive. Revisit if that trade    #
#   ever looks wrong.                                                             #
##################################################################################

preload:
  # Large GPU models are loaded on demand so whole-machine models such as
  # Qwen3.8-Flash-Next can fit without startup contention.
  #
  # ZOTAC always-on voice stack (2026-09-12): kept resident permanently. These three
  # commit ~11.3 GiB of the ZOTAC's 16 GiB -- the reason every other entry is pinned
  # away from af5bd53f. qwen-clean-2b and parakeet-asr are deliberately NOT warmed:
  # they are unlisted on-demand fallbacks and stay out of VRAM.
  # Every model listed here must also be in the persistent "gemma-resident" group,
  # or it can be evicted.
  #
  # NOTE: `preload` only works for CHAT-shaped backends. llama-swap warms a preloaded
  # model with a chat request, so an ASR/TTS backend 404s and llama-swap then STOPS the
  # process it just started (observed for whisper-npu-asr and chatterbox-turbo).
  # chatterbox-turbo is therefore warmed through its real endpoint by stt-warmup
  # (warmup-stt.sh) instead of being listed here.
  - gemma-4-E4B-MTP
  - s1-mini
  # SDLC-FACTORY MODEL (2026-09-13): the factory's configured model
  # (config/factory.yaml -> models.bootstrap-planner) must be resident BEFORE a turn
  # starts. Its provider turn is bounded at 900s, so a cold load paid inside that
  # bound is indistinguishable from a hung provider: the factory records a
  # provider-unavailable Infrastructure Failure, and four of those park the Task on
  # an infrastructure Hold. Preloading restores it after every llama-swap restart
  # (19 restarts by 2026-09-13, each of which left it unloaded).
  - Q3.8-27B-IQ4XS

models:
  # ########### #
  # QWEN MODELS #
  # ########### #

  Q3.6-35B-Q4:
    # MoE + MTP (2026-06-12): ~119 -> ~168 t/s decode (+41%) via the MTP-enabled GGUF
    # (Qwen3.6-35B-A3B-UD-Q4_K_M-MTP.gguf from unsloth/Qwen3.6-35B-A3B-MTP-GGUF) plus
    # --spec-type draft-mtp. Fastest model here, ~3x the vLLM 27B; n-max 2 per Unsloth
    # docs. (The non-MTP fallback GGUF was deleted 2026-07-21 to free disk; only the
    # -MTP GGUF this entry runs remains.)
    cmd: |
      docker run --rm --name q35b --runtime nvidia --cap-add SYS_ADMIN --ulimit memlock=-1:-1
      -e CUDA_VISIBLE_DEVICES=GPU-93ab52e5-8e61-197e-880a-aa6af5a13c74,GPU-d64df8cf-c877-b43d-d9a5-d6b0e38e504a,GPU-57bbb375-a61a-6662-e9c8-447b948f0833
      -p ${PORT}:8080 -v /mnt/shared/models:/models
      --entrypoint /app/llama-server ghcr.io/mostlygeek/llama-swap:cuda
      -m /models/Qwen3.6-35B-A3B-UD-Q4_K_M-MTP.gguf

      # fixed chat template
      --jinja --chat-template-file /models/froggeric_qwen_35_36_38_chat_template.jinja

      --spec-type draft-mtp
      --spec-draft-n-max 2
      --fit on
      --fit-ctx 128000
      --fit-target 256
      -np 1
      -fa on
      --no-mmap
      --mlock
      -b 2048
      -ub 2048
      -ctk q8_0
      -ctv q8_0
      --temp 0.6
      --top-p 0.95
      --top-k 20
      --min-p 0.0
      --presence-penalty 0.0
      --repeat-penalty 1.0
      --reasoning-format none
      --reasoning-budget -1
      --chat-template-kwargs "{\"preserve_thinking\": true}"
      --timeout 900
      --host 0.0.0.0
      --port 8080
    cmdStop: docker stop q35b

    # Q4 member of the qwen35 family. Switched 2026-08-22 from Qwen3.5-9B-Q4_1.gguf
    # to unsloth's UD-Q4_K_XL requant (~5.6 GB) -- finer per-block scaling, roughly
    # same size. ngram-mod speculation below (NO MTP: this GGUF, like the Q4_1/Q8_0
    # builds and every file in unsloth/Qwen3.5-9B-GGUF, ships no nextn tensors --
    # verified 2026-08-22: 427 tensors, blk.0-31 only. --spec-type draft-mtp would
    # abort at load; see the Q8 entry note). ZOTAC-pinned like the Q8 entry;
    # weights ~5.6 GB + KV + dictation ~1.7 GB still fits 16 GB.
  Q3.5-9B-Q4:
    cmd: |
      docker run --rm --name q9bq4 --runtime nvidia --cap-add SYS_ADMIN
      -e CUDA_VISIBLE_DEVICES=GPU-57bbb375-a61a-6662-e9c8-447b948f0833
      -p ${PORT}:8080 -v /mnt/shared/models:/models
      # known-good image build: b9692
      --entrypoint /app/llama-server ghcr.io/mostlygeek/llama-swap:cuda
      -m /models/Qwen3.5-9B-UD-Q4_K_XL.gguf

      # fixed chat template
      --jinja --chat-template-file /models/froggeric_qwen_35_36_38_chat_template.jinja

      -ngl 99
      -c 250000
      -fa on
      -np 2
      --no-mmap
      -b 2048
      -ub 2048

      # draft speculation - ngram only (NO MTP: no nextn tensors in this
      # GGUF -- would abort at load). ngram-mod window retuned 2026-08-22
      # from the 27B sibling's 24/24/86 after a live probe measured 13.7%
      # draft acceptance (32/234) -- long ngrams barely match this model's
      # output. Re-check the "draft acceptance" line in the logs; if it's
      # still <~30%, drop speculation entirely.

      --spec-type ngram-mod
      --spec-ngram-mod-n-match 24
      --spec-ngram-mod-n-min 12
      --spec-ngram-mod-n-max 32

      --temp 1.0
      --top-p 0.95
      --top-k 20
      --min-p 0.0
      --presence-penalty 1.5
      --repeat-penalty 1.0
      --reasoning off
      --reasoning-format deepseek
      --chat-template-kwargs "{\"preserve_thinking\": false}"
      --timeout 900
      --host 0.0.0.0
      --port 8080
    cmdStop: docker stop q9bq4

    # CURATOR LoRA ENTRIES (added 2026-08-21): The Librarian's curator, task-specific
    # rank/alpha-8 adapters on Qwen3.5-9B (Unsloth Studio SFT, completion-only, non-
    # thinking data). The 100-case grooming adapter beat its 250/500-case siblings in
    # blind review; harvesting's 100-case adapter lifted F1 78.2 -> 80.8. See
    # "How to get big results from a tiny model" (Writing/Published/AI/...).
    #
    # llama.cpp loads the adapter with --lora-scaled <gguf>:1.0 on top of the SAME
    # base as the Q3.5-9B-Q4 entry above (Qwen3.5-9B-UD-Q4_K_XL.gguf, switched
    # from Q4_1 on 2026-08-22). (This build has no -l short flag / space
    # scale -- plain `--lora FNAME` also works.) The r8 adapters are ~29 MB, so VRAM/
    # coexistence math follows the plain 9B entry (ZOTAC, ~7 GB +
    # dictation's ~1.7 GB fits the 16 GB card).
    # The three entries (plain + these two) swap with each other on request; only
    # one 9B can be resident at a time (same ZOTAC card).
    #
    # Thinking is pinned OFF ("enable_thinking": false) to match the training data --
    # same trick as qwen-clean-2b. pi's qwen3.5 wiring (sync-models.py) can still
    # flip it per request if you want to experiment.
  curator-grooming:
    unlisted: true
    cmd: |
      docker run --rm --name q9b-cgroom --runtime nvidia --cap-add SYS_ADMIN
      -e CUDA_VISIBLE_DEVICES=GPU-57bbb375-a61a-6662-e9c8-447b948f0833
      -p ${PORT}:8080 -v /mnt/shared/models:/models
      # known-good image build: b9692
      --entrypoint /app/llama-server ghcr.io/mostlygeek/llama-swap:cuda
      -m /models/Qwen3.5-9B-UD-Q4_K_XL.gguf
      # this build takes --lora FNAME / --lora-scaled FNAME:SCALE (no -l, no space scale)
      --lora-scaled /models/curator-qwen35-9b-grooming-100-r8-lora-f16.gguf:1.0

      # fixed chat template
      --jinja --chat-template-file /models/froggeric_qwen_35_36_38_chat_template.jinja

      -ngl 99
      -c 132768
      -fa on
      -np 1
      --no-mmap
      -b 2048
      -ub 2048

      # draft speculation - ngram only (NO MTP: no nextn tensors in this
      # GGUF -- would abort at load). ngram-mod window retuned 2026-08-22
      # (24/24/86 measured 13.7% draft acceptance on the plain Q4 entry).

      --spec-type ngram-mod
      --spec-ngram-mod-n-match 24
      --spec-ngram-mod-n-min 12
      --spec-ngram-mod-n-max 32

      --temp 0.6
      --top-p 0.95
      --top-k 20
      --min-p 0.0
      --presence-penalty 0.0
      --repeat-penalty 1.0
      --reasoning-format none
      --chat-template-kwargs "{\"enable_thinking\": false}"
      --timeout 900
      --host 0.0.0.0
      --port 8080
    cmdStop: docker stop q9b-cgroom

  curator-harvesting:
    unlisted: true
    cmd: |
      docker run --rm --name q9b-charvest --runtime nvidia --cap-add SYS_ADMIN
      -e CUDA_VISIBLE_DEVICES=GPU-57bbb375-a61a-6662-e9c8-447b948f0833
      -p ${PORT}:8080 -v /mnt/shared/models:/models
      # known-good image build: b9692
      --entrypoint /app/llama-server ghcr.io/mostlygeek/llama-swap:cuda
      -m /models/Qwen3.5-9B-UD-Q4_K_XL.gguf
      # this build takes --lora FNAME / --lora-scaled FNAME:SCALE (no -l, no space scale)
      --lora-scaled /models/curator-qwen35-9b-harvesting-100-r8-lora-f16.gguf:1.0

      # fixed chat template
      --jinja --chat-template-file /models/froggeric_qwen_35_36_38_chat_template.jinja

      -ngl 99
      -c 132768
      -fa on
      -np 1
      --no-mmap
      -b 2048
      -ub 2048

      # draft speculation - ngram only (NO MTP: no nextn tensors in this
      # GGUF -- would abort at load). ngram-mod window retuned 2026-08-22
      # (24/24/86 measured 13.7% draft acceptance on the plain Q4 entry).

      --spec-type ngram-mod
      --spec-ngram-mod-n-match 24
      --spec-ngram-mod-n-min 12
      --spec-ngram-mod-n-max 32

      --temp 0.6
      --top-p 0.95
      --top-k 20
      --min-p 0.0
      --presence-penalty 0.0
      --repeat-penalty 1.0
      --reasoning-format none
      --chat-template-kwargs "{\"enable_thinking\": false}"
      --timeout 900
      --host 0.0.0.0
      --port 8080
    cmdStop: docker stop q9b-charvest

    # Qwen3.8-Flash-Next UD-IQ4_XS (added 2026-08-26): 180B total / 6B active, with
    # 51B n-gram embeddings. The three GGUF shards live on /mnt/models (not the usual
    # /mnt/shared/models). Uses official llama.cpp mainline (server-cuda13) with --fit to
    # place the active MoE layers across all three GPUs; the large embedding table and
    # context KV stay host-memory/mmap-backed, so context scales to ~196K (verified
    # 2026-08-28). Do not preload this model alongside the resident models.
    # Re-pinned 2026-09-08 to the current 3-GPU set (5070 Ti d64df8cf, 5060 Ti
    # 57bbb375, 3090 93ab52e5) after the ZOTAC (af5bd53f) it used to pin returned-less;
    # validated: loads healthy at -c 196608, ~51 GiB VRAM across the three cards.
  Q3.8-FN-AC-IQ4_XS:
    # 2026-09-18: unlisted at Jim's request -- the MTP variant (Q3.8-FN-AC-IQ4XS-MTP) is
    # the one in use now. Still requestable by id; config kept for A/B reference.
    unlisted: true
    cmd: |
      docker run --rm --name qwen38-flash-next --runtime nvidia --ipc=host
      -e CUDA_VISIBLE_DEVICES=GPU-d64df8cf-c877-b43d-d9a5-d6b0e38e504a,GPU-57bbb375-a61a-6662-e9c8-447b948f0833,GPU-93ab52e5-8e61-197e-880a-aa6af5a13c74
      -p ${PORT}:8080 -v /mnt/models:/models
      --entrypoint /app/llama-server ghcr.io/ggml-org/llama.cpp:server-cuda13
      -m /models/AtomicChat-Qwen3.8-Flash-Next-IQ4/Qwen3.8-Flash-Next-AD-3.84bpw-IQ4_XS-M64-00001-of-00028.gguf
      --fit on
      # 2026-09-10 (MEASURED): with --fit-target the fit now uses ALL THREE GPUs --
      # ~50.1 GiB total at -c 196608, leaving 5060 Ti 977 MiB / 3090 2334 MiB /
      # 5070 Ti 1241 MiB free. Device order = 5070 Ti (CUDA0), 5060 Ti (CUDA1),
      # 3090 (CUDA2). Lowering the 3090 target to 512 changed nothing (used
      # 21737 -> 21757 MiB): --fit is LAYER-GRANULAR, so the next layer/experts do
      # not fit and it keeps ~2.3 GiB idle on the 3090 regardless. 1024 is therefore
      # the floor that GUARANTEES the requested >=1 GiB headroom on the 3090 (which
      # also carries the desktop). To consume the remaining 3090 slack you would
      # have to drop --fit and place layers by hand.
      --fit-target 1024,1024,1024
      --device CUDA0,CUDA1,CUDA2
      --threads 20
      --jinja --chat-template-file /models/qwen_sharp_template_oneline.jinja
      --chat-template-kwargs "{\"reasoning_effort\":\"medium\"}"
      --flash-attn on
      -c 196608
      # 2026-09-15 (MEASURED): -b 2048 -ub 512 beats the previous -b 512 -ub 256 on prefill
      # (+21% at 8k: 527->640 t/s; +22% at 32k: 483->590 t/s, TTFT 68.0->55.5 s; +20% at 98k)
      # with no decode cost. -ub 1024/2048 improve prefill slightly but collapse tg (33/24 t/s),
      # so -ub 512 is the ceiling. Loads healthy at -c 196608 (KV is preallocated at load).
      -b 2048
      -ub 512
      -ctk q8_0
      -ctv q8_0
      -np 1

      # engrams on ssd
      --load-mode none

      # draft speculation - ngram
      # Official latest llama.cpp (server-cuda13, build >=10666) -- Qwen3.8-Flash-Next
      # (qwen4exp) MODEL support merged in PR #27742, but the MTP draft graph (PR #27739)
      # is NOT in the official image, so no draft-mtp here. MTP was trialled via a patched
      # build but gave ~0 speedup (12 t/s; the 51 GiB PLE n-gram table dominates per-token
      # cost and MTP only skips transformer layers), so it was reverted. ngram fallback kept.
      --spec-type ngram-mod
      --spec-ngram-mod-n-match 24
      --spec-ngram-mod-n-min 24
      --spec-ngram-mod-n-max 86

      --reasoning-format deepseek
      --reasoning on
      --reasoning-preserve
      --temp 1.0
      --top-p 0.95
      --top-k 20
      --min-p 0.0
      --presence-penalty 0.0
      --repeat-penalty 1.0
      --timeout 900
      --host 0.0.0.0
      --port 8080
    cmdStop: docker stop qwen38-flash-next

    # MTP entry -- REBUILT + MEASURED 2026-09-18. Runs danielhanchen/llama.cpp branch
    # qwen4exp/mtp @ 53b1389d0 (its 2026-09-18 merge of upstream master) with a real MTP
    # draft, as a HOST binary.  Upstream has the qwen4exp MODEL (PR #27742, merged) but NOT
    # the MTP draft graph (PR #27739, closed unmerged), so this fork is the only path.
    #
    # WHY THE OLD "MTP gives ~0 speedup" NOTE IS WRONG: the previous version ran an image
    # built 2026-09-03, which predates five MTP commits on the branch -- notably
    # d1a92352c "speculative: only gemma4-assistant shares the target KV cache" (09-04) and
