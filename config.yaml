      -e NCCL_P2P_DISABLE=1 -e NCCL_CUMEM_ENABLE=0
      -e LD_PRELOAD=/opt/newnccl/libnccl.so.2
      -v /home/jim/llama-swap/vendor/libnccl.so.2.30.4:/opt/newnccl/libnccl.so.2:ro
