    # ISTA-DASLab GSQ-RCO Q2_0 (added 2026-09-16). Verified by parsing the downloaded
    # GGUF headers AND ISA's per-tensor allocation file: transformer 37.62 GB @ 2.394 bpw
    # (type Q2_0 = 121.06B params); shard 2 is ONE 28.80 GB tensor
    # (per_layer_token_embd @ IQ4_NL, 51.20B params). ZERO IQ1_M. Codebook share 0.65%
    # (only IQ4_XS 0.82B) vs the AtomicChat entry's ~96%.
    # WHY THIS VARIANT OVER IQ3_XXS: two independent speed axes, and Ivan measured the
    # bigger one. (1) IQ1_M has NO MMQ kernel in server-cuda13 -> the AtomicChat entry
    # runs 60.40B params (48% of its transformer) through the dequant+f16-sgemm fallback
    # on prefill. Q2_0 has zero IQ1_M. (2) codebook/i-quant share: ISTA reports 367 vs 108
    # t/s prefill between Q2_0 and IQ2_XS, BOTH of which have MMQ -- so the codebook axis
    # dominates. IQ3_XXS is IQ1_M-free but still 77% codebook; it does NOT get this win.
    # CONTEXT: 37.62 GB resident vs AtomicChat's 46.53 frees ~8.9 GB. At this model's
    # 51 KiB/token q8_0 KV (48 layers, 2 KV heads, key/value length 256) that is the
    # difference between the 196,608 VRAM ceiling and the native 262,144 cap
    # (KV 13.69 GB, ~5.5 GB expected spare). NOTE: shard 2 is a single >4 GiB tensor, so
    # --lazy-mode auto already applies; it is set explicitly to match ISA's guidance.
    # First load from /mnt/data/models is mmap-backed, so expect a slow cold start.
  Q3.8-FN-GSQ-RCO-Q2_0:
    # 2026-09-18: unlisted at Jim's request. Its MTP variant (Q3.8-FN-GSQ-RCO-Q2_0-MTP) was
    # deleted 2026-10-06; the model file is gone too. Config kept for A/B reference.
    unlisted: true
    cmd: |
      docker run --rm --name qwen38-flash-q20 --runtime nvidia --ipc=host
      -e CUDA_VISIBLE_DEVICES=GPU-d64df8cf-c877-b43d-d9a5-d6b0e38e504a,GPU-57bbb375-a61a-6662-e9c8-447b948f0833,GPU-93ab52e5-8e61-197e-880a-aa6af5a13c74
      -p ${PORT}:8080 -v /mnt/data/models:/models
      --entrypoint /app/llama-server ghcr.io/ggml-org/llama.cpp:server-cuda13
      -m /models/Qwen3.8-Flash-Next-GSQ-RCO-Q2/Qwen3.8-Flash-Next-GSQ-RCO-Q2_0-00001-of-00002.gguf
      --fit on
      --fit-target 1024,1024,1024
      --device CUDA0,CUDA1,CUDA2
      --threads 20
      --jinja --chat-template-file /models/qwen_sharp_template_oneline.jinja
      --chat-template-kwargs "{\"reasoning_effort\":\"medium\"}"
      --flash-attn on
      -c 262144
      # -b 2048 -ub 512 is the measured-best prefill pair from the AtomicChat entry
      # (2026-09-15); -ub 1024/2048 collapse tg. Kept identical for a fair A/B.
      -b 2048
      -ub 512
      -ctk q8_0
      -ctv q8_0
      -np 1

      # shard 2 (the 28.80 GB PLE table) stays on disk; rows are read on demand.
      --load-mode mmap
      --lazy-mode on

      --spec-type ngram-mod
      --spec-ngram-mod-n-match 24
      --spec-ngram-mod-n-min 24
      --spec-ngram-mod-n-max 86

      --reasoning-format deepseek
      --reasoning on
      --reasoning-preserve
      --temp 1.0
      --top-p 0.95
      --top-k 20
      --min-p 0.0
      --presence-penalty 0.0
      --repeat-penalty 1.0
      --timeout 900
      --host 0.0.0.0
      --port 8080
    cmdStop: docker stop qwen38-flash-q20



    # *** 2026-09-10 CURRENT STATE = the 180K QUICK-TEST PROFILE (authoritative; the
    # historical notes below are STALE). Runs on the 3090 (93ab52e5, 24 GiB, CUDA0 /
    # --main-gpu) + 5070 Ti (d64df8cf, 16 GiB); -c 180000, --tensor-split 1.00,0.80.
    # MEASURED at 180K/0.80: 3090 ~19.9/24.6 GiB used (~4.1 GiB free), 5070 Ti ~14.3/16.3
    # GiB used (~1.55 GiB free). MTP + ngram unchanged. Weights 22019 MiB + mmproj 889 +
    # MTP draft 1307.
    # CORRECTION 2026-09-21: "MTP draft 1307" is the draft FILE size, NOT its VRAM cost.
    # Measured on the Hemmingway entry by loading with/without -md and diffing nvidia-smi,
    # the same qwen3.8-mtp-Q4_0.gguf costs 804 MiB of VRAM total (~402 MiB per card), because
    # the draft borrows the target's embeddings and lm head so part of the file never loads.
    # BUDGET 804 MiB, NOT 1307. Also note qwen35 files carry their own nextn head, so this
    # -md is optional: dropping it frees that 804 MiB for a within-noise decode change, and
    # removes the need for this entry's draft bind mount.
    #
    # TO RESTORE THE FULL-CONTEXT (262144) PROFILE: copy
    #   config.yaml.snap-q6-262K-20260910-115747
    # back over config.yaml -- that snapshot holds -c 262144 with --tensor-split 1.00,0.65.
    # At 262144 the 5070 Ti OOMs at 1.00,0.80, so 0.65 (weighted to the 3090) is required;
    # it measured 3090 655 MiB / 5070 Ti 969 MiB free. The Meta() split is a SHARP STEP, so
    # ~655 MiB is the most 3090 headroom available at 262K (cut -ub 512->256 for more).
    #
    # Qwen3.8-27B Q6_K (added 2026-08-14): dense 27B, UD Q6_K quant (23.09 GB; dynamic
    # layout mixes Q8_0/Q5_K/Q4_K blocks + a few IQ1_S). Hybrid arch (Gated DeltaNet +
    # full attention every 4th layer) so KV cache is cheap.
    #
    # TENSOR-SPLIT (switched 2026-08-19): now -sm tensor, mirroring the validated
    # Q3.8-27B-IQ4XS entry. The old "plain Q6_K can't -sm tensor
    # (GGML_ASSERT SPLIT_AXIS_UNKNOWN)" caveat was a BUILD artifact of the b9692-era
    # image, not a property of this file -- the current mostlygeek image (>= b10362,
    # same as the IQ4_XS TP entry) tensor-splits these quants fine. Same 2-card UUID
    # pinning (MSI 5060 Ti = device0, 5070 Ti = device1), NCCL 2.30.4 LD_PRELOAD,
    # --fit off (fit is unimplemented for tensor mode), -ts 1.00,1.00 (the
    # sharp-threshold balance point from the IQ4_XS probe).
    #
    # MEMORY WARNING (NOT YET PROBED): weights are 23.09 GB vs the validated IQ4_XS's
    # 16.86 GB, ~4.9 GB/card more at 1.00,1.00 -- the 262144 ctx that loaded for IQ4_XS
    # (MSI 1545 / 5070 464 MiB free) will almost certainly NOT fit here. Probe like the
    # IQ4_XS context probe: step -c down (196608 -> 131072 -> 98304) and/or -ub 512 ->
    # 256 until graph_reserve stops OOMing on device0. The 5070 (device1) carries ~600
    # MiB of desktop and will be the wall. Realistic ceiling looks like ~64-128K.
    #
    # KV: q8_0 kept (validated with -sm tensor at b10362, and again at b11434 on the ggml-org
    # image, 2026-10-06). If a future image rejects quantized KV + tensor mode, use f16.
    # IMAGE (2026-10-06): moved from mostlygeek :cuda (b11277) to ggml-org server-cuda13
    # (b11434); same speed, 2 reps: short decode ~95 t/s, 59K prompt read ~1100 t/s,
    # decode 61.7 -> 63.9 t/s.
    #
    # MTP: VERIFIED 2026-08-16 (GGUF header parse) -- this file DOES ship the 4
    # nextn tensors (blk.64.nextn.{eh_proj,enorm,hnorm,shared_head_norm}). The
    # --spec-type draft-mtp flags below work on this file.
    #
    # Chat template: uses the shared Qwen 3.5/3.6 fixed template (Qwen3.8 inherits
    # the same template structure). If reasoning tags don't parse correctly, check
    # froggeric/Qwen-Fixed-Chat-Templates for a Qwen3.8 update.
  Q3.8-27B-Q6KM:
    cmd: |
      docker run --rm --name q38-27b --runtime nvidia --cap-add SYS_ADMIN
      --ipc=host
      # GPU re-pin (2026-09-09): moved OFF the 5060 Ti (57bbb375, 16 GiB) onto the
      # 3090 (93ab52e5, 24 GiB). CUDA0 = 3090 = --main-gpu 0, CUDA1 = 5070 Ti
      # (d64df8cf). 3090-first ordering matches the validated IQ4_XS-MTP-TP pairing.
      -e CUDA_VISIBLE_DEVICES=GPU-93ab52e5-8e61-197e-880a-aa6af5a13c74,GPU-d64df8cf-c877-b43d-d9a5-d6b0e38e504a
      -e NCCL_P2P_DISABLE=1 -e NCCL_CUMEM_ENABLE=0
      -e LD_PRELOAD=/opt/newnccl/libnccl.so.2
      -v /home/jim/llama-swap/vendor/libnccl.so.2.30.4:/opt/newnccl/libnccl.so.2:ro
      -p ${PORT}:8080 -v /mnt/data/models:/models
      --entrypoint /app/llama-server ghcr.io/ggml-org/llama.cpp:server-cuda13
      -m /models/Qwen3.8-27B-UD-Q6_K_M.gguf
      --mmproj /models/qwen3.8-mmproj-BF16.gguf

      # fixed chat template
      --jinja --chat-template-file /models/qwen_sharp_template_oneline.jinja
      --chat-template-kwargs "{\"reasoning_effort\":\"medium\"}"

      -ngl 99
      --flash-attn on
      -sm tensor
      --fit off

      -b 2048
      # 2026-09-10: RESTORED to 180000 for the operator's quick test (this is the profile
      # that ran "very nearly as fast as Q4_XS" at split 1.00,0.80). MEASURED then: 3090
      # ~19.9/24.6 GiB used (~4.1 GiB free), 5070 Ti ~14.3/16.3 GiB used (~1.55 GiB free).
      # The full-context profile is -c 262144 / split 1.00,0.65, preserved as
      # config.yaml.snap-q6-262K-20260910-115747 (at 262144 the 5070 Ti OOMs at 0.80).
      -c 240000
      -ctk q8_0
      -ctv q8_0
      --main-gpu 0
      # 1.00,0.80 (restored 2026-09-10): the 180K balance point -- an even-ish split keeps
      # both ranks doing ~equal TP work (fastest decode), which is what made this profile
      # "very nearly as fast as Q4_XS". NOTE 0.80 CANNOT hold 262144 -- the 5070 Ti OOMs at
      # that context; the 262K profile uses 1.00,0.65 (config.yaml.snap-q6-262K-20260910-115747).
      # Meta() split is a sharp step, not a dial.
      --tensor-split 1.00,0.80
      -np 1
      -ub 512

      --temp 1.0
      --top-p 0.95
      --top-k 20
      --min-p 0.0
      --presence-penalty 0.0
      --repeat-penalty 1.0

      --reasoning-format deepseek
      --reasoning-budget -1
      --reasoning on
      --reasoning-preserve

      # draft speculation - MTP + ngram
