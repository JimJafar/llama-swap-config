      -ctv q8_0
      --main-gpu 0
      --tensor-split 1.1,1
      -np 1
      -ub 512
      --temp 0.6
      --top-p 0.95
      --top-k 20
      --min-p 0.05
      --presence-penalty 0.0
      --repeat-penalty 1.0
      --reasoning-budget -1
