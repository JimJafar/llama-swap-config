  # DSpark evaluation profile (re-tuned 2026-08-04 for a FAIR A/B with the MTP entry).
  # Unlike MTP, this deliberately does NOT reserve the ZOTAC for dictation -- full GPU
  # memory on all three cards, same as the MTP entry gets. Placement: --n-cpu-moe 31
  # (experts of layers 31-42 on GPU = 12 expert layers; attention/dense of all 44 layers
  # on GPU) with split 0.37,4.1,1 (CUDA0 = 5070 Ti carries only 3 target layers + the
  # 10.14 GiB DSpark draft + output.weight; CUDA1 = ZOTAC carries 33 dense + 5 experts;
  # CUDA2 = MSI carries 7 experts). Measured GPU: 15.2/13.7/14.9 GiB (~89%).
  #
  # The MTP entry's split (4,0.3,1) does NOT transfer here: the DSpark draft is 10.14 GiB
  # vs MTP's 4.4, so CUDA0 cannot hold 34 dense layers on top of it. --override-tensor
  # output.weight=CUDA0 is REQUIRED: DSpark reuses the target's output.weight, which must
  # sit on the same device as the draft (it would otherwise land on CUDA2 per the split).
  #
  # MEASURED 2026-08-04 (warm, 131K, same prompt as the MTP benchmark): 16.59 t/s @
  # 0.589 acceptance / mean len 2.75. MTP entry (n-max 1): 16.01-16.09 t/s @ 0.815 -- a
  # dead heat; DSpark marginally ahead on this run. Original cpu-moe config measured
  # 17.02-17.53 t/s on 2026-08-03, so both drafts sit in the same ~16-17.5 band.
  #
  # Legacy notes from the original 2026-08-03 eval (kept for reference): runtime is pinned
  # because DSpark landed after b10228 and was still WIP at merge time. `--fit on` crashes
  # while measuring the dflash context (GGML_ASSERT n_graph_inputs), same as MTP -- explicit
  # placement required. No-draft control at this placement was 7.90-9.07 t/s; the 131K
