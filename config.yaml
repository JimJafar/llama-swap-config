  # ################ #
  # EMBEDDING MODELS #
  # ################ #

  bge-m3:
    unlisted: true
    cmd: |
      docker run --rm --name bge --runtime nvidia --cap-add SYS_ADMIN
      -p ${PORT}:8080 -v /mnt/shared/models:/models
      --entrypoint /app/llama-server ghcr.io/mostlygeek/llama-swap:cuda
      -m /models/bge-m3-FP16.gguf
      --host 0.0.0.0
      --port 8080
      --ctx-size 8192
      --batch-size 8192
      --rope-scaling yarn
      --rope-freq-scale 0.75
      -ngl 99
      --embeddings
      --no-mmap
    cmdStop: docker stop bge

  # Qwen3-Embedding-4B (added 2026-07-04): upgrade over bge-m3 for CODE retrieval.
  # Qwen3-Embedding is explicitly trained for code + 100 languages, tops MTEB, and is
  # vLLM-native (same ecosystem as the LLMs). 4B = quality/VRAM sweet spot on a 16GB
  # card (~8GB BF16, loads on one GPU, no TP). Use for indexing a codebase for RAG.
  # bge-m3 kept above for general multilingual dense+sparse; this one for code search.
  #
  # HARD-WON SETUP NOTES (2026-07-04):
  #  - `--runner pooling` is the embedding flag in vLLM 0.22 (the old `--task embed`
  #    is gone). It auto-configures LAST-token pooling for Qwen3-Embedding.
  #  - `--enforce-eager`: skip torch.compile/cudagraph capture. Right call for a
  #    swap-in embedder (fast start > peak throughput; a single forward pass barely
  #    benefits from cudagraphs). Without it, first start compiles for many minutes.
  #  - LOCAL PATH + HF_HUB_OFFLINE=1: point at the pre-downloaded dir, NOT the HF id.
  #    With the HF id, vLLM makes unauthenticated HF Hub calls at load that get
  #    rate-limited and HANG forever (model loads to VRAM then sits at 0% util). The
  #    model was snapshot_download'd to /mnt/shared/models/Qwen3-Embedding-4B.
  #  - Pinned to one card (device 0). Embedding needs no TP; llama-swap serves one
  #    model at a time so it has the GPU to itself. Query the OpenAI /v1/embeddings
  #    endpoint with model=qwen3-embedding-4b. NB Qwen3-Embedding wants an instruction
  #    prefix on QUERIES (not documents) for best retrieval -- that's a client concern.
  qwen3-embedding-4b:
    unlisted: true
    cmd: |
      docker run --rm --name qwen3emb --runtime nvidia --ipc=host
      -e HF_HUB_OFFLINE=1 -e TRANSFORMERS_OFFLINE=1
      -e CUDA_DEVICE_ORDER=PCI_BUS_ID -e CUDA_VISIBLE_DEVICES=0
      -e VLLM_NO_USAGE_STATS=1
      -p ${PORT}:8000 -v /mnt/shared/models:/models
      vllm/vllm-openai:latest
      --model /models/Qwen3-Embedding-4B
      --runner pooling
      --enforce-eager
      --served-model-name qwen3-embedding-4b
      --max-model-len 8192
      --gpu-memory-utilization 0.60
      --host 0.0.0.0
      --port 8000
    cmdStop: docker stop qwen3emb

  # ############### #
  # DICTATION       #
  # ############### #
  # Speech-to-text dictation pipeline (added 2026-07-26; ASR moved to the NPU 2026-08-04).
  # Capture (ASR on the NPU) + cleanup (LLM on the ZOTAC) kept RESIDENT TOGETHER via the
  # `dictation` group (swap:false; defined at the bottom of this file) so a capture ->
  # cleanup round trip never unloads/reloads between steps.
  #
  # ASR now runs ENTIRELY on the Core Ultra 7 265KF's NPU (13 TOPS) via OpenVINO GenAI's
  # static WhisperPipeline -- NO GPU, so the ASR leg works even while 3-GPU --fit models
  # hold GPU 0. Cleanup (qwen-clean-2b) is the only dictation member left on the ZOTAC.
  #
  # FLOW: POST /v1/audio/transcriptions (model=whisper-npu-asr) -> transcript
  #    -> POST /v1/chat/completions   (model=qwen-clean-2b) -> clean text.
  # llama-swap routes each request by its `model` field; the group keeps both loaded.
  #
  # --- ASR: distil-whisper/distil-medium.en (int8) on the Intel NPU --------------------
  # Added 2026-08-04 (replaces parakeet-asr as the primary dictation ASR). ~1.5s per clip
  # (fixed 30s-window encoder floor; still faster than real-time), WER closest to Parakeet
  # of the NPU options (~2% vs ~1.4% on LibriSpeech test-clean). Server: npu/asr_server.py
  # (FastAPI, OpenAI /v1/audio/transcriptions) over ov_genai.WhisperPipeline(device="NPU",
  # static). Export recipe + decoder patcher + full benchmark matrix: npu/README.md.
  # LD_LIBRARY_PATH is REQUIRED -- the rootless NPU Level Zero driver lives in the venv's
  # openvino/libs dir (the loader does not self-locate).
  whisper-npu-asr:
    checkEndpoint: /health
    env:
      - LD_LIBRARY_PATH=/home/jim/npu-env/lib/python3.13/site-packages/openvino/libs
    cmd: |
      # SIGTERM on unload is clean (uvicorn shuts down); no cmdStop needed.
      /home/jim/npu-env/bin/python /home/jim/llama-swap/npu/asr_server.py --port ${PORT}
      --model-dir /mnt/shared/models/distil-medium.en-npu

  # --- ASR FALLBACK: NVIDIA Parakeet TDT 0.6B (ONNX) via achetronic/parakeet ------------
  # Kept OUT of the dictation group since 2026-08-04: it needs the ZOTAC (GPU 0), which
  # defeats the NPU ASR's GPU-freedom. Load on demand (model=parakeet-asr) if the NPU
  # server is down or its quality gap matters. OpenAI-compatible, English, lowest WER of
  # all ASR options. The :latest-cuda image SHIPS the model built in (fp32 ~2.5 GB); pass
  # `language=en` per request. Server listens on :5092.
  parakeet-asr:
    checkEndpoint: none
    unlisted: true
    cmd: |
      docker run --rm --name parakeet --runtime nvidia
      -e CUDA_VISIBLE_DEVICES=GPU-af5bd53f-a1ca-d807-1ae2-7f5ef261fe1a
      -p ${PORT}:5092
      ghcr.io/achetronic/parakeet:latest-cuda
    cmdStop: docker stop parakeet

  # (gemma-clean-e4b / gemma-clean-e2b removed 2026-07-26: superseded by qwen-clean-2b,
  #  which matches their quality ~40x faster. GGUFs deleted from /mnt/shared/models.)

  # --- CLEANUP C: Qwen3.5-2B instruct, thinking OFF -- fast cleanup (added 2026-07-26) --
  # ~134ms/cleanup at ~90 tok/s; matches gemma-clean-e4b quality on the four dictation
  # behaviours but ~40x faster. enable_thinking:false is ESSENTIAL -- with thinking on, the
  # answer goes into reasoning_content and `content` returns empty. Used by baruch-server
  # (BARUCH_CLEANUP_MODEL). See baruch docs/eval-cleanup.md.
  qwen-clean-2b:
    cmd: |
      docker run --rm --name qclean-2b --runtime nvidia --cap-add SYS_ADMIN
      -e CUDA_VISIBLE_DEVICES=GPU-af5bd53f-a1ca-d807-1ae2-7f5ef261fe1a
      -p ${PORT}:8080 -v /mnt/shared/models:/models
      # known-good image build: b9692
      --entrypoint /app/llama-server ghcr.io/mostlygeek/llama-swap:cuda
      -m /models/Qwen3.5-2B-UD-Q4_K_XL.gguf
      --jinja --chat-template-file /models/qwen_35_36_chat_template.jinja
      --chat-template-kwargs "{\"enable_thinking\": false}"
      -ngl 99
      -c 16384
      -fa on
      -np 1
      --temp 0.3
      --top-p 0.95
      --top-k 64
      --min-p 0.0
      --host 0.0.0.0
      --port 8080
    cmdStop: docker stop qclean-2b

# ############################################################################## #
# GROUPS                                                                          #
#   `dictation`: keep ASR (NPU) + cleanup LLM (ZOTAC) resident together.         #
#     swap:false       -> members coexist; capture <-> cleanup never unloads.     #
#     exclusive:false  -> does NOT evict your other (ungrouped) models.           #
#     persistent:true  -> kept resident once loaded; a big-model load can't evict #
#                         it (enables coexistence). Loads on 1st request, not boot #
#   COEXISTENCE: whisper-npu-asr is GPU-free (runs on the NPU). qwen-clean-2b      #
#   sits on GPU 0 (ZOTAC), which the 3-GPU --fit models (laguna-s-2.1 /            #
#   qwen3.5-122B / Qwen3.6-27B-Q8) ALSO use -- don't run those concurrently with  #
#   CLEANUP, or GPU 0 will OOM (the NPU ASR still works). The 2-GPU entries       #
#   (vLLM TP + the -sm tensor TP entry, pinned to idx 1,2) coexist with it fine.   #
# ############################################################################## #
groups:
  "dictation":
    swap: false
    exclusive: false
    persistent: true
    members:
      - whisper-npu-asr
      - qwen-clean-2b
