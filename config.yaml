# llama-swap runs as a host binary (llama-swap-bin AUR) and launches each model
# as a docker container. llama.cpp models use the bundled mostlygeek image with
# the entrypoint overridden to /app/llama-server; the vLLM model uses the vllm
# image. ${PORT} is assigned by llama-swap and published from the container; the
# server inside always listens on its own fixed port. cmdStop stops the named
# container cleanly on swap so VRAM is freed.
#
# Shared docker flags for llama.cpp models:
#   --runtime nvidia --cap-add SYS_ADMIN  (matches the previously-working setup)
#   --entrypoint /app/llama-server        (image entrypoint is llama-swap)
#
# Max seconds to wait for a model to become ready after launch. Raised from the 120s
# default for the vLLM entry (qwen36-nvfp4), which takes ~180s to load + capture graphs.
healthCheckTimeout: 300

# Qwen 3.5/3.6 jinja template fix
#
# The fixed template comes from here: https://huggingface.co/froggeric/Qwen-Fixed-Chat-Templates/blob/main/README.md
#
# All Qwen 3.5 and 3.6 variants should have `--jinja --chat-template-file /models/qwen_35_36_chat_template.jinja`
# (llama.cpp). The .jinja file must live in the MOUNTED models dir (/mnt/shared/models on the host,
# which is bind-mounted to /models in every container) -- a host-side repo path is invisible inside
# the container. For the vLLM entry the flag is `--chat-template <path>` instead (no --jinja).
#
# The Thinking Toggle
#
# You can control the model reasoning behavior. Insert `<|think_on|>` or `<|think_off|>` anywhere in your system or user prompt. The template intercepts the tag, removes it from the final context so the model never sees it, and flips the reasoning mode instantly.
#
# **Fast answer, no reasoning:**
# ```text
# System: You are a coding assistant. <|think_off|>
# User: What's 2+2?
# ```
#
# **Deep reasoning:**
# ```text
# System: You are a coding assistant. <|think_on|>
# User: Implement a red-black tree in Rust.
# ```
# *(The tag syntax uses Qwen's control token delimiters to guarantee it will never collide with legitimate text or file paths, unlike earlier community templates that used `/think`)*
#
# Token Saving (Stripping past thoughts):
#
# By default, this template **preserves** all past `<think>` blocks in the chat history. This prevents the model from suffering "amnesia stalls" during complex agentic loops, and it mathematically guarantees a 100% Prefix KV Cache hit rate on local inference engines.
#
# If you are running constrained hardware and need to save context tokens, you can explicitly disable this feature in your engine's template kwargs to automatically strip past thoughts:
# ```json
# {
#   "preserve_thinking": false
# }
# ```
# *(Note: Setting this to false will reduce your KV Cache hit rate during multi-turn chats because the prompt string will dynamically mutate).*

models:

  # ########### #
  # QWEN MODELS #
  # ########### #

  qwen3.6-35B-Q4:
    # MoE + MTP (2026-06-12): ~119 -> ~168 t/s decode (+41%) via the MTP-enabled GGUF
    # (Qwen3.6-35B-A3B-UD-Q4_K_M-MTP.gguf from unsloth/Qwen3.6-35B-A3B-MTP-GGUF) plus
    # --spec-type draft-mtp. Fastest model here, ~3x the vLLM 27B; n-max 2 per Unsloth
    # docs. The non-MTP GGUF (...-Q4_K_M.gguf) is kept on disk as fallback.
    cmd: |
      docker run --rm --name q35b --runtime nvidia --cap-add SYS_ADMIN
      -p ${PORT}:8080 -v /mnt/shared/models:/models
      --entrypoint /app/llama-server ghcr.io/mostlygeek/llama-swap:cuda
      -m /models/Qwen3.6-35B-A3B-UD-Q4_K_M-MTP.gguf

      # fixed chat template
      --jinja --chat-template-file /models/qwen_35_36_chat_template.jinja

      --spec-type draft-mtp
      --spec-draft-n-max 2
      --fit on
      --fit-ctx 128000
      --fit-target 256
      -np 1
      -fa on
      --no-mmap
      --mlock
      -b 2048
      -ub 2048
      -ctk q8_0
      -ctv q8_0
      --temp 0.6
      --top-p 0.95
      --top-k 20
      --min-p 0.0
      --presence-penalty 0.0
      --repeat-penalty 1.0
      --reasoning-format none
      --reasoning-budget -1
      --chat-template-kwargs "{\"preserve_thinking\": true}"
      --timeout 900
      --host 0.0.0.0
      --port 8080
    cmdStop: docker stop q35b
  Qwen3.6-27B-Q5-MTP:
    cmd: |
      docker run --rm --name q27mtp --runtime nvidia --cap-add SYS_ADMIN
      -p ${PORT}:8080 -v /mnt/shared/models:/models
      --entrypoint /app/llama-server ghcr.io/mostlygeek/llama-swap:cuda
      -m /models/Qwen3.6-27B-UD-Q5_K_XL.gguf

      # fixed chat template
      --jinja --chat-template-file /models/qwen_35_36_chat_template.jinja

      -ngl 99
      --flash-attn on

      # ngram-mod removed 2026-06-12: silently off at -np 1, and benchmarked as a
      # no-op vs draft-mtp alone on fresh generation (only helps repetitive/echoing
      # tasks, which would need -np 2 and halve context). draft-mtp gives +50%.
      --spec-type draft-mtp
      --spec-draft-n-max 3

      # --spec-draft-p-min 0.75
      # --cache-type-k-draft q5_0
      # --cache-type-v-draft q5_0

      # --kv-unified
      -b 2048
      -c 142000
      -ctk q8_0
      -ctv q8_0
      --main-gpu 0
      --tensor-split 1,1
      -np 1
      -ub 512
      --temp 0.6
      --top-p 0.95
      --top-k 20
      --min-p 0.05
      --presence-penalty 0.0
      --repeat-penalty 1.0
      --reasoning-format none
      --reasoning-budget -1
      --chat-template-kwargs "{\"preserve_thinking\": true}"
      --timeout 900
      --host 0.0.0.0
      --port 8080
    cmdStop: docker stop q27mtp
  # --- TENSOR-PARALLEL variant of Qwen3.6-27B-Q5-MTP (added 2026-06-08) ---
  # A/B against Qwen3.6-27B-Q5-MTP. Real tensor parallelism via `-sm tensor` (the
  # non-deprecated TP mode; `-sm row` is deprecated). Measured FASTER than the
  # layer-split prod entry: ~39.5 vs ~35 tok/s decode (Q5_K_XL, +MTP, 2x16GB).
  # RE-MEASURED 2026-07-03 on the Z890 (both GPUs CPU-attached Gen5 x8/x8, riser
  # gone): prefill 147 -> 1200+ t/s (~8x, was interconnect-bound), decode 39.5 ->
  # 47-59 t/s. Old prefill-bound tuning notes below (the -c OOM-under-prefill
  # ceiling especially) are stale and worth re-probing on this board.
  #
  # Why the extra docker flags (full story in README "Tensor parallelism"):
  #  - The image's bundled NCCL 2.25.1 has a broken sm_120 (RTX 50-series) kernel
  #    launch, so `-sm tensor` aborts at the first all-reduce with
  #    "Cuda failure 1 'invalid argument'". Preloading NCCL 2.30.4 fixes it.
  #    This was the real blocker -- NOT the no-P2P topology and NOT the driver.
  #  - --ipc=host lifts Docker's 64 MB /dev/shm cap so NCCL's SHM transport works
  #    (the two GPUs have no P2P; NCCL connects via SHM/direct).
  #  - --fit off: llama_params_fit is not implemented for SPLIT_MODE_TENSOR.
  # Fit note (post-riser): device1 = 5070 Ti holds the desktop + draft ctx and fills
  # first; raise the 1st tensor-split number to relieve it (NOT 1,1.2). Keep -c well
  # below the VRAM-fill point -- ~185k loads but OOMs under prefill. See inline below.
  # Vendored lib (vendor/libnccl.so.2.30.4) is git-ignored; refetch with:
  #   pip download --no-deps nvidia-nccl-cu12  (then unzip the wheel)
  Qwen3.6-27B-Q5-MTP-TP:
    cmd: |
      docker run --rm --name q27mtptp --runtime nvidia --cap-add SYS_ADMIN
      --ipc=host
      # Was CUDA_DEVICE_ORDER=PCI_BUS_ID, but the Z890 board (2026-07-03) swapped the
      # PCI order (01:00 is now the 5070 Ti), flipping device0/1 and piling the bigger
      # split + --main-gpu 0 + desktop onto the 5070 -> OOM at load. Pin by UUID
      # instead (5060 Ti first = device0), board-independent:
      -e CUDA_VISIBLE_DEVICES=GPU-57bbb375-a61a-6662-e9c8-447b948f0833,GPU-d64df8cf-c877-b43d-d9a5-d6b0e38e504a
      -e NCCL_P2P_DISABLE=1 -e NCCL_CUMEM_ENABLE=0
      -e LD_PRELOAD=/opt/newnccl/libnccl.so.2
      -v /home/jim/llama-swap/vendor/libnccl.so.2.30.4:/opt/newnccl/libnccl.so.2:ro
      -p ${PORT}:8080 -v /mnt/shared/models:/models
      --entrypoint /app/llama-server ghcr.io/mostlygeek/llama-swap:cuda
      -m /models/Qwen3.6-27B-UD-Q5_K_XL.gguf

      # fixed chat template
      --jinja --chat-template-file /models/qwen_35_36_chat_template.jinja

      -ngl 99
      --flash-attn on
      -sm tensor
      --fit off
      # ngram-mod removed 2026-06-12: silently off at -np 1, and benchmarked as a
      # no-op vs draft-mtp alone on fresh generation (only helps repetitive/echoing
      # tasks, which would need -np 2 and halve context). draft-mtp gives +50%.
      --spec-type draft-mtp
      --spec-draft-n-max 3
      -b 2048
      # -c: filling VRAM toward ~90% (~175k -> 89/96) OOMs under a real prefill load;
      # backed off to a conservative 80000 for headroom (2026-06-11).
      -c 175000
      -ctk q8_0
      -ctv q8_0
      --main-gpu 0
      # device0,device1 = 5060 Ti, 5070 Ti (pinned by UUID above; PCI addrs changed on Z890).
      # The split only BALANCES the pair: 5070 = device1 is overhead-bound (desktop +
      # draft ctx) so it barely moves; the 5060 is hypersensitive, so step it gently.
      # -c is what adds total VRAM: KV lands on both cards by this ratio, filling the
      # 5070 headroom the split can't reach. NOTE: filling to ~90% (~185k -> 89/96) is
      # NOT stable -- it OOMs on a long-context prefill, hence the conservative -c above.
      # Tune: 5070 hotter or draft OOMs -> raise 1st num; 5060 hotter -> lower it.
      --tensor-split 1.01,1
      -np 1
      -ub 512
      --temp 0.6
      --top-p 0.95
      --top-k 20
      --min-p 0.05
      --presence-penalty 0.0
      --repeat-penalty 1.0
      --reasoning-format none
      --reasoning-budget -1
      --chat-template-kwargs "{\"preserve_thinking\": true}"
      --timeout 900
      --host 0.0.0.0
      --port 8080
    cmdStop: docker stop q27mtptp
  # --- Qwen3.6-27B Q6 @ 128K: ABANDONED 2026-06-26 (do not retry on 32 GB VRAM) ---
  # Goal was "highest quant @ 128K @ >=30 t/s". Q6 is a dead end on 2x16 GB; the win
  # over Q5_K_XL is sub-0.1% KLD (flat tail) and not worth the VRAM fight. Evidence:
  #  - MTP lives in unsloth/Qwen3.6-27B-MTP-GGUF (NOT the plain ...-GGUF repo, which
  #    ships nextn-stripped, block_count=64). Match the -MTP-GGUF naming like the 35B.
  #  - Plain Q6_K (22.9 GB, MTP) + `-sm tensor` -> GGML_ASSERT SPLIT_AXIS_UNKNOWN crash.
  #    Tensor-split only works on UD quants (they keep key tensors at higher precision);
  #    plain quants can't be tensor-split for this hybrid (qwen35) arch.
  #  - Plain Q6_K + LAYER-split @128K: loads (split 1.3,1, -ub 256) but VRAM is at the
  #    ceiling (dev0 ~670 MiB free). Decode looked OK (~31 t/s on an empty prompt) but
  #    PREFILL THRASHES as KV grows: 63 -> 32 -> 21 t/s over the first 6 K tokens
  #    (super-linear), so a 31 K prompt ~25 min. Unusable for long context.
  #  - UD-Q6_K_XL (26 GB) tensor-splits fine but overflows the 128K fit (~0.6 GB over).
  # Net: Q5_K_XL (UD, tensor-split, 147 t/s prefill / 39.5 t/s decode, headroom, MTP)
  # is the ceiling on 32 GB. Only MORE VRAM unlocks Q6@128K; the 64 GB RAM does NOT
  # (dense weights are VRAM-bound, not RAM-offloadable). Q6's only viable niche here
  # would be REDUCED context (~48-64 K) via UD-Q6_K_XL tensor-split -- not pursued.
  # --- vLLM NVFP4 + MTP (WORKS as of 2026-06-11; see README "RESOLVED: NVFP4 + MTP via vLLM") ---
  # RE-BENCHMARKED 2026-07-03 on the Z890 (both cards CPU-attached Gen5 x8, riser gone):
  # single-stream 55->60 tok/s (MTP), and batched PEAK 355->462 tok/s at 32 concurrent
  # (separate config: --max-num-seqs 32, no MTP) -- the Gen5 interconnect helps batched
  # most, since batched all-reduce payloads are large/bandwidth-bound. Single-stream now
  # marginally beats the llama.cpp -sm tensor TP entry (47-59); vLLM still only wins
  # DECISIVELY under concurrency. For a batched serving profile, clone this with
  # --max-num-seqs 32 and drop --speculative-config (MTP + heavy batching don't combine).
  # Uses the vllm/vllm-openai image (NOT mostlygeek) and the local 19 GB model at vllm-direct/.
  # Gotchas baked in: --language-model-only (checkpoint is declared multimodal), the MTP
  # method is "qwen3_next_mtp" (not "mtp"), util 0.85 clears the 5070 desktop on vLLM's
  # startup memory pre-check. Slow start (~130s) -> relies on healthCheckTimeout (top).
  # DEVICE ENV: MUST use integer indices, NOT UUIDs -- vLLM v0.22.0's model-inspection
  # subprocess crashes (exit 1, "architecture failed to be inspected") on UUID-format
  # CUDA_VISIBLE_DEVICES. That's fine here: vLLM TP=2 is SYMMETRIC (each card holds half
  # of every layer), so unlike the llama.cpp -sm tensor entry it carries no tuned split
  # that depends on WHICH card is device0. (On Z890 device0 = 5070 Ti; moot for TP.)
  qwen36-nvfp4:
    cmd: |
      docker run --rm --name qwen36nvfp4 --runtime nvidia --ipc=host
      -e CUDA_DEVICE_ORDER=PCI_BUS_ID -e CUDA_VISIBLE_DEVICES=0,1
      -e NCCL_P2P_DISABLE=1 -e NCCL_SHM_DISABLE=0 -e NCCL_IB_DISABLE=1 -e NCCL_CUMEM_ENABLE=0
      -e PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True -e VLLM_NO_USAGE_STATS=1
      -p ${PORT}:8000 -v /mnt/shared/models:/models
      vllm/vllm-openai:v0.22.0
      --model /models/vllm-direct/Qwen3.6-27B-Text-NVFP4-MTP

      # fixed chat template (vLLM uses --chat-template, NOT llama.cpp's --jinja/--chat-template-file)
      --chat-template /models/qwen_35_36_chat_template.jinja

      --served-model-name qwen36-nvfp4
      --tensor-parallel-size 2
      --max-model-len 32768
      --max-num-seqs 1
      --gpu-memory-utilization 0.85
      --disable-custom-all-reduce
      --trust-remote-code
      --language-model-only
      --speculative-config "{\"method\":\"qwen3_next_mtp\",\"num_speculative_tokens\":1}"
      --host 0.0.0.0
      --port 8000
    cmdStop: docker stop qwen36nvfp4
  # Qwen3-Coder-Next (added 2026-06-24): MoE RAM-OFFLOAD experiment. 80B total / 3B
  # active (512 experts, 10 + 1 shared), hybrid Gated DeltaNet + Gated Attention, 48
  # layers, 256K native ctx. unsloth Q4_K_M (~50 GB) does NOT fit 32 GB VRAM, so
  # experts spill to system RAM via --n-cpu-moe. THIS is the offload test: only 3B
  # active => ~1.7 GB/tok read from RAM at Q4, so the DDR5-bandwidth ceiling is ~30 t/s
  # (faster as more experts stay on GPU). If RAM gets tight, drop to Q3_K_M (38.3 GB,
  # ~10 GB to RAM) -- comfortable fallback. Q5_K_M (56.8 GB) needs the 64 GB RAM upgrade.
  #
  # NEW ARCH -- needs a llama.cpp build with the Qwen3-Next (Gated DeltaNet) operators,
  # so this uses the ggml-org image (newer than mostlygeek b9544), NOT the TP image.
  # If it dies with "unknown architecture" / unknown op, bump the tag to the newest
  # ghcr.io/ggml-org/llama.cpp:server-cuda13-bNNNN. No NCCL in this image => NO -sm
  # tensor; that's fine, this run is layer-split + CPU expert offload, not TP.
  #
  # --n-cpu-moe N = experts of the top N (of 48) layers live in RAM. Start 24, then
  # LOWER until VRAM is ~90% full without OOM -- lower = more experts on GPU = faster
  # AND less RAM used (both goals align); raise it if you OOM. ~24 puts ~21 GB in RAM.
  # TWO KNOBS: A in --tensor-split = CUDA0 = 5070 Ti (raise A -> shift load 5060->5070,
  # for BALANCE -- aim both cards ~80%, under the ~85% prefill-OOM line); --n-cpu-moe =
  # RAM<->GPU (lower -> more experts on GPU = SPEED). Rebalance first, then chase speed.
  # --threads 12 was key (loader defaulted to 4/20 -> CPU expert math was throttled).
  #
  # TUNED 2026-06-25 (final): --n-cpu-moe 26, --tensor-split 2.75,1, -c 131072 ->
  # 5060 80% / 5070 82%, ~30-35 t/s gen, ~300 t/s prefill, FULL 128K context. (First
  # boot was ~3 t/s before balancing + threads. For MAX SPEED over context, the 32K
  # variant --n-cpu-moe 24 + --tensor-split 2.5,1 gave ~40 t/s.) 128K is cheap here:
  # only the 12 Gated-Attention layers carry KV (2 KV-heads x 256, q8_0) ~= ~1.5 GB even
  # at 128K; the 36 DeltaNet layers add ~nothing and -ub 512 bounds prefill buffers.
  # CAVEAT: a near-full 128K prompt takes ~7 min to prefill at 300 t/s (one-time per
  # context; KV is cached between turns).
  #
  # MTP TESTED 2026-06-24: this GGUF has NO MTP layers (unsloth stripped the nextn
  # tensors) -> draft-mtp fails at load ("model doesn't contain MTP layers"). Off the
  # table unless a quant/repo ships them, or a separate -md draft GGUF appears.
  # mmap kept ON (no --no-mmap/--mlock): ~20 GB of experts in page cache; mlock'ing that
  # much can trip the container memlock ulimit (--no-mmap untried, minor perf). -fa on;
  # if it errors on the Gated Attention layers, try -fa auto or off. Filename: point -m
  # at the real file; if unsloth split it into shards, use -00001-of-0000N.gguf first.
  qwen3-coder-next-Q4:
    cmd: |
      docker run --rm --name qcodernext --runtime nvidia --cap-add SYS_ADMIN
      -p ${PORT}:8080 -v /mnt/shared/models:/models
      --entrypoint /app/llama-server ghcr.io/ggml-org/llama.cpp:server-cuda13-b9692
      -m /models/Qwen3-Coder-Next-Q4_K_M.gguf
      -ngl 99
      --n-cpu-moe 26
      --threads 12
      -c 131072
      --tensor-split 2.75,1
      # MTP: NOT in this GGUF -- unsloth's Qwen3-Coder-Next-Q4_K_M was converted
      # without the MTP layers ("model doesn't contain MTP layers", 2026-06-24). Would
      # need a quant/repo that includes the nextn tensors, or a separate -md draft GGUF.
      # --spec-type draft-mtp
      # --spec-draft-n-max 2
      -np 1
      -fa on
      -b 2048
      -ub 512
      -ctk q8_0
      -ctv q8_0
      # repo recommends temp 1.0; lower to ~0.7 for more deterministic code.
      --temp 1.0
      --top-p 0.95
      --top-k 40
      --min-p 0.0
      --presence-penalty 0.0
      --repeat-penalty 1.0
      --timeout 900
      --host 0.0.0.0
      --port 8080
    cmdStop: docker stop qcodernext

  # Qwen3.5-122B-A10B (added 2026-06-25): the BIG sibling of qwen3-coder-next -- SAME
  # hybrid arch (Gated DeltaNet + Gated Attention + MoE, 64 layers, MTP-trained), so
  # the same ggml-org b9570 image and the same tuning playbook apply. 122B total / 10B
  # active, 256 experts (8 routed + 1 shared). unsloth UD-IQ3_XXS (44.7 GB single file)
  # = the sweet-spot quant per unsloth's KLD benchmarks (Q2->Q3 is the big quality jump;
  # Q3->Q4 marginal). Fits CURRENT 32 GB RAM: ~26 GB GPU + ~19 GB RAM, ~13 GB headroom.
  #
  # TWO VALIDATED PROFILES (2026-06-25), both 6/6 needle recall, GPU mem rock-solid:
  #  * 128K ctx (ACTIVE below): --n-cpu-moe 28, --tensor-split 2.5,1, -ub 256, -c 131072
  #    -> 5060 86% / 5070 78%, 147 t/s prefill, 37 t/s gen.
  #  * 32K ctx (max speed): --n-cpu-moe 22, --tensor-split 2,1, -ub 512, -c 32768
  #    -> 5060 94% / 5070 92%, 277 t/s prefill, 41 t/s gen.
  # MTP WORKS on this GGUF (unlike Coder-Next, the nextn tensors were KEPT) -- --spec-type
  # draft-mtp below is what makes these speeds (plain 10B-active offload would be ~15-22).
  # Sampling below is a generic Qwen3 non-thinking default; adjust per the model card.
  #
  # THE CONSTRAINT HERE IS SYSTEM RAM, NOT VRAM. ~16-24 GB of the model lives in RAM, so:
  #  - PUSH the GPUs to ~90% like any other config (LOW --n-cpu-moe). That's safe AND it
  #    shrinks the RAM footprint -- both goals align. VRAM % was never the problem.
  #  - KEEP mmap (NO --no-mmap on 32 GB at 128K!). --no-mmap hard-allocated ~24 GB of
  #    experts -> 93% RAM -> swap-thrash -> system lag -> 5060 fell off the PCIe bus
  #    (driver watchdog). mmap keeps RAM-resident experts as EVICTABLE page cache (shows
  #    as buff/cache, not "used") so RAM can't thrash. Watch `free -h` SWAP, not VRAM %.
  #    --no-mmap MEASURED (2026-06-25, 32K profile): prefill 277 -> 600 t/s (+117%!),
  #    gen 41 -> 42 (mmap page-faults crush PREFILL on the offloaded experts; decode is
  #    cache-warm so ~unaffected). Stable at 80% RAM on the 32K profile (n22, ~15 GB in
  #    RAM). NOT safe at 128K (n28, ~19 GB -> ~90% RAM = crash zone) until 64 GB.
  #  - Knobs: --n-cpu-moe = RAM<->GPU/SPEED (lower = more on GPU = faster + less RAM,
  #    until a card OOMs); --tensor-split A,B = balance (A = CUDA0 = 5070 Ti; LOWER A ->
  #    shift load to 5060). Both profiles PREFILL-VALIDATED with a 31K NIAH prompt (see
  #    test-30K.md): GPU mem rock-solid, 6/6 recall at all depths incl. the middle.
  #  - GOING TO 128K: the killer isn't KV/weights, it's the PROMPT-PROCESSING COMPUTE
  #    BUFFER -- it grows with context and must fit on device 0 (5070), failing with
  #    "graph_reserve: failed to allocate compute pp buffers" even when weights/KV fit.
  #    Fix = LOWER -ub (512->256 ~halves it) + raise --n-cpu-moe for room. NOT a split
  #    problem -- no ratio fits if total VRAM is short. (-ub 256 also drops prefill
  #    277->147 t/s; a FULL 128K prefill is then ~15 min, fine for typical prompts.)
  # 64 GB RAM: the real win is --no-mmap AT 128K = ~2x prefill (a full 128K ingest drops
  # from ~15 min to ~4) on long-context work, the one thing 32 GB can't safely give.
  # NOT higher quants -- those TANK speed (Q4_K_S ~62% in RAM -> ~18-22 t/s vs IQ3's 37,
  # for a marginal KLD gain per unsloth's curve). IQ3_XXS is the sweet spot; keep it.
  qwen3.5-122B-IQ3-MTP:
    cmd: |
      docker run --rm --name q122b --runtime nvidia --cap-add SYS_ADMIN
      -p ${PORT}:8080 -v /mnt/shared/models:/models
      --entrypoint /app/llama-server ghcr.io/ggml-org/llama.cpp:server-cuda13-b9692
      -m /models/Qwen3.5-122B-A10B-UD-IQ3_XXS.gguf

      # fixed chat template
      --jinja --chat-template-file /models/qwen_35_36_chat_template.jinja

      -ngl 99
      --n-cpu-moe 28
      --threads 12
      -c 131072
      --tensor-split 2.5,1
      # MTP: TESTING -- Jim reports this is an MTP model. If load fails with "model
      # doesn't contain MTP layers" (like Coder-Next), comment these two out + drop
      # --n-cpu-moe back toward 30. If it loads, big win (10B active is slow, MTP helps).
      --spec-type draft-mtp
      --spec-draft-n-max 2
      -np 1
      -fa on
      -b 2048
      -ub 256
      -ctk q8_0
      -ctv q8_0
      --temp 0.7
      --top-p 0.8
      --top-k 20
      --min-p 0.0
      --presence-penalty 0.0
      --repeat-penalty 1.0
      --reasoning-format none
      --timeout 900
      --host 0.0.0.0
      --port 8080
    cmdStop: docker stop q122b


  # ############ #
  # GEMMA MODELS #
  # ############ #


  # NB: no `-sm tensor` gemma entry -- gemma TP+MTP crashes (GGML_ASSERT, tensor-split
  # can't allocate the MTP graph on gemma's shared-KV arch) and TP-no-MTP (35.8 t/s) loses
  # to layer-split+MTP below (64.3 t/s). Use gemma-4-31B-Q4-MTP; don't re-add a TP variant.
  # gemma-4-31B-Q4-QAT + MTP assistant (added 2026-06-09). Measured ~30 -> ~50 tok/s
  # decode (~1.68x), ~61-63% draft acceptance.
  #
  # Why a DIFFERENT image (ggml-org, not mostlygeek): the MTP draft is a separate
  # `gemma4-assistant` model (arch new in llama.cpp >= 9570). mostlygeek's newest is
  # only b9544, so it can't load the assistant yet. The ggml-org image is pinned to
  # b9692 (bumped from b9570 on 2026-06-26 to pick up recurrent/SWA prompt-cache
  # checkpoint fixes -- PRs #19747/#19849/#19877/#19924/#20087 -- that affect the Qwen
  # Gated-DeltaNet hybrids; see the qwen3-coder-next / qwen3.5-122B entries).
  # Its entrypoint is already /app/llama-server. Caveat: it ships NO NCCL, so it
  # CANNOT do `-sm tensor` TP -- that path stays on the mostlygeek image. When
  # mostlygeek ships >= b9692, this can move back to it (keeps NCCL + MTP in one image).
  #
  # MTP wiring: -md <assistant> + --spec-type draft-mtp; the assistant has
  # nextn_predict_layers=4 so --spec-draft-n-max 4. -c trimmed to 65536 and
  # --tensor-split eased to 1.3,1 to leave the 5070 Ti room for the draft alongside
  # the main model. If the 5070 OOMs, lower -c further or pin the draft to the 5060
  # with `-devd CUDA1`.
  gemma-4-31B-Q4-MTP:
    cmd: |
      docker run --rm --name g31mtp --runtime nvidia --cap-add SYS_ADMIN
      -p ${PORT}:8080 -v /mnt/shared/models:/models
      --entrypoint /app/llama-server ghcr.io/ggml-org/llama.cpp:server-cuda13-b9692
      -m /models/gemma-4-31B-it-qat-UD-Q4_K_XL.gguf
      -md /models/gemma-4-31B-it-qat-assistant-MTP-Q8_0.gguf
      --spec-type draft-mtp
      --spec-draft-n-max 4
      -ngl 99
      -ngld 99
      -c 75536
      --tensor-split 1.3,1
      -np 1
      -fa on
      --no-mmap
      --mlock
      -b 2048
      -ub 256
      -ctk q8_0
      -ctv q8_0
      --temp 0.6
      --top-p 0.95
      --top-k 64
      --min-p 0.0
      --presence-penalty 0.0
      --repeat-penalty 1.0
      --reasoning-budget -1
      --chat-template-kwargs "{\"preserve_thinking\": true}"
      --timeout 900
      --no-context-shift
      --ctx-checkpoints 128
      --host 0.0.0.0
      --port 8080
    cmdStop: docker stop g31mtp

  # MoE + MTP (2026-06-12): ~140 -> ~184 t/s decode (+30%) — the fastest model here.
  # gemma-4-26B-A4B MoE (qat UD-Q4_K_XL) + its separate MTP draft, both from
  # unsloth/gemma-4-26B-A4B-it-qat-GGUF. ggml-org image (gemma MTP needs the newer
  # build). NO --swa-full -- gemma's iSWA would OOM with it (dual KV cache). The dense
  # gemma-4-31B-Q4-MTP above stays for higher coding quality; this is the speed pick.
  gemma-4-26B-MoE-MTP:
    cmd: |
      docker run --rm --name g26moe --runtime nvidia --cap-add SYS_ADMIN
      -p ${PORT}:8080 -v /mnt/shared/models:/models
      --entrypoint /app/llama-server ghcr.io/ggml-org/llama.cpp:server-cuda13-b9692
      -m /models/gemma-4-26B-A4B-it-qat-UD-Q4_K_XL.gguf
      -md /models/gemma-4-26B-A4B-it-Q8_0-MTP.gguf
      --spec-type draft-mtp
      --spec-draft-n-max 2
      -ngl 99
      -ngld 99
      -c 256000
      --tensor-split 1,1
      -np 1
      -fa on
      --no-mmap
      --mlock
      -b 2048
      -ub 512
      -ctk q8_0
      -ctv q8_0
      --temp 0.6
      --top-p 0.95
      --top-k 64
      --min-p 0.0
      --timeout 900
      --no-context-shift
      --ctx-checkpoints 128
      --host 0.0.0.0
      --port 8080
    cmdStop: docker stop g26moe


  # ################ #
  # EMBEDDING MODELS #
  # ################ #

  bge-m3:
    unlisted: true
    cmd: |
      docker run --rm --name bge --runtime nvidia --cap-add SYS_ADMIN
      -p ${PORT}:8080 -v /mnt/shared/models:/models
      --entrypoint /app/llama-server ghcr.io/mostlygeek/llama-swap:cuda
      -m /models/bge-m3-FP16.gguf
      --host 0.0.0.0
      --port 8080
      --ctx-size 8192
      --batch-size 8192
      --rope-scaling yarn
      --rope-freq-scale 0.75
      -ngl 99
      --embeddings
      --no-mmap
    cmdStop: docker stop bge

  # Qwen3-Embedding-4B (added 2026-07-04): upgrade over bge-m3 for CODE retrieval.
  # Qwen3-Embedding is explicitly trained for code + 100 languages, tops MTEB, and is
  # vLLM-native (same ecosystem as the LLMs). 4B = quality/VRAM sweet spot on a 16GB
  # card (~8GB BF16, loads on one GPU, no TP). Use for indexing a codebase for RAG.
  # bge-m3 kept above for general multilingual dense+sparse; this one for code search.
  #
  # HARD-WON SETUP NOTES (2026-07-04):
  #  - `--runner pooling` is the embedding flag in vLLM 0.22 (the old `--task embed`
  #    is gone). It auto-configures LAST-token pooling for Qwen3-Embedding.
  #  - `--enforce-eager`: skip torch.compile/cudagraph capture. Right call for a
  #    swap-in embedder (fast start > peak throughput; a single forward pass barely
  #    benefits from cudagraphs). Without it, first start compiles for many minutes.
  #  - LOCAL PATH + HF_HUB_OFFLINE=1: point at the pre-downloaded dir, NOT the HF id.
  #    With the HF id, vLLM makes unauthenticated HF Hub calls at load that get
  #    rate-limited and HANG forever (model loads to VRAM then sits at 0% util). The
  #    model was snapshot_download'd to /mnt/shared/models/Qwen3-Embedding-4B.
  #  - Pinned to one card (device 0). Embedding needs no TP; llama-swap serves one
  #    model at a time so it has the GPU to itself. Query the OpenAI /v1/embeddings
  #    endpoint with model=qwen3-embedding-4b. NB Qwen3-Embedding wants an instruction
  #    prefix on QUERIES (not documents) for best retrieval -- that's a client concern.
  qwen3-embedding-4b:
    unlisted: true
    cmd: |
      docker run --rm --name qwen3emb --runtime nvidia --ipc=host
      -e HF_HUB_OFFLINE=1 -e TRANSFORMERS_OFFLINE=1
      -e CUDA_DEVICE_ORDER=PCI_BUS_ID -e CUDA_VISIBLE_DEVICES=0
      -e VLLM_NO_USAGE_STATS=1
      -p ${PORT}:8000 -v /mnt/shared/models:/models
      vllm/vllm-openai:v0.22.0
      --model /models/Qwen3-Embedding-4B
      --runner pooling
      --enforce-eager
      --served-model-name qwen3-embedding-4b
      --max-model-len 8192
      --gpu-memory-utilization 0.60
      --host 0.0.0.0
      --port 8000
    cmdStop: docker stop qwen3emb
