[Service]
# Remove any orphaned container holding port 8033 before (re)starting.
# The leading '-' makes a missing container non-fatal.
ExecStartPre=-docker rm -f llama-swap

# Reset then redefine ExecStart with a stable --name so stop/cleanup is reliable.
ExecStart=
ExecStart=docker run --rm --name llama-swap --runtime nvidia --cap-add SYS_ADMIN -p 8033:8080 \
 -v /home/jim/models:/models \
 -v /home/jim/llama-swap/config.yaml:/app/config.yaml \
 ghcr.io/mostlygeek/llama-swap:cuda

# Stop the container gracefully via docker instead of letting systemd SIGKILL
# the client (which orphaned the port and caused the restart cascade).
ExecStop=-docker stop llama-swap

# Give a large model time to unload before the stop is considered failed.
TimeoutStopSec=60
