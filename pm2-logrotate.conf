# Rotation for pm2 application logs.
#
# copytruncate is required: pm2 holds the log file handles open and has
# no signal to reopen them, so we copy the log out and truncate in place
# (the open fd stays valid). A few in-flight buffered lines may be lost
# at the rotation instant — acceptable for app logs.
#
# Installs as /etc/logrotate.d/pm2 (logrotate.timer is active on marvin).
#   sudo cp ~/llama-swap/pm2-logrotate.conf /etc/logrotate.d/pm2
# Verify with a dry run:
#   sudo logrotate -d /etc/logrotate.d/pm2

/home/jim/.pm2/logs/*.log {
    size 100M
    rotate 10
    compress
    delaycompress
    copytruncate
    missingok
    notifempty
}
